[versions]
agp = "8.12.3"
kotlin = "2.1.20"
webkit = "1.17.1"
activity = "1.13.0"
coreKtx = "1.17.0"
playBilling = "8.0.0"
# Play Billing pulls in an old androidx.fragment; activity-result APIs need >= 1.3.
fragment = "1.8.9"
playAuthPhone = "18.2.0"
junit = "4.13.2"
json = "20260814"
androidxTestRunner = "1.7.0"
androidxTestCore = "1.7.0"
androidxTestExt = "1.3.0"

[libraries]
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
play-billing = { module = "com.android.billingclient:billing", version.ref = "playBilling" }
play-auth-phone = { module = "com.google.android.gms:play-services-auth-api-phone", version.ref = "playAuthPhone" }
androidx-fragment = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
