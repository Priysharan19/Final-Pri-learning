# Dependabot keeps the three npm trees and every pinned GitHub Action current.
# Action bumps arrive as full-SHA updates with the version comment refreshed,
# so tools/ci-workflow-policy-check.mjs keeps passing. Dependabot branches are
# not autonomous missions: they merge only through the ordinary reviewed PR
# lanes and required CI (docs/release/release-policy.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      client-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Post-launch majors (#512; V1 decisions of 1 November 2026): React 19
      # waits until the browser, accessibility and native journeys have been
      # re-run on the new runtime. Minor and patch updates still arrive, and a
      # security advisory on an ignored major still raises a Dependabot alert.
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      server-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Express 5 is post-launch (#512): its router and body-parser semantics
      # change the request path every server test pins. better-sqlite3 majors
      # change the native ABI the Railway image builds against; they land with
      # a container rebuild, not a weekly bump.
      - dependency-name: express
        update-types: ['version-update:semver-major']
      - dependency-name: better-sqlite3
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /ad
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      # /ad is the unshipped video folder; majors there (React 19 #554,
      # TypeScript 7 #555) have no launch value and only add CI load.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # github/codeql-action/init and /analyze are separate dependencies to
      # Dependabot but must run the same version (#466 bumped only analyze
      # and CodeQL failed on all eleven of its heads).
      codeql-action:
        patterns: ['github/codeql-action*']
      # actions/checkout, actions/setup-node, upload/download-artifact and
      # github-script move in one PR instead of one rebase storm each (#462
      # and #468 restarted ~40 workflows per rebase, cancelling each other).
      github-actions-core:
        patterns: ['actions/*']
