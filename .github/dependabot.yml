# Dependabot keeps the three npm trees and every pinned GitHub Action current.
# Action bumps arrive as full-SHA updates with the version comment refreshed,
# so tools/ci-workflow-policy-check.mjs keeps passing. Dependabot branches are
# not autonomous missions: they merge only through the ordinary reviewed PR
# lanes and required CI (docs/release/release-policy.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      client-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      server-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /ad
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # github/codeql-action/init and /analyze are separate dependencies to
      # Dependabot but must run the same version (#466 bumped only analyze
      # and CodeQL failed on all eleven of its heads).
      codeql-action:
        patterns: ['github/codeql-action*']
      # actions/checkout, actions/setup-node, upload/download-artifact and
      # github-script move in one PR instead of one rebase storm each (#462
      # and #468 restarted ~40 workflows per rebase, cancelling each other).
      github-actions-core:
        patterns: ['actions/*']
