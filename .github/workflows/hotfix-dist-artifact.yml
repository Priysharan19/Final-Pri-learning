name: Hotfix dist artifact

on:
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/hotfix-dist-artifact.yml'

permissions:
  contents: read

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: hotfix-client-dist
          path: client/dist
          if-no-files-found: error
          retention-days: 1
