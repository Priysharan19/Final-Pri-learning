name: Hotfix iOS bundle sync

on:
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/hotfix-dist-artifact.yml'

permissions:
  contents: write

jobs:
  sync-ios-bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client
      - run: npm run build
      - name: Sync both tracked iPad bundles
        run: node scripts/sync-ios.mjs
      - name: Commit exact generated bundles to PR branch
        run: |
          git config user.name "pri-learning-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -- 'ios/PriLearning.swiftpm/Resources/Web' 'ios/PriLearning 2.swiftpm/Resources/Web'
          if git diff --cached --quiet; then
            echo "iOS bundles already match the client build."
            exit 0
          fi
          git commit -m "Sync iPad web bundles for single-glyph hotfix"
          git push origin "HEAD:${{ github.head_ref }}"
