name: Pri Reason V2 Curriculum Rollout Temp

on:
  push:
    branches:
      - feature/pri-reason-v2-curriculum-rollout

permissions:
  contents: write

jobs:
  rollout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch authored reasoning metadata and regression gate
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {s.count(old)}')
              p.write_text(s.replace(old, new, 1))

          year11 = 'client/src/engine/generators/year11.js'
          replace_once(
              year11,
              """        answerPrefix: 'dy/dx =',\n        traps: [\n""",
              """        answerPrefix: 'dy/dx =',\n        stepcheck: { kind: 'derivative', variable: 'x', source: `${a}x^${n}`, canonical: `${a * n}x^${n - 1}` },\n        traps: [\n""",
              'Year 11 D1 derivative metadata'
          )
          replace_once(
              year11,
              """        answerPrefix: \"f '(x) =\",\n        traps: [{ expr: `${3 * a}x^2 + ${2 * b}x + ${c === 0 ? 1 : c}x`, why: `The derivative of $${c}x$ is just $${c}$ — and the constant ${d} vanishes.` }],\n""",
              """        answerPrefix: \"f '(x) =\",\n        stepcheck: { kind: 'derivative', variable: 'x', source: poly([a, b, c, d]), canonical: `${3 * a}x^2 + ${2 * b}x + ${c}` },\n        traps: [{ expr: `${3 * a}x^2 + ${2 * b}x + ${c === 0 ? 1 : c}x`, why: `The derivative of $${c}x$ is just $${c}$ — and the constant ${d} vanishes.` }],\n""",
              'Year 11 D2 derivative metadata'
          )

          india = 'client/src/engine/generators/india-algebra.js'
          p = Path(india)
          s = p.read_text()
          start = s.index("  'c11-linear-inequalities': (rng, diff) => {")
          end = s.index("\n  // ── Class 11 · Binomial Theorem", start)
          block = s[start:end]
          old = """        prompt: `Solve $${a}x ${b >= 0 ? '+' : '-'} ${Math.abs(b)} ${dir} ${k}$.`,\n        answerType: 'mcq', answer: { correctIndex: m.correctIndex, optionTraps: m.optionTraps }, mcqOptions: m.options,\n        hints: [\n"""
          new1 = """        prompt: `Solve $${a}x ${b >= 0 ? '+' : '-'} ${Math.abs(b)} ${dir} ${k}$.`,\n        answerType: 'mcq', answer: { correctIndex: m.correctIndex, optionTraps: m.optionTraps }, mcqOptions: m.options,\n        stepcheck: { kind: 'inequality', source: `${a}x ${b >= 0 ? '+' : '-'} ${Math.abs(b)} ${dir} ${k}`, canonical: `x ${dir} ${bound}` },\n        hints: [\n"""
          if block.count(old) != 2:
              raise SystemExit(f'India inequality anchors: expected two solve blocks, found {block.count(old)}')
          block = block.replace(old, new1, 1)
          old2 = """        prompt: `Solve $${a}x ${b >= 0 ? '+' : '-'} ${Math.abs(b)} ${dir} ${k}$.`,\n        answerType: 'mcq', answer: { correctIndex: m.correctIndex, optionTraps: m.optionTraps }, mcqOptions: m.options,\n        hints: [\n"""
          new2 = """        prompt: `Solve $${a}x ${b >= 0 ? '+' : '-'} ${Math.abs(b)} ${dir} ${k}$.`,\n        answerType: 'mcq', answer: { correctIndex: m.correctIndex, optionTraps: m.optionTraps }, mcqOptions: m.options,\n        stepcheck: { kind: 'inequality', source: `${a}x ${b >= 0 ? '+' : '-'} ${Math.abs(b)} ${dir} ${k}`, canonical: `x ${flipped} ${bound}` },\n        hints: [\n"""
          if block.count(old2) != 1:
              raise SystemExit(f'India D2 inequality anchor: expected one remaining block, found {block.count(old2)}')
          block = block.replace(old2, new2, 1)
          p.write_text(s[:start] + block + s[end:])

          test = Path('client/test/pri-reason-curriculum-check.mjs')
          test.write_text(r'''// Pri Learning · Pri Reason V2 authored-curriculum integration gate
// This gate verifies that production generators opt into V2 only where the
// generated question itself carries exact machine-readable reasoning metadata.

import { makeRng } from '../src/engine/qhelpers.js';
import { year11 } from '../src/engine/generators/year11.js';
import { indiaAlgebra } from '../src/engine/generators/india-algebra.js';
import { stepCheck } from '../src/engine/checker.js';

let pass = 0;
let fail = 0;
const failures = [];
const ok = (label, cond) => {
  if (cond) pass++;
  else { fail++; failures.push(label); }
};
const same = (label, got, want) => ok(`${label}: got ${JSON.stringify(got)}, want ${JSON.stringify(want)}`, got === want);

console.log('PRI REASON V2 — authored curriculum integration\n');

for (const difficulty of [1, 2]) {
  const q = year11['y11-diff'](makeRng(0x521100 + difficulty), difficulty);
  same(`Year 11 differentiation D${difficulty} declares derivative reasoning`, q.stepcheck?.kind, 'derivative');
  same(`Year 11 differentiation D${difficulty} variable`, q.stepcheck?.variable, 'x');
  ok(`Year 11 differentiation D${difficulty} carries source`, typeof q.stepcheck?.source === 'string' && q.stepcheck.source.length > 0);
  ok(`Year 11 differentiation D${difficulty} carries canonical derivative`, typeof q.stepcheck?.canonical === 'string' && q.stepcheck.canonical.length > 0);

  let r = stepCheck(q.stepcheck, `dy/dx = ${q.stepcheck.canonical}`);
  same(`Year 11 differentiation D${difficulty} canonical line verifies`, r.firstBreak, -1);
  same(`Year 11 differentiation D${difficulty} canonical status`, r.lines[0]?.status, 'ok');

  r = stepCheck(q.stepcheck, 'dy/dx = 0');
  same(`Year 11 differentiation D${difficulty} wrong derivative breaks`, r.firstBreak, 0);
  same(`Year 11 differentiation D${difficulty} wrong derivative diagnosis`, r.diagnosis?.code, 'derivative-error');
}

// D3/D4 deliberately mix differentiation with substitution/equation solving.
// Until working plans can change verifier kind between lines, they must not be
// labelled as a single derivative proof.
for (const difficulty of [3, 4]) {
  const q = year11['y11-diff'](makeRng(0x521100 + difficulty), difficulty);
  ok(`Year 11 differentiation D${difficulty} remains outside single-operation V2 metadata`, !q.stepcheck);
}

for (const difficulty of [1, 2]) {
  const q = indiaAlgebra['c11-linear-inequalities'](makeRng(0x110000 + difficulty), difficulty);
  same(`Class 11 inequality D${difficulty} declares relation reasoning`, q.stepcheck?.kind, 'inequality');
  ok(`Class 11 inequality D${difficulty} carries source`, typeof q.stepcheck?.source === 'string' && q.stepcheck.source.length > 0);
  ok(`Class 11 inequality D${difficulty} carries canonical relation`, typeof q.stepcheck?.canonical === 'string' && q.stepcheck.canonical.length > 0);

  let r = stepCheck(q.stepcheck, `${q.stepcheck.source}\n${q.stepcheck.canonical}`);
  same(`Class 11 inequality D${difficulty} correct chain has no break`, r.firstBreak, -1);
  ok(`Class 11 inequality D${difficulty} correct chain is positively verified`, r.lines.every(line => line.status === 'ok'));

  if (difficulty === 2) {
    const wrong = q.stepcheck.canonical.replace(/[<>]/, c => c === '<' ? '>' : '<');
    r = stepCheck(q.stepcheck, `${q.stepcheck.source}\n${wrong}`);
    same('Class 11 negative-coefficient inequality catches missed sign flip', r.firstBreak, 1);
    same('Class 11 negative-coefficient inequality names direction error', r.diagnosis?.code, 'inequality-direction');
  }
}

// Chained and modulus forms are intentionally outside the current single-
// relation parser. They must remain unlabelled rather than receiving a verifier
// that cannot represent their whole solution claim.
for (const difficulty of [3, 4]) {
  const q = indiaAlgebra['c11-linear-inequalities'](makeRng(0x110000 + difficulty), difficulty);
  ok(`Class 11 inequality D${difficulty} remains outside single-relation V2 metadata`, !q.stepcheck);
}

console.log(`\n${pass} passed, ${fail} failed`);
if (failures.length) {
  console.error('\nFailures:');
  failures.forEach(f => console.error(`  - ${f}`));
  process.exit(1);
}
console.log('Pri Reason V2 curriculum integration gate: PASS');
''')

          wf = Path('.github/workflows/pri-reason.yml')
          w = wf.read_text()
          needle = "      - 'client/test/pri-reason-v2-check.mjs'\n"
          addition = needle + "      - 'client/test/pri-reason-curriculum-check.mjs'\n      - 'client/src/engine/generators/year11.js'\n      - 'client/src/engine/generators/india-algebra.js'\n"
          if w.count(needle) != 2:
              raise SystemExit(f'Pri Reason workflow path anchor: expected 2, found {w.count(needle)}')
          w = w.replace(needle, addition)
          run_anchor = """      - name: Pri Reason V2 safety gate\n        run: node client/test/pri-reason-v2-check.mjs\n"""
          run_add = run_anchor + """      - name: Pri Reason V2 curriculum integration gate\n        run: node client/test/pri-reason-curriculum-check.mjs\n"""
          if w.count(run_anchor) != 1:
              raise SystemExit('Pri Reason workflow run anchor changed')
          wf.write_text(w.replace(run_anchor, run_add, 1))
      - name: Run reasoning gates before generated bundle sync
        run: |
          node client/test/pri-reason-check.mjs
          node client/test/pri-reason-v2-check.mjs
          node client/test/pri-reason-curriculum-check.mjs
          node client/test/diagnose-check.mjs
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Build client and sync both iPad bundles
        run: |
          npm run build
          npm run sync:ios
          npm run check:ios
      - name: Commit rollout and generated iPad bundles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/engine/generators/year11.js client/src/engine/generators/india-algebra.js client/test/pri-reason-curriculum-check.mjs .github/workflows/pri-reason.yml ios/PriLearning.swiftpm/Resources/Web 'ios/PriLearning 2.swiftpm/Resources/Web'
          git commit -m 'Activate Pri Reason V2 in authored calculus and inequalities'
          git push origin HEAD:feature/pri-reason-v2-curriculum-rollout
