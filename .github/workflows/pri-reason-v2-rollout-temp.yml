name: Pri Reason V2 Curriculum Rollout Temp

on:
  push:
    branches:
      - feature/pri-reason-v2-curriculum-rollout

permissions:
  contents: write

jobs:
  rollout:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply authored reasoning rollout
        run: python3 tools/pri-reason-v2-rollout-temp.py
      - name: Run deterministic reasoning gates
        run: |
          node client/test/pri-reason-check.mjs
          node client/test/pri-reason-v2-check.mjs
          node client/test/pri-reason-curriculum-check.mjs
          node client/test/diagnose-check.mjs
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Build and sync tracked iPad bundles
        run: |
          npm run build
          npm run sync:ios
          npm run check:ios
      - name: Commit tested product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/engine/generators/year11.js client/src/engine/generators/india-algebra.js client/test/pri-reason-curriculum-check.mjs ios/PriLearning.swiftpm/Resources/Web 'ios/PriLearning 2.swiftpm/Resources/Web'
          git commit -m 'Activate Pri Reason V2 in authored calculus and inequalities'
          git push origin HEAD:feature/pri-reason-v2-curriculum-rollout
