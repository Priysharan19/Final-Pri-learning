name: Promotions

on:
  push:
    paths:
      - 'promotions/**'
      - '.github/workflows/promotions.yml'
  pull_request:
    paths:
      - 'promotions/**'
      - '.github/workflows/promotions.yml'

permissions:
  contents: read

jobs:
  test:
    name: One-time reward integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install promotions dependencies
        run: npm install --prefix promotions --ignore-scripts --no-audit --no-fund
      - name: Run promotions unit and HTTP integration tests
        run: npm test --prefix promotions
