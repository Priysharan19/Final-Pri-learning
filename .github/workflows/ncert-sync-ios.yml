name: Temporary NCERT iOS bundle sync

on:
  push:
    branches:
      - feature/ncert-class8-rational-complete

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ncert-class8-rational-complete
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Build client
        run: npm run build
      - name: Synchronise tracked iPad web bundles
        run: npm run sync:ios
      - name: Commit generated iPad bundle
        shell: bash
        run: |
          if git diff --quiet -- ios; then
            echo "iOS bundle already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios
          git commit -m "Sync iPad web bundle for NCERT Rational Numbers"
          git push origin HEAD:feature/ncert-class8-rational-complete
