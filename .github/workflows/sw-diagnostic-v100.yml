name: One-shot service worker diagnostic

on:
  push:
    branches:
      - backend-v100-foundation

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[sw-diagnostic-request]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backend-v100-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client
      - run: npm run build
      - working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Inspect service-worker lifecycle in Chromium
        run: |
          cat > /tmp/swdiag.mjs <<'NODE'
          import { chromium } from './client/node_modules/@playwright/test/index.js';
          import { createServer } from 'node:http';
          import { readFile, stat } from 'node:fs/promises';
          import { join, extname } from 'node:path';
          const root = join(process.cwd(), 'client', 'dist');
          const mime = {'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.css':'text/css','.json':'application/json','.webmanifest':'application/manifest+json','.svg':'image/svg+xml','.png':'image/png','.woff':'font/woff','.woff2':'font/woff2','.ttf':'font/ttf'};
          const server = createServer(async (req,res)=>{
            const u = new URL(req.url,'http://127.0.0.1');
            let path = decodeURIComponent(u.pathname);
            if (path.endsWith('/')) path += 'index.html';
            let file = join(root, path);
            try { if ((await stat(file)).isDirectory()) file = join(file,'index.html'); }
            catch { if (!extname(path)) file = join(root,'index.html'); else { res.writeHead(404).end('missing'); return; } }
            try { const b=await readFile(file); res.writeHead(200,{'content-type':mime[extname(file)]||'application/octet-stream','cache-control':'no-store'}); res.end(b); }
            catch(e){ res.writeHead(500).end(String(e)); }
          });
          await new Promise(r=>server.listen(0,'127.0.0.1',r));
          const base=`http://127.0.0.1:${server.address().port}`;
          const browser=await chromium.launch();
          const ctx=await browser.newContext();
          ctx.on('serviceworker', w => console.log('CTX serviceworker:', w.url()));
          const page=await ctx.newPage();
          page.on('console', m=>console.log('PAGE console:',m.type(),m.text()));
          page.on('pageerror', e=>console.log('PAGE error:',String(e)));
          await page.goto(base+'/',{waitUntil:'load'});
          async function snap(label){
            const s=await page.evaluate(async()=>({
              label: document.readyState,
              secure: isSecureContext,
              native: window.__PRI_NATIVE__,
              swInNavigator: 'serviceWorker' in navigator,
              controller: navigator.serviceWorker?.controller?.scriptURL || null,
              regs: navigator.serviceWorker ? (await navigator.serviceWorker.getRegistrations()).map(r=>({scope:r.scope,installing:r.installing?.state||null,waiting:r.waiting?.state||null,active:r.active?.state||null,script:r.active?.scriptURL||r.installing?.scriptURL||r.waiting?.scriptURL||null})) : []
            }));
            console.log(label, JSON.stringify(s));
            console.log(label,'context workers',ctx.serviceWorkers().map(w=>w.url()));
          }
          await snap('t0');
          for (const ms of [500,1500,5000,15000,30000]) { await page.waitForTimeout(ms); await snap('after+'+ms); }
          const swResp=await page.request.get(base+'/sw.js');
          console.log('sw response',swResp.status(),swResp.headers()['content-type'],(await swResp.text()).slice(0,180));
          await browser.close();
          await new Promise(r=>server.close(r));
          NODE
          node /tmp/swdiag.mjs
