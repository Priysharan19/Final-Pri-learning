name: Ink Structural V4 Combined Candidate

on:
  pull_request:
    paths:
      - 'tools/ink-foundation/**'
      - 'scripts/ink-structural-candidate-dev.sh'
      - '.github/workflows/ink-structural-v4-candidate.yml'
  workflow_dispatch:

jobs:
  factorial:
    name: Joint validity x pooled relation factorial
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/ink-foundation/requirements.txt
      - name: Syntax and evidence boundary
        run: |
          python -m py_compile \
            tools/ink-foundation/compare_structural_factorial.py \
            tools/ink-foundation/test_structural_factorial.py
          bash -n scripts/ink-structural-candidate-dev.sh
          grep -q 'same-writer development only' scripts/ink-structural-candidate-dev.sh
          grep -q 'production ready: false' scripts/ink-structural-candidate-dev.sh
          if grep -q -- '--unlock-final-holdout' scripts/ink-structural-candidate-dev.sh; then
            echo 'combined candidate runner must never unlock final holdout' >&2
            exit 1
          fi
      - name: Deterministic factorial contracts
        run: python tools/ink-foundation/test_structural_factorial.py
      - name: Install pinned V4 dependencies
        run: python -m pip install -r tools/ink-foundation/requirements.txt
      - name: Generate exact writer-disjoint structural smoke corpus
        run: |
          node tools/ink-foundation/generate_structural_synthetic.mjs /tmp/pri-ink-v4-factorial 3 2 4
          python tools/ink-foundation/audit_structural.py /tmp/pri-ink-v4-factorial --require-all
      - name: Train one frozen base for all four variants
        run: |
          python tools/ink-foundation/train_structural.py \
            --corpus /tmp/pri-ink-v4-factorial --out /tmp/pri-ink-v4-factorial-base.pt \
            --epochs 1 --batch 4 --device cpu --d-model 64 \
            --point-layers 1 --stroke-layers 1 --max-strokes 64 \
            --max-points-per-stroke 96 --patience 1
      - name: Train hash-bound component validity V2
        run: |
          python tools/ink-foundation/train_component_validity.py \
            /tmp/pri-ink-v4-factorial-base.pt --corpus /tmp/pri-ink-v4-factorial \
            --out /tmp/pri-ink-v4-factorial-validity.pt --mode writer-disjoint \
            --epochs 4 --batch 4 --device cpu --max-negatives 24 --patience 4
      - name: Train hash-bound pooled group relation V2
        run: |
          python tools/ink-foundation/train_group_relations.py \
            /tmp/pri-ink-v4-factorial-base.pt --corpus /tmp/pri-ink-v4-factorial \
            --out /tmp/pri-ink-v4-factorial-rel.pt --mode writer-disjoint \
            --epochs 8 --batch 4 --device cpu --patience 8
      - name: Evaluate relation factor with component validity disabled
        run: |
          python tools/ink-foundation/evaluate_group_relations.py \
            /tmp/pri-ink-v4-factorial-base.pt /tmp/pri-ink-v4-factorial-rel.pt \
            --corpus /tmp/pri-ink-v4-factorial --mode writer-disjoint --decoder joint \
            --device cpu --out /tmp/pri-ink-v4-factorial-no-validity.json
      - name: Evaluate relation factor with component validity enabled
        run: |
          python tools/ink-foundation/evaluate_group_relations.py \
            /tmp/pri-ink-v4-factorial-base.pt /tmp/pri-ink-v4-factorial-rel.pt \
            --corpus /tmp/pri-ink-v4-factorial --mode writer-disjoint --decoder joint \
            --component-validity /tmp/pri-ink-v4-factorial-validity.pt \
            --device cpu --out /tmp/pri-ink-v4-factorial-with-validity.json
      - name: Build exact-same-base 2x2 report
        run: |
          python tools/ink-foundation/compare_structural_factorial.py \
            /tmp/pri-ink-v4-factorial-no-validity.json \
            /tmp/pri-ink-v4-factorial-with-validity.json \
            --out /tmp/pri-ink-v4-factorial-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('/tmp/pri-ink-v4-factorial-report.json').read_text())
          assert d['productionReady'] is False
          assert d['comparison'] == 'joint-validity-x-pooled-relations-factorial'
          assert d['groupRelationVersion'] == 2
          assert d['componentValidity']['version'] == 2
          assert d['validationProtocol']['writerDisjoint'] is True
          assert set(d['variants']) == {'baseline', 'validityOnly', 'pooledRelationsOnly', 'combined'}
          print('Exact-same-base V4 factorial evidence contract: PASS')
          PY
