name: Temporary Class 9 release assembly

on:
  push:
    branches:
      - feature/ncert-class9-complete

permissions:
  contents: write

jobs:
  assemble-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ncert-class9-complete
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Assemble and verify Grade 9 release
        run: node scripts/assemble-class9-release.mjs
