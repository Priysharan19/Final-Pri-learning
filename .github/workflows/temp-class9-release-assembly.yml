name: Temporary Class 9 release assembly

on:
  push:
    branches:
      - feature/ncert-class9-complete

permissions:
  contents: write

jobs:
  assemble-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ncert-class9-complete
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Register Class 9 bank routing and permanent test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('client/src/engine/generators/index.js')
          s=p.read_text()
          anchor="  'c9-statistics-grouped': 'india-junior',\n"
          block="""  'c9-coordinate-geometry-ncert-mastery': 'india-junior',
  'c9-linear-polynomials-ncert-mastery': 'india-junior',
  'c9-number-systems-ncert-mastery': 'india-junior',
  'c9-algebraic-identities-ncert-mastery': 'india-junior',
  'c9-circles-ncert-mastery': 'india-junior',
  'c9-perimeter-area-ncert-mastery': 'india-junior',
  'c9-probability-ncert-mastery': 'india-junior',
  'c9-sequences-progressions-ncert-mastery': 'india-junior',
"""
          if block not in s:
              if anchor not in s: raise SystemExit('generator routing anchor missing')
              p.write_text(s.replace(anchor,anchor+block))
          p=Path('package.json')
          s=p.read_text()
          if '"test:ncert:class9"' not in s:
              s=s.replace('"test:ncert:class8:rest": "node client/test/ncert-class8-ch3-13-check.mjs"', '"test:ncert:class8:rest": "node client/test/ncert-class8-ch3-13-check.mjs",\n    "test:ncert:class9": "node client/test/ncert-class9-check.mjs"')
              s=s.replace('npm run test:ncert:class8:rest && npm run test:explain', 'npm run test:ncert:class8:rest && npm run test:ncert:class9 && npm run test:explain')
              p.write_text(s)
          PY
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Syntax checks
        run: |
          node --check client/src/engine/ncert/class9-generators.js
          node --check client/src/engine/ncert/class9-content.js
          node --check client/src/engine/ncert/class9-chapters-production.js
          node --check client/test/ncert-class9-check.mjs
      - name: Grade 9 source answer bank and solution audit
        run: npm run test:ncert:class9
      - name: India curriculum integration
        run: npm run test:india
      - name: Preserve all Class 8 NCERT releases
        run: |
          npm run test:ncert:rational
          npm run test:ncert:linear
          npm run test:ncert:class8:rest
      - name: Deterministic maths engine
        run: npm run test:engine
      - name: Pri Explain and handwriting bridges
        run: |
          npm run test:explain
          npm run test:ink:bridge
          npm run test:photo:bridge
          npm run test:ink:interaction
      - name: Production client build
        run: npm run build
      - name: Synchronize tracked iPad bundles
        run: |
          npm run sync:ios
          npm run check:ios
      - name: Commit assembled exact candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/engine/generators/index.js package.json ios
          if git diff --cached --quiet; then
            echo 'No assembly changes to commit.'
          else
            git commit -m 'Assemble Grade 9 release and sync iPad bundles [class9-assembled]'
            git push origin HEAD:feature/ncert-class9-complete
          fi
