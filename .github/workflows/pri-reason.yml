name: Pri Reason

# Permanent precision gate for Pri Reason V1-V4 and authored curriculum rollout.
on:
  pull_request:
    paths:
      - 'client/src/engine/checker.js'
      - 'client/src/engine/checker-core.js'
      - 'client/src/engine/reason.js'
      - 'client/src/engine/reason-v2.js'
      - 'client/src/engine/reason-v2-safe.js'
      - 'client/src/engine/reason-v3.js'
      - 'client/src/engine/reason-v4.js'
      - 'client/src/engine/diagnose.js'
      - 'client/src/engine/expr.js'
      - 'client/test/pri-reason-check.mjs'
      - 'client/test/pri-reason-v2-check.mjs'
      - 'client/test/pri-reason-v3-check.mjs'
      - 'client/test/pri-reason-v4-check.mjs'
      - 'client/test/pri-reason-curriculum-check.mjs'
      - 'client/src/engine/generators/year11.js'
      - 'client/src/engine/generators/india-algebra.js'
      - 'client/test/diagnose-check.mjs'
      - '.github/workflows/pri-reason.yml'
  push:
    branches:
      - main
    paths:
      - 'client/src/engine/checker.js'
      - 'client/src/engine/checker-core.js'
      - 'client/src/engine/reason.js'
      - 'client/src/engine/reason-v2.js'
      - 'client/src/engine/reason-v2-safe.js'
      - 'client/src/engine/reason-v3.js'
      - 'client/src/engine/reason-v4.js'
      - 'client/src/engine/diagnose.js'
      - 'client/src/engine/expr.js'
      - 'client/test/pri-reason-check.mjs'
      - 'client/test/pri-reason-v2-check.mjs'
      - 'client/test/pri-reason-v3-check.mjs'
      - 'client/test/pri-reason-v4-check.mjs'
      - 'client/test/pri-reason-curriculum-check.mjs'
      - 'client/src/engine/generators/year11.js'
      - 'client/src/engine/generators/india-algebra.js'
      - 'client/test/diagnose-check.mjs'
      - '.github/workflows/pri-reason.yml'

permissions:
  contents: read

jobs:
  reason-safety:
    name: Mathematical reasoning safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Pri Reason V1 regression gate
        run: node client/test/pri-reason-check.mjs
      - name: Pri Reason V2 safety gate
        run: node client/test/pri-reason-v2-check.mjs
      - name: Pri Reason V3 proof-plan and domain gate
        run: node client/test/pri-reason-v3-check.mjs
      - name: Pri Reason V4 solution-region gate
        run: node client/test/pri-reason-v4-check.mjs
      - name: Pri Reason authored curriculum integration gate
        run: node client/test/pri-reason-curriculum-check.mjs
      - name: Existing diagnosis regression gate
        run: node client/test/diagnose-check.mjs
