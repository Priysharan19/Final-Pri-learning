name: Ink Physical Study Operations

on:
  pull_request:
    paths:
      - 'client/src/ink/productionEvidence.js'
      - 'client/test/ink-physical-study-plan-check.mjs'
      - 'scripts/ink-physical-study-status.mjs'
      - 'handwriting/v12/PHYSICAL_STUDY_PLAN.json'
      - 'handwriting/v12/PHYSICAL_STUDY_RUNBOOK.md'
      - 'handwriting/v12/evidence/physical/**'
      - '.github/workflows/ink-physical-study.yml'
  push:
    branches: [main]
    paths:
      - 'client/src/ink/productionEvidence.js'
      - 'client/test/ink-physical-study-plan-check.mjs'
      - 'scripts/ink-physical-study-status.mjs'
      - 'handwriting/v12/PHYSICAL_STUDY_PLAN.json'
      - 'handwriting/v12/PHYSICAL_STUDY_RUNBOOK.md'
      - 'handwriting/v12/evidence/physical/**'
      - '.github/workflows/ink-physical-study.yml'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate deterministic writer allocation and study capacity
        run: node client/test/ink-physical-study-plan-check.mjs
      - name: Report current test-set collection status
        run: node scripts/ink-physical-study-status.mjs --split test
