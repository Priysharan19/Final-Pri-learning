name: Temporary Ink V14 decoder-safe build

on:
  push:
    branches:
      - feature/ink-v14-decoder-safe

jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ink-v14-decoder-safe
          fetch-depth: 0

      - name: Guard generated commit
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq '[decoder-safe-generated]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Patch decoder twins only
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          classes = Path('client/src/ink/classes.js')
          s = classes.read_text()
          old = """export function classOfSymbol(sym) {\n  if (sym === '0' || sym === 'o') return '0o';\n  if (sym === '1' || sym === 'l') return '1l';\n  return sym;\n}\n"""
          new = """export function classOfSymbol(sym) {\n  if (sym === '0' || sym === 'o' || sym === 'O') return '0o';\n  if (sym === '1' || sym === 'l') return '1l';\n  if (sym === '*') return 'x';\n  return sym;\n}\n"""
          if old not in s:
              raise SystemExit('classes.js classOfSymbol anchor changed')
          s = s.replace(old, new, 1)

          old = """/** All symbols a CNN class may stand for — the decoder chooses among these. */\nexport function symbolsOfClass(cls) {\n  if (cls === '0o') return ['0', 'o'];\n  if (cls === '1l') return ['1', 'l'];\n  return [cls];\n}\n"""
          new = """/** All symbols a CNN class may stand for — the decoder chooses among these.\n *  Capital O and the times sign carry no independent raster class: O is a\n *  0/o ring and * is a small x. Context and geometry must earn the reading. */\nexport function symbolsOfClass(cls) {\n  if (cls === '0o') return ['0', 'o', 'O'];\n  if (cls === '1l') return ['1', 'l'];\n  if (cls === 'x') return ['x', '*'];\n  return [cls];\n}\n"""
          if old not in s:
              raise SystemExit('classes.js symbolsOfClass anchor changed')
          classes.write_text(s.replace(old, new, 1))

          rec = Path('client/src/ink/recognizer.js')
          r = rec.read_text()

          old = "const UNIGRAM = { l: -1.15, o: -1.15, ':': -0.45, '!=': -0.55, div: -0.30 };"
          new = """const UNIGRAM = {\n  l: -1.15, o: -1.15, ':': -0.45, '!=': -0.55, div: -0.30,\n  // '*' shares the x visual class and must be earned from a genuinely\n  // multiplicative slot rather than becoming a free grammar bridge.\n  '*': -0.55\n};"""
          if old not in r:
              raise SystemExit('recognizer.js UNIGRAM anchor changed')
          r = r.replace(old, new, 1)

          old = """  const candLists = line.map(s => {\n    if (overrides[s.id] || s.composite || s._geo) return [{ sym: s.sym, conf: Math.max(s.conf, 0.9) }];\n    const seen = new Set([s.sym]);\n    const list = [{ sym: s.sym, conf: Math.max(0.02, s.conf) }];\n    for (const a of s.alts || []) {\n      if (seen.has(a.sym) || a.conf < 0.06) continue;\n      seen.add(a.sym);\n      list.push({ sym: a.sym, conf: a.conf });\n      if (list.length >= MAX_CANDS) break;\n    }\n"""
          new = """  // '*' is an x-class decoder twin, but it is only admitted in a real\n  // multiplicative slot: depth zero, a value on the left and a digit on the\n  // right. This prevents the operator reading from bridging unrelated noisy\n  // glyphs while preserving arithmetic such as 7*8 and x*4k.\n  let starDepth = 0;\n  const starAllowed = line.map((s, i) => {\n    const ok = starDepth === 0 &&\n      i > 0 && i < line.length - 1 &&\n      /^[0-9]$/.test(line[i + 1].sym) &&\n      (/^[0-9a-zA-Z)]$/.test(line[i - 1].sym) || line[i - 1].sym === 'pi' || line[i - 1].sym === 'theta');\n    if (s.sym === '(') starDepth++;\n    else if (s.sym === ')') starDepth = Math.max(0, starDepth - 1);\n    return ok;\n  });\n\n  const candLists = line.map((s, i) => {\n    if (overrides[s.id] || s.composite || s._geo) return [{ sym: s.sym, conf: Math.max(s.conf, 0.9) }];\n    const seen = new Set([s.sym]);\n    const list = [{ sym: s.sym, conf: Math.max(0.02, s.conf) }];\n    for (const a of s.alts || []) {\n      if (seen.has(a.sym) || a.conf < 0.06) continue;\n      if (a.sym === '*' && !starAllowed[i]) continue;\n      seen.add(a.sym);\n      list.push({ sym: a.sym, conf: a.conf });\n      if (list.length >= MAX_CANDS) break;\n    }\n"""
          if old not in r:
              raise SystemExit('recognizer.js beam candidate anchor changed')
          r = r.replace(old, new, 1)

          old = """  // grammar beam: uncertain lines re-decoded against the maths-syntax prior\n  trace('pre-beam', linesPre);\n"""
          new = """  // Capital O is also a decoder twin of the 0/o ring. When two baseline\n  // rings share a line and one is at least 1.5x the other's height, geometry\n  // provides evidence the raster class cannot: the tall ring is a capital O.\n  // Degree-sized or raised rings are excluded so ordinary 0/deg ambiguity is\n  // never promoted into a capital.\n  for (const ls of linesPre) {\n    const full = ls.filter(s => s.box.h >= 0.55 * medianH);\n    if (!full.length) continue;\n    const base = median(full.map(s => s.box.y2));\n    const band = Math.max(base - median(full.map(s => s.box.y1)), 1e-6);\n    const rings = ls.filter(s => !s.composite && !overrides[s.id] &&\n      (s.sym === '0' || s.sym === 'o') &&\n      (s.alts || []).some(a => a.sym === 'O') &&\n      base - s.box.y2 <= 0.30 * band);\n    if (rings.length < 2) continue;\n    const minH = Math.min(...rings.map(s => s.box.h));\n    if (minH < 0.50 * medianH) continue;\n    for (const s of rings) {\n      const asp = s.box.w / Math.max(s.box.h, 1e-6);\n      if (s.box.h >= 1.5 * minH && s.box.h >= 0.75 * medianH && asp >= 0.6 && asp <= 1.45) {\n        s.sym = 'O';\n        s.conf = Math.max(s.conf, 0.9);\n        s._geo = true;\n      }\n    }\n  }\n\n  // grammar beam: uncertain lines re-decoded against the maths-syntax prior\n  trace('pre-beam', linesPre);\n"""
          if old not in r:
              raise SystemExit('recognizer.js pre-beam anchor changed')
          rec.write_text(r.replace(old, new, 1))
          PY

      - name: Install client dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci --prefix client

      - name: Regression checks
        if: steps.guard.outputs.skip != 'true'
        run: |
          npm run test:ink
          npm run test:hard
          npm run test:lines
          npm run test:holdout2
          npm run test:holdout3

      - name: Build and sync iPad bundles
        if: steps.guard.outputs.skip != 'true'
        run: |
          npm run build
          npm run sync:ios
          npm run check:ios

      - name: Commit decoder-safe variant
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name 'Pri Learning Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add client/src/ink/classes.js client/src/ink/recognizer.js ios
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 1
          fi
          git commit -m 'Ink V14: safe decoder-only O/* release [decoder-safe-generated]'
          git push origin HEAD:feature/ink-v14-decoder-safe
