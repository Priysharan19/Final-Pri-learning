name: Pilot evidence privacy gate

on:
  pull_request:
    paths:
      - 'client/src/local/pilotExport.js'
      - 'client/src/components/PilotEvidencePanel.jsx'
      - 'client/src/pages/Settings.jsx'
      - 'client/test/pilot-evidence-export-check.mjs'
      - '.github/workflows/pilot-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'client/src/local/pilotExport.js'
      - 'client/src/components/PilotEvidencePanel.jsx'
      - 'client/src/pages/Settings.jsx'
      - 'client/test/pilot-evidence-export-check.mjs'
      - '.github/workflows/pilot-evidence.yml'

concurrency:
  group: pilot-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot-evidence:
    name: Pilot evidence privacy contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Privacy and deterministic aggregation contract
        run: node client/test/pilot-evidence-export-check.mjs
      - name: Client build
        run: npm run build
      - name: Retain pull-request build for packaged iPad sync
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pilot-evidence-client-dist
          path: client/dist
          retention-days: 1
