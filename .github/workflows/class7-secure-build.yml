name: Class 7 Secure Candidate Build

on:
  push:
    branches:
      - india/class7-secure-ready-2026-09-04

permissions:
  contents: write

concurrency:
  group: class7-secure-ready-2026-09-04
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source, deterministic suite and iPad bundles
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Runtime dependency security floor
        run: npm audit --prefix client --omit=dev --audit-level=low

      - name: Current Class 7 Parts I-II source truth
        run: node client/test/india-class7-current-source-check.mjs

      - name: India curriculum regressions
        run: node client/test/india-check.mjs

      - name: Complete deterministic regression suite
        run: npm test

      - name: Build exact combined client
        run: npm run build

      - name: Synchronize both tracked iPad bundles
        run: npm run sync:ios

      - name: Verify iPad synchronization
        run: npm run check:ios

      - name: Publish verified generated bundles and remove bootstrap
        run: |
          set -euo pipefail
          rm .github/workflows/class7-secure-build.yml
          git config user.name 'Pri Curriculum Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -- '.github/workflows/class7-secure-build.yml' 'ios/PriLearning.swiftpm/Resources/Web' 'ios/PriLearning 2.swiftpm/Resources/Web'
          git commit -m 'build(class7): sync secure iPad bundles'
          git push origin HEAD:india/class7-secure-ready-2026-09-04
