# Read-only evidence only. Nothing here changes Railway, database, branches, or secrets.
# Production activation deliberately requires a separate reviewed change.
name: Release Staging Proof

on:
  workflow_run:
    workflows: ["Main Integrity"]
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact 40-character SHA already merged into protected main"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-staging-proof-${{ github.event.workflow_run.head_sha || inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

jobs:
  verify-staging:
    name: Exact-SHA staging smoke (read-only)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    # The wait below stops retrying 50 minutes after it starts, so its own
    # failure line and the steps after it always run inside this limit.
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha || inputs.candidate_sha }}
      STAGING_ORIGIN: https://pri-learning-staging-staging.up.railway.app
    steps:
      - name: Validate input and GitHub event
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::candidate must be one full SHA"; exit 1; }
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            [[ "${{ github.ref }}" == "refs/heads/main" ]] || { echo "::error::dispatch this read-only check from main"; exit 1; }
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove candidate identity and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main
          mkdir -p "$RUNNER_TEMP/release-audit"
          printf 'repository=%s\ncandidate=%s\nworkflow_run=%s\ntrigger=%s\n' \
            "${{ github.repository }}" "$CANDIDATE_SHA" "${{ github.run_id }}" "${{ github.event_name }}" \
            > "$RUNNER_TEMP/release-audit/identity.txt"

      - name: Wait for and verify the exact staging deployment
        shell: bash
        run: |
          set -euo pipefail
          # Railway deployment on main is independent; it may not be ready when
          # Main Integrity completes. Never mistake an older healthy SHA as proof.
          # The command is read-only and checks server, web, database and email
          # readiness using THIS checked-out SHA's schema constants.
          #
          # How long to wait: on 22 Oct 2026 the staging build of a5778a319
          # landed 34 minutes after the merge (buildTimestamp 11:35:15Z against
          # a merge at 11:01:14Z) and the earlier 12 × 30 s loop had given up at
          # 11:09:52Z with 12/14, so the proof went red on a deployment that
          # then passed (#646). The loop is bounded by elapsed time, not by a
          # count of attempts: it retries every 30 s until 50 minutes have
          # passed, which covers the 45 minutes the 22 Oct build needs room for.
          # An unreachable staging costs each attempt up to 15 s more
          # (verify-deployment.mjs's request limit), so 92 attempts would take
          # 69 minutes and the job limit would kill the loop before its failure
          # line and the artifact below. Nothing the check asserts is relaxed;
          # only the patience is.
          WAIT_SECONDS=$((50 * 60))
          started=$SECONDS
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            if node tools/verify-deployment.mjs \
                --origin "$STAGING_ORIGIN" --sha "$CANDIDATE_SHA" \
                --engine postgres --auth-email-proven \
                > "$RUNNER_TEMP/release-audit/staging-check.txt" 2>&1; then
              cat "$RUNNER_TEMP/release-audit/staging-check.txt"
              echo "PASS: staging matches $CANDIDATE_SHA after $((SECONDS - started)) s, attempt $attempt (not a release authorization)." \
                >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if (( SECONDS - started >= WAIT_SECONDS )); then break; fi
            sleep 30
          done
          cat "$RUNNER_TEMP/release-audit/staging-check.txt"
          echo "::error::Staging did not prove exact SHA $CANDIDATE_SHA within $((SECONDS - started)) s ($attempt attempts). No release authorization."
          exit 1

      # #653: whose address do the anonymous rate limiters count? A runner has
      # one public address for the job, so it can tell per-client from
      # per-edge-node, which a client whose own address rotates cannot. ADVISORY
      # until #653 is closed: on 8 Nov 2026 staging counted the Railway edge
      # node (docs/operations/railway-proxy-identity.md), and a blocking step
      # would stop every train on a configuration fix that is the owner's.
      # Read-only: anonymous GETs to the published content index.
      - name: Proxy identity of the anonymous rate limiters (advisory, #653)
        shell: bash
        run: |
          set -uo pipefail
          node tools/verify-deployment-proxy.mjs --origin "$STAGING_ORIGIN" \
            > "$RUNNER_TEMP/release-audit/proxy-identity.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/release-audit/proxy-identity.txt"
          echo "$(tail -n 1 "$RUNNER_TEMP/release-audit/proxy-identity.txt") — exit $status, advisory until #653 is closed" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Archive exact-SHA read-only proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/release-audit/
          if-no-files-found: warn
          retention-days: 30
