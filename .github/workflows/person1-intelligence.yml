name: Person 1 Intelligence Contract

on:
  pull_request:
    paths:
      - 'client/src/engine/**'
      - 'client/src/explain/**'
      - 'client/src/ink/nativeConsensus.js'
      - 'client/test/person1-intelligence-loop-check.mjs'
      - 'docs/PERSON1_INTELLIGENCE_RELEASE_CONTRACT.md'
      - '.github/workflows/person1-intelligence.yml'
  push:
    branches: [main]
    paths:
      - 'client/src/engine/**'
      - 'client/src/explain/**'
      - 'client/src/ink/nativeConsensus.js'
      - 'client/test/person1-intelligence-loop-check.mjs'
      - 'docs/PERSON1_INTELLIGENCE_RELEASE_CONTRACT.md'
      - '.github/workflows/person1-intelligence.yml'

permissions:
  contents: read

# For a PR, only the newest head can be merged. Cancel stale intelligence
# contracts instead of allowing every synchronize event to consume a runner.
concurrency:
  group: person1-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intelligence-contract:
    name: Handwriting → marking → diagnosis → adaptation → explanation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Run Person 1 deterministic release contract
        run: node client/test/person1-intelligence-loop-check.mjs