name: One Login iOS Sync Artifact

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-sync-artifact:
    if: github.event.pull_request.number == 378
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Build and regenerate both tracked iPad mirrors
        env:
          PRI_RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          npm run build
          npm run sync:ios
          npm run check:ios

      - name: Package changed mirror files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, subprocess
          paths = subprocess.check_output(
              ['git','status','--porcelain=v1','-z','--',
               'ios/PriLearning.swiftpm/Resources/Web',
               'ios/PriLearning 2.swiftpm/Resources/Web']
          ).split(b'\0')
          changed, deleted = [], []
          for raw in paths:
              if not raw:
                  continue
              s = raw.decode('utf-8', 'surrogateescape')
              status, p = s[:2], s[3:]
              if status.startswith('R') or status.startswith('C'):
                  raise SystemExit('unexpected rename/copy in generated mirrors: ' + s)
              if 'D' in status:
                  deleted.append(p)
                  continue
              with open(p, 'rb') as f:
                  data = f.read()
              changed.append({'path': p, 'content_b64': base64.b64encode(data).decode('ascii')})
          with open('one-login-ios-sync.json','w',encoding='utf-8') as f:
              json.dump({'changed': changed, 'deleted': deleted}, f, separators=(',',':'))
          print(f'packaged {len(changed)} changed/added files and {len(deleted)} deletions')
          PY
          test -s one-login-ios-sync.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: one-login-ios-sync-${{ github.event.pull_request.head.sha }}
          path: one-login-ios-sync.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 9


  apply-sync-artifact:
    name: Apply validated iOS mirror artifact
    needs: build-sync-artifact
    if: github.event.pull_request.number == 378
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - name: Download read-only build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: one-login-ios-sync-${{ github.event.pull_request.head.sha }}
          path: derived-out

      - name: Validate artifact scope and create one derived commit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = process.env.HEAD_SHA;
            const headRef = process.env.HEAD_REF;
            if (!/^[0-9a-f]{40}$/.test(headSha)) throw new Error('invalid head sha');
            if (headRef !== 'task/one-login-handwriting-photo') throw new Error('unexpected head ref');

            const payload = JSON.parse(fs.readFileSync('derived-out/one-login-ios-sync.json', 'utf8'));
            if (!Array.isArray(payload.changed) || !Array.isArray(payload.deleted)) throw new Error('invalid artifact schema');
            if (payload.changed.length + payload.deleted.length > 200) throw new Error('derived delta unexpectedly large');

            const roots = [
              'ios/PriLearning.swiftpm/Resources/Web/',
              'ios/PriLearning 2.swiftpm/Resources/Web/'
            ];
            const safe = (p) => {
              if (typeof p !== 'string' || !p || p.includes('\\') || p.includes('\\0') || path.posix.normalize(p) !== p) return false;
              return roots.some(root => p.startsWith(root) && p.length > root.length);
            };

            const allPaths = [...payload.changed.map(x => x.path), ...payload.deleted];
            if (new Set(allPaths).size !== allPaths.length) throw new Error('duplicate derived path');
            for (const p of allPaths) if (!safe(p)) throw new Error('unsafe derived path: ' + p);

            const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${headRef}` });
            if (ref.data.object.sha !== headSha) {
              throw new Error(`head moved before apply: expected ${headSha}, got ${ref.data.object.sha}`);
            }
            if (allPaths.length === 0) {
              core.info('iOS mirrors already match this client build; no derived commit needed.');
              return;
            }

            const parent = await github.rest.git.getCommit({ owner, repo, commit_sha: headSha });
            const entries = [];
            for (const item of payload.changed) {
              if (typeof item.content_b64 !== 'string' || item.content_b64.length > 4_000_000) throw new Error('invalid derived content for ' + item.path);
              const bytes = Buffer.from(item.content_b64, 'base64');
              if (bytes.length === 0 && item.content_b64.length !== 0) throw new Error('invalid base64 for ' + item.path);
              const blob = await github.rest.git.createBlob({
                owner, repo, content: item.content_b64, encoding: 'base64'
              });
              entries.push({ path: item.path, mode: '100644', type: 'blob', sha: blob.data.sha });
            }
            for (const p of payload.deleted) {
              entries.push({ path: p, mode: '100644', type: 'blob', sha: null });
            }

            const tree = await github.rest.git.createTree({
              owner, repo, base_tree: parent.data.tree.sha, tree: entries
            });
            const commit = await github.rest.git.createCommit({
              owner, repo,
              message: 'build(ios): sync account-first web bundles',
              tree: tree.data.sha,
              parents: [headSha]
            });
            await github.rest.git.updateRef({
              owner, repo, ref: `heads/${headRef}`, sha: commit.data.sha, force: false
            });
            core.notice(`Applied ${payload.changed.length} changed/added files and ${payload.deleted.length} deletions in ${commit.data.sha}`);
