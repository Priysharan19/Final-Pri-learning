name: Temporary PR68 V6 iOS bundle sync

on:
  push:
    branches:
      - pri-explain-v6

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pri-explain-v6

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: V5 + V6 explanation safety suites
        run: npm run test:explain

      - name: Build V6 client
        run: npm run build

      - name: Refresh both tracked iPad bundles
        run: node scripts/sync-ios.mjs

      - name: Verify tracked iPad bundles match the build
        run: node scripts/sync-ios.mjs --check

      - name: Commit generated native bundles
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios
          if git diff --cached --quiet; then
            echo "Native bundles already match V6."
            exit 0
          fi
          git commit -m "chore(ios): sync Pri Explain V6 choreography bundle"
          git push origin HEAD:pri-explain-v6
