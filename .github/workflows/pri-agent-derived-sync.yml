name: Pri Agent Derived Artifact Sync

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pri-agent-derived-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-derived:
    name: Build derived iPad mirrors without write authority
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'agent/mission/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      has_patch: ${{ steps.package.outputs.has_patch }}
    steps:
      - name: Checkout trusted base policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false

      - name: Checkout exact candidate head read-only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify autonomous ownership before executing candidate build
        id: scope
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          parsed="$(node trusted/scripts/pri-derived-artifact-sync.mjs branch "$HEAD_REF")"
          agent="$(printf '%s' "$parsed" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).agent))")"

          mapfile -t changed < <(git -C candidate diff --name-only "$BASE_SHA...$HEAD_SHA")
          if [[ "${#changed[@]}" -eq 0 ]]; then
            echo 'needs_sync=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node trusted/scripts/pri-fleet.mjs simulate-guard "$agent" "${changed[@]}"

          needs_sync=false
          for file in "${changed[@]}"; do
            if [[ "$file" == client/src/* ]]; then
              needs_sync=true
              break
            fi
          done
          echo "needs_sync=$needs_sync" >> "$GITHUB_OUTPUT"

      - name: Install client dependencies
        if: steps.scope.outputs.needs_sync == 'true'
        working-directory: candidate
        run: npm ci --prefix client

      - name: Build and regenerate declared mirrors
        if: steps.scope.outputs.needs_sync == 'true'
        working-directory: candidate
        run: |
          set -euo pipefail
          npm run build
          npm run sync:ios
          npm run check:ios

      - name: Package mirror-only patch
        if: steps.scope.outputs.needs_sync == 'true'
        id: package
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p derived-out
          git -C candidate diff --binary -- \
            'ios/PriLearning.swiftpm/Resources/Web' \
            'ios/PriLearning 2.swiftpm/Resources/Web' \
            > derived-out/mirrors.patch

          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const raw = execFileSync('git', [
            '-C', 'candidate', 'diff', '--name-only', '-z', '--',
            'ios/PriLearning.swiftpm/Resources/Web',
            'ios/PriLearning 2.swiftpm/Resources/Web'
          ]);
          const paths = raw.toString('utf8').split('\0').filter(Boolean);
          fs.writeFileSync('derived-out/paths.json', JSON.stringify(paths, null, 2));
          fs.writeFileSync('derived-out/metadata.json', JSON.stringify({
            rule_id: 'ios-web-mirrors',
            required_gate_id: 'ios-sync',
            head_ref: process.env.HEAD_REF,
            head_sha: process.env.HEAD_SHA,
            base_sha: process.env.BASE_SHA
          }, null, 2));
          process.stdout.write(String(paths.length));
          NODE

          count="$(node -e "process.stdout.write(String(require('./derived-out/paths.json').length))")"
          if [[ "$count" -gt 0 ]]; then
            node trusted/scripts/pri-derived-artifact-sync.mjs validate-paths derived-out/paths.json
            test -s derived-out/mirrors.patch
            echo 'has_patch=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_patch=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload deterministic mirror patch
        if: steps.scope.outputs.needs_sync == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pri-derived-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: derived-out
          if-no-files-found: error
          retention-days: 1

  apply-derived:
    name: Apply validated mirrors without executing candidate code
    needs: build-derived
    if: needs.build-derived.outputs.has_patch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout trusted base policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false

      - name: Checkout exact candidate head for patch application only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download read-only build artifact
        uses: actions/download-artifact@v4
        with:
          name: pri-derived-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: derived-out

      - name: Validate artifact metadata, path scope and fleet ownership
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          node trusted/scripts/pri-derived-artifact-sync.mjs validate-metadata \
            derived-out/metadata.json "$HEAD_SHA" "$BASE_SHA" "$HEAD_REF"
          node trusted/scripts/pri-derived-artifact-sync.mjs validate-paths derived-out/paths.json
          test -s derived-out/mirrors.patch

          parsed="$(node trusted/scripts/pri-derived-artifact-sync.mjs branch "$HEAD_REF")"
          agent="$(printf '%s' "$parsed" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).agent))")"
          mapfile -t source_files < <(git -C candidate diff --name-only "$BASE_SHA...$HEAD_SHA")
          mapfile -t derived_files < <(node -e "for (const p of require('./derived-out/paths.json')) console.log(p)")
          node trusted/scripts/pri-fleet.mjs simulate-guard "$agent" "${source_files[@]}" "${derived_files[@]}"

      - name: Apply patch and prove the staged diff remains mirror-only
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate apply --check --index ../derived-out/mirrors.patch
          git -C candidate apply --index ../derived-out/mirrors.patch

          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const raw = execFileSync('git', ['-C', 'candidate', 'diff', '--cached', '--name-only', '-z']);
          const paths = raw.toString('utf8').split('\0').filter(Boolean);
          fs.writeFileSync('/tmp/pri-applied-paths.json', JSON.stringify(paths, null, 2));
          const expected = [...require('./derived-out/paths.json')].sort();
          const actual = [...paths].sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`applied patch path mismatch: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
          }
          NODE
          node trusted/scripts/pri-derived-artifact-sync.mjs validate-paths /tmp/pri-applied-paths.json

      - name: Re-check head lease and push one deterministic derived commit
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          remote_sha="$(git -C candidate ls-remote origin "refs/heads/$HEAD_REF" | awk '{print $1}')"
          if [[ "$remote_sha" != "$HEAD_SHA" ]]; then
            echo "candidate head moved: expected $HEAD_SHA, found $remote_sha" >&2
            exit 1
          fi

          git -C candidate config user.name 'Pri Agent Derived Sync'
          git -C candidate config user.email 'pri-agent-derived-sync@users.noreply.github.com'
          git -C candidate commit -m 'chore(derived): sync iPad web mirrors'
          git -C candidate push origin HEAD:"refs/heads/$HEAD_REF" \
            --force-with-lease="refs/heads/$HEAD_REF:$HEAD_SHA"
