name: Pri Agent Derived Artifact Sync

# Untrusted half of the derived-mirror pipeline. It runs on the ordinary
# `pull_request` event with a read-only token: candidate code (npm ci, the
# client build, sync:ios) executes here and nowhere else. The only thing it
# hands on is an artifact; the privileged write happens in
# pri-agent-derived-apply.yml (workflow_run), which re-verifies everything from
# the event payload and the default-branch policy scripts and never trusts the
# artifact's own claims about who produced it.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pri-agent-derived-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-derived:
    name: Build derived iPad mirrors without write authority
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'agent/mission/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout trusted base policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false

      - name: Checkout exact candidate head read-only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Snapshot current mission ledger read-only
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            fs.writeFileSync('/tmp/pri-derived-issues.json', JSON.stringify(issues.filter(issue => !issue.pull_request), null, 2));

      - name: Verify live mission lease and ownership before candidate execution
        id: scope
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          parsed="$(node trusted/scripts/pri-derived-artifact-sync.mjs branch "$HEAD_REF")"
          agent="$(printf '%s' "$parsed" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).agent))")"
          mission="$(printf '%s' "$parsed" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).mission))")"
          declared_agent="$(printf '%s\n' "$PR_BODY" | sed -n 's/^Pri-Agent:[[:space:]]*//p' | head -1)"
          declared_mission="$(printf '%s\n' "$PR_BODY" | sed -n 's/^Pri-Mission-ID:[[:space:]]*//p' | head -1)"
          declared_risk="$(printf '%s\n' "$PR_BODY" | sed -n 's/^Pri-Risk:[[:space:]]*//p' | head -1)"
          test "$declared_agent" = "$agent"
          test "$declared_mission" = "$mission"
          [[ "$declared_risk" =~ ^R[1-4]$ ]]
          node trusted/scripts/pri-mission-control.mjs validate-ledger \
            /tmp/pri-derived-issues.json "$agent" "$mission" "$HEAD_REF" "$declared_risk"

          mapfile -t changed < <(git -C candidate diff --name-only "$BASE_SHA...$HEAD_SHA")
          if [[ "${#changed[@]}" -eq 0 ]]; then
            echo 'needs_sync=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node trusted/scripts/pri-fleet.mjs simulate-guard "$agent" "${changed[@]}"

          needs_sync=false
          for file in "${changed[@]}"; do
            if [[ "$file" == client/src/* ]]; then
              needs_sync=true
              break
            fi
          done
          echo "needs_sync=$needs_sync" >> "$GITHUB_OUTPUT"

      - name: Install client dependencies
        if: steps.scope.outputs.needs_sync == 'true'
        working-directory: candidate
        run: npm ci --prefix client

      - name: Build and regenerate declared mirrors
        if: steps.scope.outputs.needs_sync == 'true'
        working-directory: candidate
        run: |
          set -euo pipefail
          npm run build
          npm run sync:ios
          npm run check:ios

      - name: Package mirror-only patch
        if: steps.scope.outputs.needs_sync == 'true'
        id: package
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node trusted/scripts/pri-derived-artifact-sync.mjs package \
            candidate derived-out "$HEAD_REF" "$HEAD_SHA" "$BASE_SHA"

          count="$(node -e "process.stdout.write(String(require('./derived-out/paths.json').length))")"
          if [[ "$count" -gt 0 ]]; then
            node trusted/scripts/pri-derived-artifact-sync.mjs validate-paths derived-out/paths.json
            test -s derived-out/mirrors.patch
            echo 'has_patch=true' >> "$GITHUB_OUTPUT"
          else
            test ! -s derived-out/mirrors.patch
            echo 'has_patch=false' >> "$GITHUB_OUTPUT"
          fi

          # Content hashes travel with the artifact and are re-computed and
          # recorded by the privileged consumer; they are a tamper-evidence
          # aid, not an authority (this job ran candidate code).
          (cd derived-out && sha256sum mirrors.patch paths.json metadata.json > SHA256SUMS)
          cat derived-out/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deterministic mirror patch
        if: steps.scope.outputs.needs_sync == 'true' && steps.package.outputs.has_patch == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pri-derived-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: derived-out
          if-no-files-found: error
          retention-days: 1
