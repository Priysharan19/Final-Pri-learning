name: One-shot dependency audit fix

on:
  push:
    branches:
      - backend-v100-foundation

permissions:
  contents: write

jobs:
  audit-fix:
    if: contains(github.event.head_commit.message, '[audit-fix-request]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backend-v100-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install exactly what the lockfile declares
        run: npm ci --prefix client

      - name: Apply only non-breaking npm audit fixes
        run: npm audit fix --prefix client

      - name: Refuse to commit while any high/critical vulnerability remains
        run: npm audit --prefix client --audit-level=high

      - name: Commit only dependency manifests if they changed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- client/package.json client/package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency-manifest changes were needed.'
            exit 0
          fi
          git commit -m 'Repair non-breaking dependency vulnerabilities [audit-fix-generated]'
          git push origin HEAD:backend-v100-foundation
