name: Temporary PR71 combined V8 iOS sync

on:
  push:
    branches:
      - pri-explain-v8-adaptive-teaching

permissions:
  contents: write

jobs:
  sync-ios:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pri-explain-v8-adaptive-teaching
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Pri Explain regression suite
        run: npm run test:explain
      - name: Pri Reason V3 regression gate
        run: node client/test/pri-reason-v3-check.mjs
      - name: Pri Reason curriculum integration gate
        run: node client/test/pri-reason-curriculum-check.mjs
      - name: Ink Hybrid focused gate
        run: node client/test/ink-hybrid-check.mjs
      - name: Build combined client
        run: npm run build
      - name: Sync tracked iPad bundles
        run: npm run sync:ios
      - name: Commit canonical combined bundles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios
          if git diff --cached --quiet; then
            echo "Tracked iPad bundles already match the combined client build."
            exit 0
          fi
          git commit -m "chore(ios): sync combined Pri Explain V8 bundle"
          git push origin HEAD:pri-explain-v8-adaptive-teaching
