name: Ink Hybrid

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'client/src/ink/**'
      - 'client/test/ink-personal-metric-check.mjs'
      - 'client/test/ink-hybrid-check.mjs'
      - 'client/test/ink-trig-context.mjs'
      - 'client/test/inkcheck-context.mjs'
      - '.github/workflows/ink-hybrid.yml'
  pull_request:
    paths:
      - 'client/src/ink/**'
      - 'client/test/ink-personal-metric-check.mjs'
      - 'client/test/ink-hybrid-check.mjs'
      - 'client/test/ink-trig-context.mjs'
      - 'client/test/inkcheck-context.mjs'
      - '.github/workflows/ink-hybrid.yml'

permissions:
  contents: read

concurrency:
  group: ink-hybrid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hybrid:
    name: Native line ownership, personal adaptation and stroke identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Personal CNN metric adaptation regression
        run: node client/test/ink-personal-metric-check.mjs
      - name: Native-line ownership, glyph identity, derivative-prime and raised-power regression
        run: node client/test/ink-hybrid-check.mjs
      - name: Real-page trig grammar, line consensus and diagram rejection regression
        run: node client/test/ink-trig-context.mjs
      - name: Answer-context safety regression
        run: node client/test/inkcheck-context.mjs