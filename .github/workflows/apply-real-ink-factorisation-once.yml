name: Apply Real Ink Factorisation Once

on:
  push:
    branches:
      - agent/native-ink-v9
    paths:
      - '.github/workflows/apply-real-ink-factorisation-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-ink-v9
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply screenshot-driven recognition hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected source block not found in {path}')
              p.write_text(text.replace(old, new, 1))

          # Make the user's exact two-line factorisation a permanent native
          # end-to-end case: line segmentation, superscript, equals, brackets,
          # plus/minus, x ownership and assembly all have to survive together.
          replace(
              'ios/PriLearning.swiftpm/Ink/InkSelfCheck.swift',
              '''            Case(name: "fraction", expected: "(1)/(2)") { pen in
                stackedFraction(numerator: "1", denominator: "2", pen: &pen)
            }''',
              '''            Case(name: "factorisation", expected: "=x^(2)-36\\n=(x-6)(x+6)") { pen in
                var first = pen
                first.x = 40
                var strokes = ink(for: "= x^2 - 36", pen: &first)
                var second = pen
                second.x = 40
                second.baseline = pen.baseline + pen.emHeight * 1.9
                strokes += ink(for: "= (x - 6)(x + 6)", pen: &second)
                return strokes
            },
            Case(name: "fraction", expected: "(1)/(2)") { pen in
                stackedFraction(numerator: "1", denominator: "2", pen: &pen)
            }'''
          )

          replace(
              'scripts/ink-native-check.mjs',
              'const EXPECTED_CASES = 10;',
              'const EXPECTED_CASES = 11;'
          )

          # Raised marks must be both vertically plausible AND locally attached
          # in writing order. This stops a superscript from jumping to a nearby
          # line just because the baselines are close.
          replace(
              'ios/PriLearning.swiftpm/Ink/InkLineSegmenter.swift',
              '''                let compactRaisedMark = height < 0.92 * glyphSize
                    && width <= 1.05 * glyphSize
                    && centre < band.lowerBound + 0.58 * bandHeight
                if smallMark || compactRaisedMark {''',
              '''                let compactRaisedMark = height < 0.92 * glyphSize
                    && width <= 1.05 * glyphSize
                    && centre < band.lowerBound + 0.58 * bandHeight
                let groupBounds = group.dropFirst().reduce(group[0].element.bounds) {
                    $0.union($1.element.bounds)
                }
                let horizontalGap = item.element.bounds.minX - groupBounds.maxX
                let xOverlap = min(item.element.bounds.maxX, groupBounds.maxX)
                    - max(item.element.bounds.minX, groupBounds.minX)
                let locallyAttached = xOverlap >= 0
                    || (horizontalGap >= -0.30 * glyphSize && horizontalGap <= 1.35 * glyphSize)
                if smallMark || (compactRaisedMark && locallyAttached) {'''
          )

          # Do not blame the writer when the machine is the uncertain party.
          replace(
              'client/src/ink/InkAnswer.jsx',
              "The handwriting evidence is genuinely ambiguous; the highlighted symbol needs confirmation.",
              "PRI isn't confident in this reading yet; check the highlighted symbol or rewrite the line if it looks wrong."
          )

          # If the simulator ever goes silent again, print app-process logs so
          # the failure is diagnosable instead of appearing as eleven missing gates.
          replace(
              'scripts/ink-native-check.mjs',
              '''if (problems.length) {
  for (const problem of problems) console.log(`FAIL — ${problem}`);
  process.exit(1);
}''',
              '''if (problems.length) {
  for (const problem of problems) console.log(`FAIL — ${problem}`);
  if (!lines.length) {
    console.log('\\nNo PRIINK events were captured. Recent app-process log:');
    try {
      const raw = run('xcrun', ['simctl', 'spawn', device, 'log', 'show', '--last', '10m',
        '--predicate', 'process == "Pri Learning"', '--style', 'compact'],
        { maxBuffer: 32 * 1024 * 1024 });
      console.log(raw.split('\\n').slice(-180).join('\\n'));
    } catch (err) {
      console.log(`Could not read app-process log: ${err?.message || err}`);
    }
  }
  process.exit(1);
}'''
          )
          PY

      - name: Build updated web runtime
        run: |
          npm ci --prefix client
          npm run build
          npm run sync:ios

      - name: Commit implementation and synchronized Swift package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ios/PriLearning.swiftpm/Ink/InkSelfCheck.swift \
                  ios/PriLearning.swiftpm/Ink/InkLineSegmenter.swift \
                  client/src/ink/InkAnswer.jsx \
                  scripts/ink-native-check.mjs \
                  ios/PriLearning.swiftpm/Resources/Web
          git commit -m 'Harden real Pencil factorisation recognition'
          git push origin HEAD:agent/native-ink-v9

      - name: Remove one-shot workflow
        run: |
          rm .github/workflows/apply-real-ink-factorisation-once.yml
          git add .github/workflows/apply-real-ink-factorisation-once.yml
          git commit -m 'Remove one-time factorisation repair workflow'
          git push origin HEAD:agent/native-ink-v9
