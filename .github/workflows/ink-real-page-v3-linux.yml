name: Real Apple Pencil page V3 fast preflight

on:
  push:
    branches:
      - product/india-native-ink-truth

permissions:
  contents: read

concurrency:
  group: ink-real-page-v3-linux
  cancel-in-progress: true

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/india-native-ink-truth
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Repair staged installer
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tools/fix-ink-real-page-v3-installer.py
      - name: Apply repair
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tools/apply-ink-real-page-v3.py
      - run: npm ci --prefix client
      - name: Stability and product gates
        run: |
          npm run test:ink:stability
          npm run test:ink:arbitration
          npm run test:ink:bridge
          npm run test:ink:hybrid
          npm run test:context
          npm run test:gateway
          npm run test:backend
          npm run test:india
          npm run build
          npm run sync:ios
          npm run check:ios
          node scripts/check-native-package-sync.mjs
          git diff --check
