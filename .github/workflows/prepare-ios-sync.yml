name: Prepare iOS Bundle Sync

on:
  push:
    branches:
      - pri-local-ink-v2
      - feature/pri-explain-v1
    paths:
      - 'client/**'
      - 'tools/ink-foundation/**'
      - 'ios/PriLearning.swiftpm/Ink/InkFoundationRuntime.swift'
      - 'ios/PriLearning 2.swiftpm/Ink/InkFoundationRuntime.swift'
      - 'scripts/sync-ios.mjs'
      - 'scripts/ink-bootstrap-one-writer.sh'
      - '.github/workflows/ink-foundation.yml'
      - '.github/workflows/prepare-ios-sync.yml'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: prepare-ios-sync-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Build exact client and prepare synced bundle commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the immutable commit that triggered this run. Checking out the
          # moving branch here can race a later model commit and produce a web
          # bundle whose parent is not the SHA we actually verified.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Build exact client
        run: npm run build

      - name: Synchronize both tracked iPad bundles
        run: npm run sync:ios

      - name: Verify synchronization before publishing
        run: npm run check:ios

      - name: Publish generated commit to handoff branch
        run: |
          set -euo pipefail
          git config user.name 'pri-learning-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -- 'ios/PriLearning.swiftpm/Resources/Web' 'ios/PriLearning 2.swiftpm/Resources/Web'
          if git diff --cached --quiet; then
            echo 'No generated bundle changes were needed.'
            git push --force origin HEAD:refs/heads/${GITHUB_REF_NAME}-sync-generated
            exit 0
          fi
          git commit -m 'Sync tracked iPad web bundles from exact client build'
          git push --force origin HEAD:refs/heads/${GITHUB_REF_NAME}-sync-generated
          echo "Prepared generated sync commit $(git rev-parse HEAD) from trigger $GITHUB_SHA"
