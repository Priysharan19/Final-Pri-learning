name: Temporary Ink V14 decoder-safe latest-main build

on:
  push:
    branches:
      - feature/ink-v14-decoder-safe-main

jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ink-v14-decoder-safe-main
          fetch-depth: 0

      - name: Guard generated commit
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq '[decoder-safe-main-generated]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Apply decoder-safe source changes
        if: steps.guard.outputs.skip != 'true'
        run: |
          git checkout 1c5005e4a407e521bb5730e15855e16b283cbf91 -- client/src/ink/classes.js client/src/ink/recognizer.js

      - name: Install client dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci --prefix client

      - name: Verify decoder contract and handwriting regressions
        if: steps.guard.outputs.skip != 'true'
        run: |
          node --input-type=module <<'NODE'
          import { classOfSymbol, symbolsOfClass } from './client/src/ink/classes.js';
          if (classOfSymbol('O') !== '0o') throw new Error('capital O must reuse the 0o visual class');
          if (classOfSymbol('*') !== 'x') throw new Error('times sign must reuse the x visual class');
          if (!symbolsOfClass('0o').includes('O')) throw new Error('0o decoder must offer capital O');
          if (!symbolsOfClass('x').includes('*')) throw new Error('x decoder must offer times sign');
          console.log('PASS — decoder-safe O/* class contract');
          NODE
          npm run test:ink
          npm run test:hard
          npm run test:lines
          npm run test:holdout2
          npm run test:holdout3
          npm run test:context
          npm run test:ink:hybrid

      - name: Build and synchronize iPad bundles
        if: steps.guard.outputs.skip != 'true'
        run: |
          npm run build
          npm run sync:ios
          npm run check:ios

      - name: Commit production candidate
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name 'Pri Learning Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add client/src/ink/classes.js client/src/ink/recognizer.js ios
          if git diff --cached --quiet; then
            echo 'No candidate changes generated.'
            exit 1
          fi
          git commit -m 'Ink V14: decoder-safe O/* on latest main [decoder-safe-main-generated]'
          git push origin HEAD:feature/ink-v14-decoder-safe-main
