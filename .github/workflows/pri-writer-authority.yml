name: Pri Authoritative Writer Admission

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Signed admission operation (approval required)
        required: true
        type: choice
        options: [GRANT, RENEW, REVOKE]
      issue_number:
        description: Canonical open mission issue
        required: true
        type: number
      pr_number:
        description: Exact mission source pull request
        required: true
        type: number
      head_sha:
        description: Exact 40-character source PR commit
        required: true
        type: string

permissions:
  contents: read

# The queue prevents overlapping controller jobs. An independently approved
# protected Git ref supplies durable non-fast-forward compare-and-swap,
# protecting against outside workflow races or multiple queued dispatches.
concurrency:
  group: pri-writer-authority-global
  cancel-in-progress: false

jobs:
  authorize:
    name: Independent protected writer transaction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pri-writer-admission
    permissions:
      contents: write
      issues: write
      pull-requests: read
      deployments: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Require independently approved protected-main workflow
        shell: bash
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = refs/heads/main
          test "$DISPATCH_SHA" = "$(git rev-parse HEAD)"
      - name: Build isolated trusted transaction input
        shell: bash
        env:
          REQUEST_OPERATION: ${{ inputs.operation }}
          REQUEST_ISSUE_NUMBER: ${{ inputs.issue_number }}
          REQUEST_PR_NUMBER: ${{ inputs.pr_number }}
          REQUEST_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const op=process.env.REQUEST_OPERATION;
          const issue=Number(process.env.REQUEST_ISSUE_NUMBER);
          const pr=Number(process.env.REQUEST_PR_NUMBER);
          const sha=process.env.REQUEST_HEAD_SHA;
          if(!['GRANT','RENEW','REVOKE'].includes(op) || !Number.isSafeInteger(issue) ||
             issue<1 || (op!=='REVOKE' &&
             (!Number.isSafeInteger(pr) || pr<1 || !/^[0-9a-f]{40}$/.test(sha))))
            throw Error('invalid dispatch inputs');
          fs.writeFileSync('/tmp/pri-authority-request.json',JSON.stringify({
            operation:op,issue_number:issue,pr_number:pr,head_sha:sha
          }));
          NODE
      - name: Apply signed non-fast-forward CAS, reconcile issue, verify ledger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRI_ADMISSION_PRIVATE_KEY: ${{ secrets.PRI_ADMISSION_PRIVATE_KEY }}
        run: node scripts/pri-admission-github.mjs transact /tmp/pri-authority-request.json
