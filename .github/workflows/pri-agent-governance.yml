name: Pri Agent Fleet Governance

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - '.pri-os/**'
      - 'scripts/pri-*.mjs'
      - '.github/workflows/pri-agent-governance.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pri-agent-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fleet-contract:
    name: Autonomous fleet V2 contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Control-plane syntax
        run: |
          node --check scripts/pri-fleet.mjs
          node --check scripts/pri-mission-control.mjs

      - name: Validate fleet and mission invariants
        run: |
          node scripts/pri-fleet.mjs validate
          node scripts/pri-mission-control.mjs validate

      - name: Machine-readable fleet status
        run: node scripts/pri-fleet.mjs status >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test canonical primary ownership
        shell: bash
        run: |
          set -euo pipefail
          node scripts/pri-fleet.mjs route client/src/ink/native.js | grep -q '"primary":"handwriting"'
          node scripts/pri-fleet.mjs route server/platform/index.js | grep -q '"primary":"platform"'
          node scripts/pri-fleet.mjs route server/test/platform-schema-check.mjs | grep -q '"primary":"qa-release"'
          node scripts/pri-fleet.mjs route client/src/pages/Home.jsx | grep -q '"primary":"student-experience"'

      - name: Mission ranker preempts critical categories
        shell: bash
        run: |
          cat > /tmp/pri-candidates.json <<'JSON'
          [
            {"id":"normal-high","category":"normal","severity":5,"student_impact":5,"unblock_value":5,"recurrence":5,"strategic_value":5,"diagnosis_confidence":5,"effort":0,"regression_risk":0},
            {"id":"security-first","category":"security","severity":1,"student_impact":1,"unblock_value":1,"recurrence":1,"strategic_value":1,"diagnosis_confidence":1,"effort":5,"regression_risk":5}
          ]
          JSON
          first="$(node scripts/pri-mission-control.mjs rank /tmp/pri-candidates.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s)[0].id))")"
          test "$first" = "security-first"

      - name: Classify PR diff and parse autonomous metadata
        if: github.event_name == 'pull_request'
        id: meta
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          node scripts/pri-fleet.mjs risk "origin/$BASE_REF" | tee /tmp/pri-risk.json >> "$GITHUB_STEP_SUMMARY"
          if [[ "$HEAD_REF" != agent/mission/* ]]; then
            echo "autonomous=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          remainder="${HEAD_REF#agent/mission/}"
          agent="${remainder%%/*}"
          mission="${remainder#*/}"
          if [[ -z "$agent" || -z "$mission" || "$mission" == "$remainder" ]]; then
            echo "Invalid autonomous branch; expected agent/mission/<agent>/<mission-id>" >&2
            exit 1
          fi
          declared_agent="$(printf '%s\n' "$PR_BODY" | sed -n 's/^Pri-Agent:[[:space:]]*//p' | head -1)"
          declared_mission="$(printf '%s\n' "$PR_BODY" | sed -n 's/^Pri-Mission-ID:[[:space:]]*//p' | head -1)"
          declared_risk="$(printf '%s\n' "$PR_BODY" | sed -n 's/^Pri-Risk:[[:space:]]*//p' | head -1)"
          test "$declared_agent" = "$agent"
          test "$declared_mission" = "$mission"
          [[ "$declared_risk" =~ ^R[1-4]$ ]]
          node scripts/pri-fleet.mjs guard "$agent" "origin/$BASE_REF"
          node scripts/pri-fleet.mjs compare-risk "$declared_risk" "origin/$BASE_REF"
          echo "autonomous=true" >> "$GITHUB_OUTPUT"
          echo "agent=$agent" >> "$GITHUB_OUTPUT"
          echo "mission=$mission" >> "$GITHUB_OUTPUT"
          echo "risk=$declared_risk" >> "$GITHUB_OUTPUT"

      - name: Verify exactly one fresh GitHub-Issue writer lease
        if: github.event_name == 'pull_request' && steps.meta.outputs.autonomous == 'true'
        uses: actions/github-script@v7
        env:
          EXPECTED_AGENT: ${{ steps.meta.outputs.agent }}
          EXPECTED_MISSION: ${{ steps.meta.outputs.mission }}
          EXPECTED_BRANCH: ${{ github.head_ref }}
          EXPECTED_RISK: ${{ steps.meta.outputs.risk }}
        with:
          script: |
            const fs = require('fs');
            const control = JSON.parse(fs.readFileSync('.pri-os/mission-control.json', 'utf8'));
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const marker = (body, key) => {
              const match = String(body || '').match(new RegExp(`^${key}:\\s*(.+)$`, 'mi'));
              return match ? match[1].trim() : '';
            };
            const activeStates = new Set(['ACTIVE','IMPLEMENTING','TESTING','REVIEW','CI','REPAIR','MERGE_READY']);
            const managed = issues.filter(issue => !issue.pull_request && marker(issue.body, 'Pri-Mission-ID'));
            const active = managed.filter(issue => activeStates.has(marker(issue.body, 'Pri-Mission-Status')));
            if (active.length !== 1) {
              core.setFailed(`Expected exactly one active Pri writer lease, found ${active.length}.`);
              return;
            }
            const lease = active[0];
            const leaseAgeMs = Date.now() - Date.parse(lease.updated_at);
            const ttlMs = Number(control.lease.ttl_hours) * 60 * 60 * 1000;
            if (!Number.isFinite(leaseAgeMs) || leaseAgeMs < 0 || leaseAgeMs > ttlMs) {
              core.setFailed(`Writer lease issue #${lease.number} is stale or has invalid updated_at (${lease.updated_at}).`);
              return;
            }
            const expected = {
              mission: process.env.EXPECTED_MISSION,
              agent: process.env.EXPECTED_AGENT,
              branch: process.env.EXPECTED_BRANCH,
              risk: process.env.EXPECTED_RISK
            };
            const attempt = marker(lease.body, 'Pri-Attempt');
            const baseSha = marker(lease.body, 'Pri-Base-SHA');
            const failureFingerprint = marker(lease.body, 'Pri-Failure-Fingerprint');
            if (marker(lease.body, 'Pri-Mission-ID') !== expected.mission ||
                marker(lease.body, 'Pri-Agent') !== expected.agent ||
                marker(lease.body, 'Pri-Branch') !== expected.branch ||
                marker(lease.body, 'Pri-Risk') !== expected.risk) {
              core.setFailed(`Active lease issue #${lease.number} does not match this autonomous PR.`);
              return;
            }
            if (!/^\d+$/.test(attempt) || !/^[0-9a-f]{7,40}$/i.test(baseSha) ||
                (failureFingerprint && failureFingerprint !== 'none' && !/^[0-9a-f]{64}$/i.test(failureFingerprint))) {
              core.setFailed(`Active lease issue #${lease.number} has invalid attempt/base/failure markers.`);
              return;
            }
            core.info(`Verified fresh writer lease in issue #${lease.number}; age ${Math.round(leaseAgeMs / 60000)} minute(s).`);
