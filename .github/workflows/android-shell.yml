# Android shell (CP-06/CP-07): Gradle build, lint, JVM unit tests, embedded-web parity,
# the fail-closed floor screen on the minimum API, and the shell journey (with a
# real process death) on a floor-meeting older API and the current API, phone + tablet,
# then the cloud journey through the real UI against a real Pri server (CP-07).
# SYNTHETIC / EMULATOR evidence only — never a physical-device result.
name: Android Shell

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'client/src/platform/**'
      - 'client/src/main.jsx'
      - 'scripts/sync-android.mjs'
      - 'server/platform/**'
      - 'server/index.js'
      - 'server/app.js'
      - 'server/package-lock.json'
      - 'client/src/lib/files.js'
      - 'client/src/components/CloudAccountPanel.jsx'
      - 'client/src/components/CloudAccountSecurity.jsx'
      - 'client/src/components/GooglePlayBilling.jsx'
      - 'client/src/ink/**'
      - 'scripts/cloud-fixture-server.mjs'
      - 'scripts/release-matrix.mjs'
      - 'release/metadata.json'
      - '.github/workflows/android-shell.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'client/src/platform/**'
      - 'scripts/sync-android.mjs'
      - 'scripts/release-matrix.mjs'
      - 'release/metadata.json'
      - '.github/workflows/android-shell.yml'

concurrency:
  group: android-shell-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Gradle build, lint, unit tests and web parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the shared web product
        run: npm ci --prefix client && npm run build
      - name: Gradle build, lint and JVM unit tests
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug testDebugUnitTest
      - name: Embedded web is exactly the shared build
        run: node scripts/sync-android.mjs --check
      - name: Cross-platform release matrix (CP-11)
        run: node scripts/release-matrix.mjs --require-native-android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/test-results
          if-no-files-found: warn

  emulator:
    name: Shell on emulator (API ${{ matrix.api }}, ${{ matrix.profile }}, ${{ matrix.expect }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # API 26 (minSdk) ships a factory WebView below the Chromium 91 floor:
          # the correct, asserted result there is the fail-closed update screen.
          - { api: 26, profile: pixel_6, expect: floor, target: google_apis, webviewFlags: "" }
          # The oldest image here whose factory WebView meets the floor runs the
          # whole product journey; then the current API on phone and tablet.
          # Hosted phone gfxstream/WebView compositing is unstable on both API
          # 33 and 36. The diagnostic matrix proved software compositing avoids
          # the emulator death. API 33 deliberately uses the AOSP image: the
          # google_apis API 33 image can restart GMSCore's FontsProvider while
          # instrumentation is live, which makes Android kill dependent apps
          # even though Pri has not crashed. API 36 still exercises google_apis
          # on both phone and tablet, and the tablet keeps GPU compositing.
          - { api: 33, profile: pixel_6, expect: product, target: default, webviewFlags: "--disable-gpu-compositing" }
          - { api: 36, profile: pixel_6, expect: product, target: google_apis, webviewFlags: "--disable-gpu-compositing" }
          - { api: 36, profile: pixel_tablet, expect: product, target: google_apis, webviewFlags: "" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the shared web product and install the server
        run: npm ci --prefix client && npm run build && npm ci --prefix server
      - name: Build the app and the instrumented tests
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator journey (real process death) and cloud journey against the real Pri server
        # ReactiveCircus/android-emulator-runner v2.38.0, pinned to its commit.
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          working-directory: android
          # One line: the runner executes each script line in its own shell.
          script: set -e; mkdir -p app/build/outputs/pri-instrumented; WEBVIEW_FLAGS='${{ matrix.webviewFlags }}'; if [ -n "$WEBVIEW_FLAGS" ]; then adb shell "echo '_ $WEBVIEW_FLAGS' > /data/local/tmp/webview-command-line"; fi; (adb logcat -v threadtime > app/build/outputs/pri-instrumented/live-logcat.txt 2>&1 &) ; node ../scripts/cloud-fixture-server.mjs --out /tmp/pri-cloud.env && set -a && . /tmp/pri-cloud.env && set +a && rc=0; ./scripts/run-instrumented.sh ${{ matrix.expect }} || rc=$?; kill "$PRI_CLOUD_SERVER_PID" 2>/dev/null || true; exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: android-emulator-${{ matrix.api }}-${{ matrix.profile }}
          path: android/app/build/outputs/pri-instrumented
          if-no-files-found: warn
