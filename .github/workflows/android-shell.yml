# Android shell (CP-06/CP-07): Gradle build, lint, JVM unit tests, embedded-web parity,
# the fail-closed floor screen on the minimum API, and the shell journey (with a
# real process death) on a floor-meeting older API and the current API, phone + tablet,
# then the cloud journey through the real UI against a real Pri server (CP-07).
# Grading is online-only and server-authoritative (ADR-0001, 2026-10-10): the
# shell journey (no server) asserts a check is refused and nothing is marked;
# the cloud journey asserts the server's marks, with the right answer read from
# the server's sealed copy of the question by scripts/journey-oracle.mjs.
# SYNTHETIC / EMULATOR evidence only — never a physical-device result.
name: Android Shell

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'client/src/platform/**'
      - 'client/src/main.jsx'
      - 'scripts/sync-android.mjs'
      - 'server/platform/**'
      - 'server/index.js'
      - 'server/app.js'
      - 'server/package-lock.json'
      - 'client/src/lib/files.js'
      - 'client/src/components/CloudAccountPanel.jsx'
      - 'client/src/components/CloudAccountSecurity.jsx'
      - 'client/src/components/GooglePlayBilling.jsx'
      - 'client/src/ink/**'
      - 'scripts/cloud-fixture-server.mjs'
      - 'scripts/synthetic-reader-server.mjs'
      - 'scripts/journey-oracle.mjs'
      - 'scripts/release-matrix.mjs'
      - 'release/metadata.json'
      - '.github/workflows/android-shell.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'client/src/platform/**'
      - 'scripts/sync-android.mjs'
      - 'scripts/release-matrix.mjs'
      - 'release/metadata.json'
      - '.github/workflows/android-shell.yml'

concurrency:
  group: android-shell-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Gradle build, lint, unit tests and web parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the shared web product
        run: npm ci --prefix client && npm run build
      - name: Gradle build, lint and JVM unit tests
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug testDebugUnitTest
      - name: Release bundle compiles, and refuses to bundle without the upload key
        working-directory: android
        run: |
          set -o pipefail
          # No upload key on CI: bundleRelease must fail closed, naming the key.
          if ./gradlew --no-daemon -Ppri.versionCode=1 bundleRelease > "$RUNNER_TEMP/release-guard.log" 2>&1; then
            echo "bundleRelease succeeded without an upload key"; exit 1
          fi
          grep -Fq 'release bundles are signed with the upload key' "$RUNNER_TEMP/release-guard.log"
          # Compile-only release bundle, release lint and release unit tests.
          ./gradlew --no-daemon -Ppri.versionCode=1 -Ppri.unsignedRelease=true bundleRelease lintRelease testReleaseUnitTest
      - name: Play listing and Data safety match the code
        run: |
          node tools/play-listing-check.mjs
          PRI_REQUIRE_MERGED_MANIFEST=1 node tools/play-data-safety-check.mjs
      - name: Embedded web is exactly the shared build
        run: node scripts/sync-android.mjs --check
      - name: Cross-platform release matrix (CP-11)
        run: node scripts/release-matrix.mjs --require-native-android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/test-results
          if-no-files-found: warn

  emulator:
    name: Shell on emulator (API ${{ matrix.api }}, ${{ matrix.profile }}, ${{ matrix.expect }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # API 26 (minSdk) ships a factory WebView below the Chromium 91 floor:
          # the correct, asserted result there is the fail-closed update screen.
          - { api: 26, profile: pixel_6, expect: floor, target: google_apis, webviewFlags: "" }
          # The oldest image here whose factory WebView meets the floor runs the
          # whole product journey; then the current API on phone and tablet.
          # Hosted phone gfxstream/WebView compositing is unstable on both API
          # 33 and 36. The diagnostic matrix proved software compositing avoids
          # the emulator death. API 33 deliberately uses the AOSP image: the
          # google_apis API 33 image can restart GMSCore's FontsProvider while
          # instrumentation is live, which makes Android kill dependent apps
          # even though Pri has not crashed. API 36 still exercises google_apis
          # on both phone and tablet. Hosted gfxstream/WebView compositing is
          # unstable on the tablet too: repeated renderer SIGKILLs can take the
          # emulator down mid-ink journey, so use the same proven software
          # compositing path while keeping every product assertion enabled.
          - { api: 33, profile: pixel_6, expect: product, target: default, webviewFlags: "--disable-gpu-compositing" }
          - { api: 36, profile: pixel_6, expect: product, target: google_apis, webviewFlags: "--disable-gpu-compositing" }
          - { api: 36, profile: pixel_tablet, expect: product, target: google_apis, webviewFlags: "--disable-gpu-compositing" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the shared web product and install the server
        run: npm ci --prefix client && npm run build && npm ci --prefix server
      - name: Build the app and the instrumented tests
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The SDK repository has served the system image corrupt ("Error on
      # ZipFile unknown archive", run 39056367607 on main; #278/#327): sdkmanager
      # then exits 0 with a warning, the emulator never comes up on port 5554
      # and the job dies in the runner's cleanup ("could not connect to TCP port
      # 5554"). Install the image here with the log and the image file as the
      # verdict, retry one corrupt download, and fail with an infrastructure
      # label rather than at the emulator. The emulator runner then finds the
      # image installed and only creates the AVD. No assertion changes.
      - name: Android system image is intact (one retry on a corrupt download)
        env:
          IMAGE: system-images;android-${{ matrix.api }};${{ matrix.target }};x86_64
          IMAGE_DIR: system-images/android-${{ matrix.api }}/${{ matrix.target }}/x86_64
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?ANDROID_HOME is not set on this runner}}"
          mgr="$sdk/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$mgr" ] || mgr="$(ls -d "$sdk"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          for attempt in 1 2; do
            log="$RUNNER_TEMP/sdkmanager-$attempt.log"
            # sdkmanager exits 0 and only warns when an archive is corrupt, so
            # the log and the image file decide, not the exit code.
            (yes 2>/dev/null | "$mgr" --install "$IMAGE" --channel=0) > "$log" 2>&1 || true
            if ! grep -qiE 'unknown archive|error on zipfile|an error occurred while preparing|failed to download' "$log" && [ -s "$sdk/$IMAGE_DIR/system.img" ]; then
              echo "$IMAGE installed intact (attempt $attempt)"
              exit 0
            fi
            echo "::warning::attempt $attempt: $IMAGE did not install intact"
            grep -iE 'warning|error' "$log" | head -5 || true
            rm -rf "$sdk/$IMAGE_DIR" "$sdk/.temp" "$sdk/.downloadIntermediates"
          done
          echo "::error::INFRASTRUCTURE: $IMAGE could not be downloaded intact in 2 attempts (corrupt archive from the SDK repository). Not a product failure — re-run the job."
          exit 1
      - name: Emulator journey (real process death) and cloud journey against the real Pri server
        # ReactiveCircus/android-emulator-runner v2.38.0, pinned to its commit.
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          working-directory: android
          # One line: the runner executes each script line in its own shell.
          script: set -e; mkdir -p app/build/outputs/pri-instrumented; WEBVIEW_FLAGS='${{ matrix.webviewFlags }}'; if [ -n "$WEBVIEW_FLAGS" ]; then adb shell "echo '_ $WEBVIEW_FLAGS' > /data/local/tmp/webview-command-line"; fi; (adb logcat -v threadtime > app/build/outputs/pri-instrumented/live-logcat.txt 2>&1 &) ; node ../scripts/cloud-fixture-server.mjs --synthetic-reader --out /tmp/pri-cloud.env && set -a && . /tmp/pri-cloud.env && set +a && rc=0; ./scripts/run-instrumented.sh ${{ matrix.expect }} || rc=$?; kill "$PRI_CLOUD_SERVER_PID" 2>/dev/null || true; exit "$rc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-emulator-${{ matrix.api }}-${{ matrix.profile }}
          path: android/app/build/outputs/pri-instrumented
          if-no-files-found: warn
