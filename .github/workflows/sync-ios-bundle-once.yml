name: Sync iOS Bundle Once

on:
  push:
    branches:
      - agent/native-ink-v9
    paths:
      - '.github/workflows/sync-ios-bundle-once.yml'

permissions:
  contents: write

concurrency:
  group: sync-ios-bundle-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Build production client
        run: npm run build

      - name: Synchronize bundled iPad web app
        run: npm run sync:ios

      - name: Remove one-shot workflow and commit synchronized bundle
        shell: bash
        run: |
          rm -f .github/workflows/sync-ios-bundle-once.yml
          if git diff --quiet -- ios/PriLearning.swiftpm/Resources/Web .github/workflows/sync-ios-bundle-once.yml; then
            echo 'No bundle changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ios/PriLearning.swiftpm/Resources/Web .github/workflows/sync-ios-bundle-once.yml
          git commit -m 'Sync latest web build into iPad Swift package'
          git push origin HEAD:${{ github.ref_name }}
