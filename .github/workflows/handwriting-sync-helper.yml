name: Handwriting Sync Helper

on:
  push:
    branches:
      - perf/cloud-handwriting-smoothness-sep1
    paths:
      - .github/workflows/handwriting-sync-helper.yml

permissions:
  contents: write

jobs:
  sync-ios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/cloud-handwriting-smoothness-sep1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client
      - run: npm run build
      - run: npm run sync:ios
      - name: Commit exact generated iPad bundles
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ios/PriLearning.swiftpm/Resources/Web" "ios/PriLearning 2.swiftpm/Resources/Web"
          if git diff --cached --quiet; then
            echo "iOS bundles already match client/dist"
            exit 0
          fi
          git commit -m "chore(ink): sync iOS web bundles"
          git push origin HEAD:perf/cloud-handwriting-smoothness-sep1
