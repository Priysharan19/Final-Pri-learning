name: JEE Question Department

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/jee-question-department/**'
      - 'client/src/engine/indiaProduct.js'
      - 'client/src/engine/generators/index.js'
      - 'client/src/engine/generators/jee-pyq-runtime.js'
      - 'client/src/engine/generators/jee-pyq-data/**'
      - 'client/test/jee-question-department-check.mjs'
      - '.github/workflows/jee-question-department.yml'
  push:
    branches: [main]
    paths:
      - 'tools/jee-question-department/**'
      - 'client/src/engine/indiaProduct.js'
      - 'client/src/engine/generators/index.js'
      - 'client/src/engine/generators/jee-pyq-runtime.js'
      - 'client/src/engine/generators/jee-pyq-data/**'
      - 'client/test/jee-question-department-check.mjs'
      - '.github/workflows/jee-question-department.yml'

permissions:
  contents: read

concurrency:
  group: jee-question-department-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Lane gate: on a pull request only task/train-* heads run this job; main, dispatch and trains always do (docs/release/ci-lanes.md).
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'task/train-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Runtime + product routing contract
        run: node client/test/jee-question-department-check.mjs
      - name: India generator regression
        run: node client/test/india-check.mjs
      - name: Audit and pack regression
        run: python tools/jee-question-department/test_pipeline.py
      - name: Official-source intake regression (synthetic PDFs, no network)
        run: |
          python -m pip install -r tools/jee-question-department/requirements.txt
          python tools/jee-question-department/test_official_pipeline.py
      - name: Python syntax gate
        run: >-
          python -m py_compile
          tools/jee-question-department/extract.py
          tools/jee-question-department/audit.py
          tools/jee-question-department/pack.py
          tools/jee-question-department/test_pipeline.py
          tools/jee-question-department/fetch_official.py
          tools/jee-question-department/extract_official.py
          tools/jee-question-department/review_official.py
          tools/jee-question-department/test_official_pipeline.py
      # The iOS bundles are generated from the build, never tracked (decision
      # D28): generate, then prove the copy is complete.
      - name: Build + iOS bundle generation guarantee
        run: |
          set -euo pipefail
          npm ci --prefix client
          npm run build
          npm run sync:ios
          npm run check:ios