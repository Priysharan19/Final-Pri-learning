name: JEE Question Department

on:
  pull_request:
    paths:
      - 'tools/jee-question-department/**'
      - 'client/src/engine/indiaProduct.js'
      - 'client/src/engine/generators/index.js'
      - 'client/src/engine/generators/jee-pyq-runtime.js'
      - 'client/src/engine/generators/jee-pyq-data/**'
      - 'client/test/jee-question-department-check.mjs'
      - '.github/workflows/jee-question-department.yml'
  push:
    branches: [main]
    paths:
      - 'tools/jee-question-department/**'
      - 'client/src/engine/indiaProduct.js'
      - 'client/src/engine/generators/index.js'
      - 'client/src/engine/generators/jee-pyq-runtime.js'
      - 'client/src/engine/generators/jee-pyq-data/**'
      - 'client/test/jee-question-department-check.mjs'
      - '.github/workflows/jee-question-department.yml'

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Runtime + product routing contract
        run: node client/test/jee-question-department-check.mjs
      - name: India generator regression
        run: node client/test/india-check.mjs
      - name: Audit and pack regression
        run: python tools/jee-question-department/test_pipeline.py
      - name: Python syntax gate
        run: >-
          python -m py_compile
          tools/jee-question-department/extract.py
          tools/jee-question-department/audit.py
          tools/jee-question-department/pack.py
          tools/jee-question-department/test_pipeline.py
      - name: Build and sync tracked iOS bundle
        run: |
          npm ci --prefix client
          npm run build
          npm run sync:ios
      - name: Commit iOS bundle sync
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- ios/PriLearning.swiftpm/Resources/Web "ios/PriLearning 2.swiftpm/Resources/Web" && [ -z "$(git status --porcelain --untracked-files=all -- ios/PriLearning.swiftpm/Resources/Web "ios/PriLearning 2.swiftpm/Resources/Web")" ]; then
            echo "iOS bundle already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ios/PriLearning.swiftpm/Resources/Web "ios/PriLearning 2.swiftpm/Resources/Web"
          git commit -m "Sync iOS web bundle for JEE integration"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Verify iOS bundle
        run: node scripts/sync-ios.mjs --check
