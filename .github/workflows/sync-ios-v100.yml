name: One-shot iOS bundle sync

on:
  push:
    branches:
      - backend-v100-foundation

permissions:
  contents: write

jobs:
  sync:
    if: contains(github.event.head_commit.message, '[sync-ios-request]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backend-v100-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Build production client
        run: npm run build

      - name: Refresh the native web bundle
        run: npm run sync:ios

      - name: Commit only generated iOS web assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ios/PriLearning.swiftpm/Resources/Web
          if git diff --cached --quiet; then
            echo 'iOS bundle already matched the production build.'
            exit 0
          fi
          git commit -m 'Sync iOS bundle for backend v100 [sync-ios-generated]'
          git push origin HEAD:backend-v100-foundation
