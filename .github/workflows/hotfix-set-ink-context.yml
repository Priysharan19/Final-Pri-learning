name: Pri Ink set lifecycle stage

on:
  push:
    branches:
      - product/india-native-ink-truth
    paths:
      - .github/workflows/hotfix-set-ink-context.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: product/india-native-ink-truth
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Align staged patch with current hybrid source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-set-ink-hotfix.py')
          s = p.read_text()
          s = s.replace(
              '"import { recognize, classify } from \'./recognizer.js\';\\n",',
              '"import { classify, recognize } from \'./recognizer.js\';\\n",'
          )
          s = s.replace(
              '"const STRUCTURAL = new Set([\'=\', \'+\', \'-\', \'/\', \'sqrt\', \'<\', \'>\', \'<=\', \'>=\', \'!=\', \'div\', \'pm\', \'deg\', \'percent\', \':\', \'∫\']);\\n",',
              '"const STRUCTURAL = new Set([\'+\', \'-\', \'=\', \'*\', \'/\', \'(\', \')\', \'[\', \']\', \'<\', \'>\', \'<=\', \'>=\', \'!=\', \'±\', \':\']);\\n",'
          )
          s = s.replace(
              '"const STRUCTURAL = new Set([\'=\', \'+\', \'-\', \'/\', \'sqrt\', \'<\', \'>\', \'<=\', \'>=\', \'!=\', \'div\', \'pm\', \'deg\', \'percent\', \':\', \'∫\']);\\nconst SET_STRUCTURAL',
              '"const STRUCTURAL = new Set([\'+\', \'-\', \'=\', \'*\', \'/\', \'(\', \')\', \'[\', \']\', \'<\', \'>\', \'<=\', \'>=\', \'!=\', \'±\', \':\']);\\nconst SET_STRUCTURAL'
          )
          p.write_text(s)
          PY

      - name: Apply Pri Ink patch
        run: python3 scripts/apply-set-ink-hotfix.py

      - name: Install dependencies
        run: npm run setup

      - name: Run focused handwriting gates
        run: |
          npm run test:ink:sets
          npm run test:ink:arbitration
          npm run test:ink:hybrid
          npm run test:ink:stability

      - name: Build and verify iOS bundles
        run: |
          npm run build
          npm run sync:ios
          npm run check:ios

      - name: Commit validated patch
        run: |
          rm .github/workflows/hotfix-set-ink-context.yml
          rm scripts/apply-set-ink-hotfix.py
          git config user.name pri-learning-ci
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "Fix stale native ink and add set notation context"
          git push origin HEAD:product/india-native-ink-truth
