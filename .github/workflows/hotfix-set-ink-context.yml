          replace_once('client/src/ink/InkAnswer.jsx',
            "          ? readUnreadLines(nativeRaw, strokes, ovr, recognitionContext)\n",
            "          ? readUnreadLines(nativeRaw, strokes, ovr, effectiveContext)\n")
          replace_once('client/src/ink/InkAnswer.jsx',
