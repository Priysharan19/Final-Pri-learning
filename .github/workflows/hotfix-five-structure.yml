name: Hotfix structural 5/s validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-five-structure.yml'

permissions:
  contents: write

jobs:
  patch-test-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Add structural 5/s discriminator and adversarial tests
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one patch anchor, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          r = 'client/src/ink/runtimeSpatial.js'
          replace_once(r,
              "const SINGLE_GLYPH_DIGIT_TWIN = { s: '5', z: '2', b: '6', u: '4', g: '9', q: '9' };\nconst SINGLE_GLYPH_NEAR_TIE_SHARE = 0.90;\n",
              "const SINGLE_GLYPH_DIGIT_TWIN = { s: '5', z: '2', b: '6', u: '4', g: '9', q: '9' };\n"
              "const SINGLE_GLYPH_NEAR_TIE_SHARE = 0.90;\n"
              "// A canonical 5 can be visually s-like after pointer filtering. We do NOT\n"
              "// lower the generic context threshold for that case. Instead, a much weaker\n"
              "// 5 alternative may be promoted only when the physical trajectory has the\n"
              "// defining 5 structure: a long top sweep, an early leftmost turn, then a\n"
              "// lower bowl that exits back to the right. Pri's s templates continue to\n"
              "// their leftmost endpoint, so they fail this shape test.\n"
              "const STRUCTURAL_FIVE_ALT_SHARE = 0.35;\n"
              "const pointXY = p => ({ x: number(p?.x ?? p?.[0]), y: number(p?.y ?? p?.[1]) });\n"
              "const strokePoints = stroke => (stroke?.points || []).map(pointXY).filter(p => Number.isFinite(p.x) && Number.isFinite(p.y));\n"
              "\n"
              "function pathMeasurements(points) {\n"
              "  if (points.length < 4) return null;\n"
              "  const lengths = [0];\n"
              "  for (let i = 1; i < points.length; i++) {\n"
              "    lengths.push(lengths[i - 1] + Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y));\n"
              "  }\n"
              "  const total = lengths[lengths.length - 1];\n"
              "  if (!(total > 0)) return null;\n"
              "  return { lengths, total };\n"
              "}\n"
              "\n"
              "function prefixAtFraction(points, measurements, fraction) {\n"
              "  const target = measurements.total * fraction;\n"
              "  const out = [points[0]];\n"
              "  for (let i = 1; i < points.length; i++) {\n"
              "    if (measurements.lengths[i] <= target) { out.push(points[i]); continue; }\n"
              "    const before = measurements.lengths[i - 1];\n"
              "    const seg = measurements.lengths[i] - before;\n"
              "    const t = seg > 0 ? Math.max(0, Math.min(1, (target - before) / seg)) : 0;\n"
              "    out.push({\n"
              "      x: points[i - 1].x + t * (points[i].x - points[i - 1].x),\n"
              "      y: points[i - 1].y + t * (points[i].y - points[i - 1].y)\n"
              "    });\n"
              "    break;\n"
              "  }\n"
              "  return out;\n"
              "}\n"
              "\n"
              "function oneStrokeFiveStructure(points, box) {\n"
              "  const m = pathMeasurements(points);\n"
              "  if (!m || box.w <= 1e-6 || box.h <= 1e-6) return false;\n"
              "  let minIndex = 0;\n"
              "  for (let i = 1; i < points.length; i++) if (points[i].x < points[minIndex].x) minIndex = i;\n"
              "  const start = points[0], end = points[points.length - 1];\n"
              "  const startX = (start.x - box.x1) / box.w;\n"
              "  const startY = (start.y - box.y1) / box.h;\n"
              "  const endX = (end.x - box.x1) / box.w;\n"
              "  const endY = (end.y - box.y1) / box.h;\n"
              "  const minProgress = m.lengths[minIndex] / m.total;\n"
              "  const rebound = (end.x - points[minIndex].x) / box.w;\n"
              "  const prefix = prefixAtFraction(points, m, 0.18);\n"
              "  const prefixYs = prefix.map(p => p.y);\n"
              "  const prefixXs = prefix.map(p => p.x);\n"
              "  const topSpan = (Math.max(...prefixYs) - Math.min(...prefixYs)) / box.h;\n"
              "  const topSweep = (start.x - Math.min(...prefixXs)) / box.w;\n"
              "  return startX >= 0.65 && startY <= 0.25 &&\n"
              "    endX >= 0.30 && endY >= 0.65 &&\n"
              "    minProgress >= 0.22 && minProgress <= 0.72 && rebound >= 0.26 &&\n"
              "    topSweep >= 0.30 && topSpan <= 0.085;\n"
              "}\n"
              "\n"
              "export function hasStructuralFiveEvidence(symbol) {\n"
              "  const strokes = (symbol?._group?.strokes || []).filter(stroke => (stroke?.points || []).length >= 2);\n"
              "  if (!strokes.length || strokes.length > 2) return false;\n"
              "  const boxes = strokes.map(strokeBox);\n"
              "  const box = unionBox(boxes);\n"
              "  if (!box || box.w <= 1e-6 || box.h <= 1e-6) return false;\n"
              "  if (strokes.length === 1) return oneStrokeFiveStructure(strokePoints(strokes[0]), box);\n"
              "\n"
              "  // The second stock 5 allograph lifts the Pencil after the top bar.\n"
              "  // Accept that form only when one stroke is a wide, very flat top bar and\n"
              "  // the other is a lower stem/bowl ending well right of its left edge.\n"
              "  let topBar = -1;\n"
              "  for (let i = 0; i < 2; i++) {\n"
              "    const b = boxes[i];\n"
              "    const cy = (b.cy - box.y1) / box.h;\n"
              "    if (b.w >= 0.45 * box.w && b.h <= 0.12 * box.h && cy <= 0.24) topBar = i;\n"
              "  }\n"
              "  if (topBar < 0) return false;\n"
              "  const body = strokePoints(strokes[1 - topBar]);\n"
              "  const m = pathMeasurements(body);\n"
              "  if (!m || body.length < 4) return false;\n"
              "  const bodyBox = strokeBox(strokes[1 - topBar]);\n"
              "  const end = body[body.length - 1];\n"
              "  const endX = (end.x - box.x1) / box.w;\n"
              "  const endY = (end.y - box.y1) / box.h;\n"
              "  let minIndex = 0;\n"
              "  for (let i = 1; i < body.length; i++) if (body[i].x < body[minIndex].x) minIndex = i;\n"
              "  const minProgress = m.lengths[minIndex] / m.total;\n"
              "  const rebound = (end.x - body[minIndex].x) / box.w;\n"
              "  return bodyBox.h >= 0.55 * box.h && endX >= 0.30 && endY >= 0.65 && minProgress <= 0.35 && rebound >= 0.24;\n"
              "}\n")
          replace_once(r,
              "  const altConf = number(alt?.conf, 0);\n  if (!alt || top <= 0 || altConf < SINGLE_GLYPH_NEAR_TIE_SHARE * top) return result;\n",
              "  const altConf = number(alt?.conf, 0);\n"
              "  if (!alt || top <= 0) return result;\n"
              "  const ordinaryNearTie = altConf >= SINGLE_GLYPH_NEAR_TIE_SHARE * top;\n"
              "  const structuralFive = symbol.sym === 's' && digit === '5' &&\n"
              "    altConf >= STRUCTURAL_FIVE_ALT_SHARE * top && hasStructuralFiveEvidence(symbol);\n"
              "  if (!ordinaryNearTie && !structuralFive) return result;\n")
          replace_once(r,
              "    singleGlyphContextRepair: 'answer-blind-numeric-near-tie-v2'\n",
              "    singleGlyphContextRepair: structuralFive\n"
              "      ? 'answer-blind-numeric-5-structure-v3'\n"
              "      : 'answer-blind-numeric-near-tie-v2'\n")

          t = 'client/test/ink-hybrid-check.mjs'
          replace_once(t,
              "  recognizeWithoutDetachedSideWork,\n  repairSingleGlyphQuestionContext\n",
              "  recognizeWithoutDetachedSideWork,\n  repairSingleGlyphQuestionContext,\n  hasStructuralFiveEvidence\n")
          replace_once(t,
              "const numericCtx = { answerType: 'numeric', singleGlyphAlphabet: digitAlphabet, expected: '7' };\n",
              "const numericCtx = { answerType: 'numeric', singleGlyphAlphabet: digitAlphabet, expected: '7' };\n"
              "\n"
              "const groupFromTemplate = (sym, variant = 0, { shear = 0, scaleX = 1, scaleY = 1, dx = 0, dy = 0 } = {}) => ({\n"
              "  strokes: TEMPLATES[sym][variant].map(stroke => ({\n"
              "    points: stroke.map(([x, y]) => ({ x: dx + scaleX * x + shear * y, y: dy + scaleY * y, w: 2, t: 0 }))\n"
              "  }))\n"
              "});\n"
              "const structuralResult = (group, sym = 's', conf = 0.58, altSym = '5', altConf = 0.23) => {\n"
              "  const base = singleResult(sym, conf, altSym, altConf);\n"
              "  base.lines[0].symbols[0]._group = group;\n"
              "  base.symbols[0]._group = group;\n"
              "  return base;\n"
              "};\n"
              "\n"
              "// Physical 5/s evidence: the mounted browser gives canonical 5 a weak\n"
              "// 23% 5 alternative behind a 58% s. Only the five-shaped trajectory may\n"
              "// use that weaker evidence; a real s with identical classifier scores\n"
              "// must remain s. Affine shear/scale checks keep this structural rather\n"
              "// than tied to one screenshot or canvas size.\n"
              "for (const [label, group] of [\n"
              "  ['stock one-stroke 5', groupFromTemplate('5', 0)],\n"
              "  ['sheared one-stroke 5', groupFromTemplate('5', 0, { shear: 0.18, scaleX: 1.15, scaleY: 0.82, dx: 40, dy: 20 })],\n"
              "  ['lifted-top-bar 5', groupFromTemplate('5', 1)]\n"
              "]) {\n"
              "  assert.equal(hasStructuralFiveEvidence({ _group: group }), true, `${label} must expose five structure`);\n"
              "  const repaired = repairSingleGlyphQuestionContext(structuralResult(group), numericCtx);\n"
              "  assert.equal(repaired.text, '5', `${label} must rescue measured 58/23 s-vs-5 evidence`);\n"
              "  assert.equal(repaired.singleGlyphContextRepair, 'answer-blind-numeric-5-structure-v3');\n"
              "}\n"
              "for (const [label, group] of [\n"
              "  ['stock s', groupFromTemplate('s', 0)],\n"
              "  ['alternate s', groupFromTemplate('s', 1)],\n"
              "  ['sheared s', groupFromTemplate('s', 0, { shear: 0.18, scaleX: 1.15, scaleY: 0.82, dx: 40, dy: 20 })]\n"
              "]) {\n"
              "  assert.equal(hasStructuralFiveEvidence({ _group: group }), false, `${label} must not masquerade as five structure`);\n"
              "  const untouched = repairSingleGlyphQuestionContext(structuralResult(group),\n"
              "    { answerType: 'numeric', singleGlyphAlphabet: digitAlphabet, expected: '5' });\n"
              "  assert.equal(untouched.text, 's', `${label} must stay s even when expected is 5`);\n"
              "}\n"
              "const unrelatedWeakTwin = repairSingleGlyphQuestionContext(structuralResult(groupFromTemplate('5', 0), 'z', 0.58, '2', 0.23), numericCtx);\n"
              "assert.equal(unrelatedWeakTwin.text, 'z', 'structural exception must not lower the generic z/2 threshold');\n"
              "\n")
          PY
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Run handwriting safety suites
        run: |
          node client/test/ink-hybrid-check.mjs
          node client/test/inkcheck-context.mjs
      - name: Build and sync exact iPad bundles
        run: |
          npm run build
          node scripts/sync-ios.mjs
          node scripts/sync-ios.mjs --check
      - name: Commit final structural fix and remove temporary workflow
        run: |
          git config user.name "pri-learning-ci"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/hotfix-five-structure.yml
          git add -- \
            client/src/ink/runtimeSpatial.js \
            client/test/ink-hybrid-check.mjs \
            'ios/PriLearning.swiftpm/Resources/Web' \
            'ios/PriLearning 2.swiftpm/Resources/Web' \
            .github/workflows/hotfix-five-structure.yml
          git diff --cached --check
          git commit -m "Add structural 5/s handwriting disambiguation"
          git push origin "HEAD:${{ github.head_ref }}"
