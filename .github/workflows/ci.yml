          node client/test/review-queue-check.mjs 2>&1 | tee -a practice-http.log
          node server/test/practice-daily-cap-check.mjs 2>&1 | tee -a practice-http.log
          # After a relaunch or on another device the device's avoid list is empty: the server's picker reads the account's own seen records.
          node server/test/practice-seen-aware-pick-check.mjs 2>&1 | tee -a practice-http.log
          node server/test/premium-practice-content-check.mjs 2>&1 | tee -a practice-http.log
