name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # "Every deterministic suite" (the root npm test chain) fans out across
  # SUITE_SHARDS runners; tools/ci-suite-shard.mjs assigns every suite of
  # package.json "test" to exactly one shard and writes a manifest. The job
  # named "Suites, coverage and accuracy gates" (the required check) runs
  # always(), fails unless every shard succeeded, proves from the manifests that
  # every suite completed exactly once, and runs the unchanged invariant block
  # against the concatenated shard logs.
  suites-shard:
    name: Suites shard ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Install client dependencies
        run: npm ci --prefix client
      # Grading is online-only and server-authoritative, so the suites that
      # check an answer or start an exam through the local backend boot the
      # real platform server in-process (client/test/support/online-authority.mjs).
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Deterministic suites, shard ${{ matrix.shard }} of 4
        run: |
          set -o pipefail
          node tools/ci-suite-shard.mjs --of=4 --shard=${{ matrix.shard }} --manifest=suite-shard.json 2>&1 | tee suites.log
      - name: Shard log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suites-shard-${{ matrix.shard }}
          path: |
            suites.log
            suite-shard.json
          if-no-files-found: error

  suites-contracts:
    name: Suites policy and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Runner budget policy
        run: node tools/ci-runner-policy-check.mjs
      # The exact output pins live in ci/check-counts.json; each job verifies its
      # groups in place. Here: the manifest is well formed, its tool still fails a
      # dropped check, a dropped suite and an unannounced removal, and no pin of
      # the base commit's manifest left without a retired record and a reason.
      - name: Check-count manifest (well formed, self-test, nothing dropped since the base)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          node tools/ci-check-counts.mjs validate
          node tools/ci-check-counts.test.mjs
          node tools/ci-check-counts.mjs retire-check --base-sha "$BASE_SHA"
      - name: Workflow supply-chain policy (least privilege, pinned actions, no privileged PR-head execution)
        run: node tools/ci-workflow-policy-check.mjs
      - name: Native Ink lane keeps one booted simulator, one Swift build and bounded installs
        run: node client/test/simulator-fleet-check.mjs
      - name: Main Integrity retries the merged-PR lookup and still requires every PR workflow green
        run: node tools/main-integrity-lookup-check.mjs
      - name: Android Shell installs the emulator system image intact (verified cache, retried download)
        run: node tools/android-system-image-check.mjs
      - name: Native shells enforce the server Content-Security-Policy
        run: node client/test/native-shell-csp-check.mjs
      - name: Store-facing privacy manifest matches the privacy labels; Android permissions and signing stay closed
        run: node tools/store-readiness-check.mjs
      - name: Public site is generated from docs/legal, uses only approved wording, links resolve, nothing phones home
        run: npm run test:site
      - name: Install client dependencies
        run: npm ci --prefix client
      # Grading is online-only and server-authoritative, so the suites that
      # check an answer or start an exam through the local backend boot the
      # real platform server in-process (client/test/support/online-authority.mjs).
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Sign-in email template matches what the real-provider acceptance asserts
        run: node tools/acceptance/auth-email-template-check.mjs
      - name: Runtime dependency security floor
        run: node tools/runtime-audit-floor.mjs client
      - name: Person 2 India + commercial contracts
        run: |
          set -euo pipefail
          node client/test/india-production-meta-check.mjs
          node client/test/india-class7-current-source-check.mjs
          node client/test/india-class10-current-source-check.mjs
          node client/test/india-class10-production-gap-check.mjs
          node client/test/ncert-class10-full-book-check.mjs
          node client/test/class10-ncert-product-check.mjs
          node client/test/india-practice-availability-check.mjs
          node client/test/entitlement-check.mjs
          node client/test/question-clock-check.mjs
          node client/test/sync-contract-check.mjs
          # #300: legacy generator-keyed rows count on the chapter, its dot points and the
          # predicted paper — sibling generators, after a new answer, after a restore.
          node client/test/india-legacy-rows-check.mjs | tee india-legacy-rows.log
          node tools/ci-check-counts.mjs verify suites-contracts/india-legacy-rows.log
          node client/test/report-narrative-check.mjs | tee report-narrative.log
          node tools/ci-check-counts.mjs verify suites-contracts/report-narrative.log
          node client/test/review-consistency-check.mjs | tee review-consistency.log
          node tools/ci-check-counts.mjs verify suites-contracts/review-consistency.log
          node client/test/plan-slips-check.mjs | tee plan-slips.log
          node tools/ci-check-counts.mjs verify suites-contracts/plan-slips.log
          # Both of these guard the offline-first backup and cloud-sync paths and
          # were not being run anywhere in CI.
          node client/test/restore-durability-check.mjs
          node client/test/cloud-sync-worker-check.mjs
          # Cloud sync end to end: restore on a fresh device, automatic
          # triggers, and 409 entity-conflict recovery.
          node client/test/cloud-restore-fidelity-check.mjs
          node client/test/auto-sync-scheduler-check.mjs
          node client/test/sync-conflict-recovery-check.mjs
          node client/test/cloud-session-refresh-check.mjs
          node client/test/account-action-boundary-check.mjs
          node client/test/india-exam-blueprint-check.mjs
          node client/test/india-exam-duplicate-check.mjs
          node client/test/india-progress-product-check.mjs
          node tools/india-production-census.mjs
      - name: Real ink diagnostic (advisory in PR CI)
        if: always()
        continue-on-error: true
        run: |
          echo '::warning title=Real ink is advisory here::test:real is a diagnostic in PR CI (|| true). The blocking floor (node client/test/inkcheck-real.mjs --strict --gate, handwriting/v17/real-ink-floor.json) runs only in release-candidate.yml.'
          npm run --silent test:real || true

  suites:
    name: Suites, coverage and accuracy gates
    needs: [suites-shard, suites-contracts]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Every shard finished green
        env:
          SUITES_SHARD_RESULT: ${{ needs.suites-shard.result }}
          SUITES_CONTRACTS_RESULT: ${{ needs.suites-contracts.result }}
        run: |
          set -euo pipefail
          echo "suites-shard: $SUITES_SHARD_RESULT"
          echo "suites-contracts: $SUITES_CONTRACTS_RESULT"
          test "$SUITES_SHARD_RESULT" = success
          test "$SUITES_CONTRACTS_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download every shard log
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: suites-shard-*
          path: suite-shards
      - name: Every suite of npm test completed exactly once
        run: |
          set -euo pipefail
          test "$(ls -d suite-shards/suites-shard-* | wc -l)" -eq 4
          node tools/ci-suite-shard.mjs --verify --of=4 suite-shards/suites-shard-*/suite-shard.json
          for shard in 1 2 3 4; do cat "suite-shards/suites-shard-$shard/suites.log"; done > suites.log
      - name: Exact coverage invariants
        run: |
          set -euo pipefail
          test -s suites.log
          node tools/ci-check-counts.mjs verify suites/suites.log
          paths=$(grep -Eo 'CONTENT CERTIFICATION [(]fast, 4/path/difficulty[)]: PASS — [0-9]+' suites.log | grep -Eo '[0-9]+$')
          test "${paths:-0}" -ge 793
          if grep -Fq 'not measured:' suites.log; then
            echo 'A deterministic suite reported skipped coverage.' >&2
            exit 1
          fi
      - name: Suite log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suites-log
          path: suites.log
          if-no-files-found: error

  platform:
    name: Production account, sync and commercial schema
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A throwaway Postgres for the Supabase schema gates (ADR-0001). It lives
    # only for this job, trusts loopback connections and holds no credential;
    # the suites create, migrate and drop their own scratch databases in it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PRI_TEST_PG_ADMIN_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Handwriting stays answer-blind (static, client + server route)
        run: npm run test:ink:blind
      - name: Provider bodies carry no answer; handwriting latency budget (recorded wire, fake provider, no spend)
        run: |
          set -o pipefail
          node server/test/provider-answer-blind-check.mjs 2>&1 | tee blind.log
          node server/test/handwriting-latency-budget-check.mjs 2>&1 | tee -a blind.log
          node tools/ci-check-counts.mjs verify platform/blind.log
      - name: Cloud reader evaluation tool self-test (fake provider, no spend)
        run: npm run test:ink:cloud-eval
      - name: SQLite to Postgres export tool
        run: |
          set -o pipefail
          node server/test/sqlite-to-postgres-export-check.mjs 2>&1 | tee pg-export.log
          node tools/ci-check-counts.mjs verify platform/pg-export.log
      - name: Server release identity
        run: node server/test/release-identity-check.mjs
      - name: Runtime dependency security floor
        run: node tools/runtime-audit-floor.mjs server
      - name: Platform security floor
        run: |
          node server/test/security-headers-check.mjs
          node server/test/login-lockout-check.mjs
          node server/test/admin-bootstrap-check.mjs
          node server/test/teacher-invite-check.mjs
          node server/test/oidc-verification-check.mjs
          node server/test/verification-enforcement-check.mjs
          node server/test/housekeeping-check.mjs
          node server/test/production-runtime-image-check.mjs
          node server/test/mfa-check.mjs
          node server/test/oidc-consent-check.mjs
          node server/test/security-hardening-check.mjs
          set -o pipefail
          node server/test/rls-fail-closed-check.mjs | tee rls-fail-closed.log
          node tools/ci-check-counts.mjs verify platform/rls-fail-closed.log
          # A parent who approves by email code is sent the withdrawal credential too.
          node server/test/guardian-code-approval-withdraw-check.mjs | tee guardian-code-approval.log
          node tools/ci-check-counts.mjs verify platform/guardian-code-approval.log
          # The staging test mailbox: on only on staging and in the harness, only for
          # @e2e.prilearning.test; every other address is sent; off, the route is a 404.
          node server/test/test-mailbox-check.mjs | tee test-mailbox.log
          node tools/ci-check-counts.mjs verify platform/test-mailbox.log
          # D18: a child's account no guardian stands behind is soft-deleted after 30
          # days (enforce mode only), erased after a 7-day grace, and a guardian can ask
          # for erasure without the child's login. Also on Postgres below.
          node server/test/child-erasure-check.mjs | tee child-erasure.log
          node tools/ci-check-counts.mjs verify platform/child-erasure.log
      - name: Billing lifecycle, database operations and HTTP journeys
        run: |
          node server/test/billing-cancel-refund-check.mjs
          node server/test/billing-webhook-router-check.mjs
          node server/test/platform-db-operations-check.mjs
          node server/test/platform-http-journeys-check.mjs
          # Plan E5: billing provider per edition. Priyabhata answers as main
          # does; Prithagoras sells nothing and applies no payment event.
          node server/test/billing-edition-check.mjs | tee billing-edition.log
          node tools/ci-check-counts.mjs verify platform/billing-edition.log
      - name: Assignment targeting, syllabus snapshot and class analytics
        run: |
          node server/test/india-syllabus-snapshot-check.mjs
          node server/test/assignment-targeting-check.mjs
      - name: Server reading and step checking contracts
        run: |
          set -o pipefail
          node server/test/handwriting-transcription-check.mjs
          node server/test/working-check-check.mjs
          node server/test/area-working-rubric-check.mjs
          node server/test/question-photo-check.mjs
          # An upload behind an image header must be a PNG, JPEG or WebP by its own bytes; a non-picture never reaches a reader.
          node server/test/image-signature-check.mjs
          node server/test/tutor-help-check.mjs
          node server/test/tutor-device-journey-check.mjs
          node server/test/tutor-issued-grounding-check.mjs
          node server/test/tutor-stream-check.mjs
          node server/test/tutor-guard-complexity-check.mjs
          # Line check / live coach: a final-answer attempt is decided by form alone, never by value (#831).
          # Each pinned by count, so a loosened probe set cannot pass vacuously.
          node server/test/tutor-diagnose-check.mjs | tee tutor-diagnose.log
          node tools/ci-check-counts.mjs verify platform/tutor-diagnose.log
          node server/test/line-check-constant-pin-check.mjs | tee line-check-constant-pin.log
          node tools/ci-check-counts.mjs verify platform/line-check-constant-pin.log
          node server/test/final-attempt-oracle-sweep-check.mjs | tee final-attempt-sweep.log
          node tools/ci-check-counts.mjs verify platform/final-attempt-sweep.log
          node server/test/spend-ceiling-check.mjs
          # Plan H7: the practice day is the edition's (Priyabhata equal to main
          # over a year of instants, Sydney across daylight saving); the ceiling
          # is required, refuses, refunds and alerts under each edition.
          node server/test/edition-ai-budgets-check.mjs 2>&1 | tee edition-ai-budgets.log
          node tools/ci-check-counts.mjs verify platform/edition-ai-budgets.log
          # One paid read per unchanged picture: refresh, double click, two tabs,
          # transcript-then-Submit; never shared across accounts.
          node server/test/recognition-dedupe-check.mjs 2>&1 | tee recognition-dedupe.log
          node tools/ci-check-counts.mjs verify platform/recognition-dedupe.log
          # Round trips pinned per hot request; ink Submit is one request with one
          # paid read, answer-blind; the request meter is numbers only and
          # Server-Timing is opt-in for signed-in callers (#441 port).
          node server/test/hot-path-budget-check.mjs 2>&1 | tee hot-path-budget.log
          node tools/ci-check-counts.mjs verify platform/hot-path-budget.log
          # A photographed page: the answer proposed is mathematics, never a sentence;
          # unrelated lines are left out by default and never break the working.
          node client/test/photo-pipeline-check.mjs 2>&1 | tee photo-pipeline.log
          node tools/ci-check-counts.mjs verify platform/photo-pipeline.log
          node server/test/photo-working-marking-http-check.mjs 2>&1 | tee -a photo-pipeline.log
          node tools/ci-check-counts.mjs verify platform/photo-pipeline.log#2
          node server/test/guardian-consent-check.mjs
          node server/test/guardian-notice-version-check.mjs
          node client/test/task03-guardian-notice-check.mjs
          # The parent weekly report (D22): off by default — no route mounted,
          # no job — and, switched on for the test, double opt-in under RLS.
          node server/test/parent-report-check.mjs 2>&1 | tee parent-report.log
          node tools/ci-check-counts.mjs verify platform/parent-report.log
          # The shared resource library (ADR-0002 plan F1): signed-in only, published
          # only, the server's own edition only; the seed equals the migration's.
          node server/test/resources-check.mjs 2>&1 | tee resources.log
          node tools/ci-check-counts.mjs verify platform/resources.log
          # The Exam Desk (ADR-0002 §8 plan F4a): the unmarked mode — server-stamped
          # clock, one open attempt per paper, the import, never a mark — and the
          # static proof that it reaches nothing of the marking path.
          node server/test/desk-check.mjs 2>&1 | tee desk.log
          node tools/ci-check-counts.mjs verify platform/desk.log
          node server/test/desk-isolation-check.mjs 2>&1 | tee -a desk.log
          node tools/ci-check-counts.mjs verify platform/desk.log#2
          # One deployment, one edition (ADR-0002 plan E2): the server starts only
          # over a client built for its own edition, X-Pri-Edition only ever
          # refuses (409 everywhere but health and readiness), no request chooses it.
          node server/test/edition-agreement-check.mjs 2>&1 | tee edition-agreement.log
          node tools/ci-check-counts.mjs verify platform/edition-agreement.log
      # Real HTTP against the shipped app, no mocked receipts. Method marks need
      # progress (neutral working earns 0, one genuine step earns partial marks,
      # replays are identical, the persisted attempt carries the same marks), and
      # issuing by seed is deterministic, answer-free and per-account — which is
      # what lets the server adopt a question a device started. Both also run on
      # Postgres below.
      - name: Server-issued practice over HTTP (method progress, seed re-issue, the free daily cap, tutor grounding negatives)
        run: |
          set -o pipefail
          node server/test/method-progress-http-check.mjs 2>&1 | tee practice-http.log
          node server/test/flagship-ap-working-http-check.mjs 2>&1 | tee -a practice-http.log
          node server/test/owner-ap-first-mistake-contract-check.mjs 2>&1 | tee -a practice-http.log
          node server/test/ap-term-firstbreak-regression-check.mjs 2>&1 | tee -a practice-http.log
          node server/test/practice-seed-reissue-check.mjs 2>&1 | tee -a practice-http.log
          node server/test/practice-server-question-check.mjs 2>&1 | tee -a practice-http.log
          node server/test/practice-repeat-credit-check.mjs 2>&1 | tee -a practice-http.log
          # Learning-state identity (v2), exact legacy lookups and monotonic expiry (#689, #690, #691) on SQLite; Postgres below.
          node server/test/learning-state-identity-check.mjs 2>&1 | tee -a practice-http.log
          node tools/ci-check-counts.mjs verify platform/practice-http.log
          node server/test/india-bank-issue-coverage-check.mjs 2>&1 | tee -a practice-http.log
          node server/test/practice-seek-budget-check.mjs 2>&1 | tee -a practice-http.log
          node server/test/practice-trap-seek-check.mjs 2>&1 | tee -a practice-http.log
          node server/test/practice-hints-notebook-check.mjs 2>&1 | tee -a practice-http.log
          node server/test/practice-hint-work-check.mjs 2>&1 | tee -a practice-http.log
          node tools/ci-check-counts.mjs verify platform/practice-http.log#2
          node client/test/hint-ladder-check.mjs 2>&1 | tee -a practice-http.log
          node client/test/review-queue-check.mjs 2>&1 | tee -a practice-http.log
          node client/test/spaced-review-check.mjs 2>&1 | tee -a practice-http.log
          node tools/ci-check-counts.mjs verify platform/practice-http.log#3
          node server/test/practice-daily-cap-check.mjs 2>&1 | tee -a practice-http.log
          # After a relaunch or on another device the device's avoid list is empty: the server's picker reads the account's own seen records.
          node server/test/practice-seen-aware-pick-check.mjs 2>&1 | tee -a practice-http.log
          # Plan G3: the edition decides the bank. Prithagoras issues only mapped NSW content, seals jurisdiction/syllabus/outcome,
          # marks the final answer only with the method-mark switch on, and Priyabhata is unchanged. SQLite here; Postgres below.
          node server/test/nsw-practice-check.mjs 2>&1 | tee -a practice-http.log
          node tools/ci-check-counts.mjs verify platform/practice-http.log#4
          node server/test/premium-practice-content-check.mjs 2>&1 | tee -a practice-http.log
          node server/test/mistake-notebook-check.mjs 2>&1 | tee -a practice-http.log
          node server/test/forecast-check.mjs 2>&1 | tee -a practice-http.log
          node server/test/mistake-dna-check.mjs 2>&1 | tee -a practice-http.log
          node tools/ci-check-counts.mjs verify platform/practice-http.log#5
      - name: Marker isolation (worker pool, hard deadline, exactly-once under concurrency)
        run: |
          set -o pipefail
          node server/test/marker-isolation-check.mjs 2>&1 | tee marker-isolation.log
          node tools/ci-check-counts.mjs verify platform/marker-isolation.log
      # Races the request thread cannot serialise on its own, and the guardian
      # gate across every router holding a child's data. Real /v1 routes, real
      # marker; the same suites run on Postgres below.
      - name: Reveal/submit race, deletion mid-mark, billing event order and guardian-consent coverage (SQLite)
        run: |
          set -o pipefail
          node server/test/practice-reveal-submit-race-check.mjs 2>&1 | tee races.log
          node server/test/account-deletion-midflight-check.mjs 2>&1 | tee -a races.log
          node server/test/billing-out-of-order-concurrency-check.mjs 2>&1 | tee -a races.log
          node server/test/guardian-consent-coverage-check.mjs 2>&1 | tee -a races.log
          node tools/ci-check-counts.mjs verify platform/races.log
      - name: Account, origin, CMS and classroom contracts
        run: |
          node server/test/account-deletion-reauth-check.mjs
          node server/test/account-deletion-public-check.mjs
          node server/test/account-deletion-session-binding-check.mjs
          node server/test/export-reauth-check.mjs
          node server/test/password-set-check.mjs
          node server/test/session-alerts-check.mjs
          node server/test/native-origin-csrf-check.mjs
          node server/test/billing-config-check.mjs
          node server/test/content-review-contract-check.mjs
          node server/test/assignment-execution-contract-check.mjs
          node server/test/classroom-submission-contract-check.mjs
      - name: Rate-limit identity, sync idempotency, grants, body size, compressed-body survival and catalogue exposure
        run: |
          node server/test/proxy-identity-contract-check.mjs
          node server/test/client-ip-header-check.mjs
          node server/test/sync-idempotency-contract-check.mjs
          node server/test/practice-attempt-sync-check.mjs
          node server/test/entitlement-admin-grant-check.mjs
          node server/test/request-size-contract-check.mjs
          # GHSA-27r3-jxmh-p828: a gzip body with trailing bytes must leave the process answering.
          node server/test/compressed-body-survival-check.mjs
          node server/test/content-index-exposure-check.mjs
      - name: Structured logs, readiness, metrics, alert policy and failure drills (SQLite)
        run: |
          set -o pipefail
          node server/test/observability-check.mjs 2>&1 | tee ops.log
          node server/test/failure-drills-check.mjs 2>&1 | tee -a ops.log
          node server/test/alert-notifier-check.mjs 2>&1 | tee -a ops.log
          node server/test/error-telemetry-check.mjs 2>&1 | tee -a ops.log
          node server/test/static-caching-check.mjs 2>&1 | tee -a ops.log
          node tools/ci-check-counts.mjs verify platform/ops.log
      # V1 blocker #14: every /v1 route is in the reviewed inventory with the
      # guards really mounted on it; every object-level route fails closed for
      # no session, revoked sessions, wrong account, wrong role, unverified
      # email, pending consent and bad CSRF; hostile input is a coded 4xx; every
      # declared rate limit holds; the production browser boundary (Origin,
      # CORS, cookie flags, HSTS/CSP, redirects) holds; no secret leaks into a
      # response or a log. The two engine-agnostic suites also run on Postgres below.
      - name: Security acceptance (route inventory, BOLA/authz negatives, abuse limits, production boundary)
        run: |
          set -o pipefail
          node server/test/route-inventory-check.mjs
          node server/test/sql-parameterisation-check.mjs
          # What the secret sweep below counts as a leaked key (support/secret-shapes.mjs):
          # every real key shape is still read, the server's own session/CSRF mints never
          # are (issue #526). Without this pin a loosened shape would make the sweep vacuous.
          node server/test/secret-shape-check.mjs 2>&1 | tee secret-shapes.log
          node tools/ci-check-counts.mjs verify platform/secret-shapes.log
          node server/test/security-acceptance-check.mjs
          node server/test/abuse-limits-check.mjs
          # CodeQL #461: prove the recognize route's account-keyed, atomic limit
          # under simultaneous requests rather than only the serial boundary.
          node server/test/pr618-recognition-rate-concurrency-check.mjs
          node server/test/security-production-mode-check.mjs
      - name: Security P2s (admin MFA on class routes, export completeness, RLS account coverage, OTP delete asymmetry)
        run: |
          set -o pipefail
          node server/test/admin-mfa-class-routes-check.mjs 2>&1 | tee security-p2.log
          node server/test/account-export-completeness-check.mjs 2>&1 | tee -a security-p2.log
          node server/test/rls-account-coverage-check.mjs 2>&1 | tee -a security-p2.log
          node server/test/otp-delete-asymmetry-check.mjs 2>&1 | tee -a security-p2.log
          node tools/ci-check-counts.mjs verify platform/security-p2.log
      - name: Server-authoritative examination papers (SQLite)
        run: |
          set -o pipefail
          node server/test/exam-authority-check.mjs 2>&1 | tee exam-authority.log
          node tools/ci-check-counts.mjs verify platform/exam-authority.log
      - name: Board mock papers — typed, labelled, one timed paper in 30 days free (SQLite)
        run: |
          set -o pipefail
          node server/test/board-mock-check.mjs 2>&1 | tee board-mock.log
          node tools/ci-check-counts.mjs verify platform/board-mock.log
      - name: Where the time went on a timed paper — measured per question, Premium on read (SQLite)
        run: |
          set -o pipefail
          node server/test/exam-time-check.mjs 2>&1 | tee exam-time.log
          node tools/ci-check-counts.mjs verify platform/exam-time.log
      - name: Targeted board mocks — capped lean, Premium-gated, server-written key (SQLite)
        run: |
          set -o pipefail
          node server/test/targeted-mock-check.mjs 2>&1 | tee targeted-mock.log
          node tools/ci-check-counts.mjs verify platform/targeted-mock.log
      - name: Exam handwriting not read at the deadline — frozen, pending, bounded reads (SQLite, synthetic reader)
        run: |
          set -o pipefail
          node server/test/exam-handwriting-check.mjs 2>&1 | tee exam-handwriting.log
          node tools/ci-check-counts.mjs verify platform/exam-handwriting.log
      - name: Commercial platform schema contract
        run: node server/test/platform-schema-check.mjs
      - name: Supabase migrations are self-contained transactions (supabase db push)
        run: node server/test/migration-transaction-check.mjs
      - name: Supabase schema parity (migration text)
        run: node server/test/postgres-schema-parity-check.mjs
      - name: Platform store, concurrency, sync burst, connection config and fail-closed startup (SQLite)
        run: |
          node server/test/platform-store-check.mjs
          node server/test/platform-concurrency-check.mjs
          node server/test/platform-sync-burst-check.mjs
          set -o pipefail
          node server/test/postgres-connection-config-check.mjs | tee postgres-connection-config.log
          node tools/ci-check-counts.mjs verify platform/postgres-connection-config.log
          node server/test/platform-startup-check.mjs
      - name: Supabase migrations and every engine-agnostic platform suite on real Postgres
        run: |
          set -o pipefail
          node scripts/with-postgres.mjs node server/test/run-platform-postgres.mjs 2>&1 | tee platform-postgres.log
          node tools/ci-check-counts.mjs verify platform/platform-postgres.log
      - name: Platform migration contract
        run: node server/test/platform-migration-check.mjs
      - name: Billing v3 to v4 payment-retention rebuild on a populated SQLite database
        run: node server/test/billing-payment-retention-migration-check.mjs
      - name: Cross-account sync pagination regression
        run: node server/test/platform-sync-pagination-check.mjs
      - name: Production persistent-storage contract
        run: node server/test/production-storage-config-check.mjs
      - name: Production DB bootstrap order contract
        run: node server/test/production-db-bootstrap-check.mjs
      - name: Account lifecycle and session rotation
        run: node server/test/account-lifecycle-contract-check.mjs
      - name: Account lifecycle journey, deletion against the retention table (SQLite)
        run: node server/test/account-lifecycle-journey-check.mjs
      - name: Encrypted verification/reset email worker
        run: node server/test/auth-delivery-worker-check.mjs
      - name: Production email delivery configuration
        run: node server/test/auth-delivery-config-check.mjs
      - name: Auth email readiness probe and coded send failures
        run: |
          set -o pipefail
          node server/test/auth-email-readiness-check.mjs 2>&1 | tee auth-email-ready.log
          node tools/ci-check-counts.mjs verify platform/auth-email-ready.log
      - name: Razorpay billing lifecycle
        run: node server/test/razorpay-billing-check.mjs
      - name: Apple billing lifecycle
        run: node server/test/apple-billing-check.mjs
      - name: Client compatibility floor (CP-11)
        run: node server/test/client-compatibility-check.mjs
      - name: Server-paid operations obey the server's entitlement (SEC-COMM-01)
        run: node server/test/premium-authority-check.mjs
      - name: Google Play billing verification
        run: node server/test/google-billing-check.mjs
      # §19 / V1 blocker #7 (code side): the StoreKit entitlement state machine
      # across renewal, grace, cancellation, expiry, refund, upgrade, restore,
      # account switch, duplicate/out-of-order/replayed/forged notifications,
      # plus the operator reconciliation CLI. Also runs on Postgres above.
      - name: StoreKit entitlement state machine and reconciliation
        run: |
          set -o pipefail
          node server/test/storekit-entitlement-state-machine-check.mjs 2>&1 | tee storekit.log
          node tools/ci-check-counts.mjs verify platform/storekit.log

  # The browser suites fan out by flow group and engine (WebKit alone in
  # webkit-layout). Each group runs its commands exactly as the single job
  # did, in the same order, and uploads its log. The job named "Browser suites
  # (end-to-end and accessibility)" (the required check) runs always(), fails
  # unless every group succeeded, and runs the unchanged invariant block
  # against the concatenated group logs. tools/ci-runner-policy-check.mjs
  # proves every command of npm run test:e2e is in exactly one group.
  # The restore drill postgres-cutover.md §6 and ADR-0001 require, rehearsed
  # on throwaway databases: a pg_dump of a live platform restored into an EMPTY
  # database must carry every row, RLS policy, pri_server grant and the cursor
  # sequence, and the real server on it must keep sessions, passwords,
  # histories, marks and Premium. pg_dump refuses a newer server, so the job
  # installs the client tools of the service's major version. A job of its own:
  # the apt step never sits inside a required check.
  postgres-restore:
    name: Postgres backup restore rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PRI_TEST_PG_ADMIN_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: PostgreSQL 17 client tools (pg_dump and pg_restore at the server's major version)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q --no-install-recommends postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: pg_dump of a live platform restored into an empty database, then served as pri_server
        run: |
          set -o pipefail
          node scripts/with-postgres.mjs node server/test/postgres-restore-rehearsal-check.mjs 2>&1 | tee restore.log
          node tools/ci-check-counts.mjs verify postgres-restore/restore.log

  browser-shard:
    name: Browser shard (${{ matrix.group }})
    runs-on: ubuntu-24.04
    # The accessibility gate builds the client itself; give it the same flags
    # client/test/e2e.mjs uses for its build so both walk the same app (the
    # Teacher role and Olympiad live behind EXTENDED_TRACKS, the AU link behind
    # AUSTRALIA). PRI_FEATURE_TUTOR stays unset: the tutor tour proves dark.
    env:
      PRI_FEATURE_PLACEMENT: '1'
      PRI_FEATURE_EXTENDED_TRACKS: '1'
      PRI_FEATURE_AUSTRALIA: '1'
      # Handwriting input in timed exams (off by default in a shipped build): the
      # browser suites drive the gate-ON flow explicitly.
      PRI_FEATURE_EXAM_HANDWRITING: '1'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [e2e-core, e2e-accounts, chromium-layout, webkit-layout, a11y-boot]
        include:
          - group: e2e-core
            browsers: chromium webkit
            prebuild: false
          - group: e2e-accounts
            browsers: chromium webkit
            prebuild: true
          - group: chromium-layout
            browsers: chromium webkit
            prebuild: true
          - group: webkit-layout
            browsers: webkit
            prebuild: true
          - group: a11y-boot
            browsers: chromium webkit
            prebuild: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Install client dependencies
        run: npm ci --prefix client
      # The marking flows, tour-otp-onboarding.js and the accessibility walk
      # drive the real platform server in-process (SQLite file, SMS/email test
      # adapters, synthetic handwriting reader at the provider hop — see
      # client/test/support/online-session.mjs), so this job needs its
      # dependencies. No server environment or secret is required.
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}-${{ matrix.browsers }}
      # The browsers' system packages (apt). `playwright install --with-deps`
      # ran apt on every shard, cached browsers or not, and apt is where the
      # 20-minute mode lived. Measured from the jobs API over the 344 shard
      # installs that ran between 22 Oct and 1 Nov: 283 took under a minute, the
      # slowest in a green shard took 594 s, and nine took 1117 to 1200 s. All
      # nine logs show apt and no browser download at all: the two that finished
      # say "Fetched 119 MB in 19min 2s (104 kB/s)" and "in 18min 17s (108 kB/s)",
      # and the other seven were cancelled with apt still fetching. A .deb that
      # is already in apt's archive with the size and hash the package index
      # names is not fetched again (a stale or altered file is), so the packages
      # one run downloaded are kept for the next run on the same runner image.
      - name: Runner image build (keys the package cache)
        id: image
        run: echo "build=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache the browsers' system packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-debs
          key: apt-debs-${{ steps.image.outputs.build }}-${{ hashFiles('client/package-lock.json') }}-${{ matrix.browsers }}
      # Two commands, bounded differently, because a kill is safe for one and
      # not the other. System packages: once, never under `timeout` — GNU
      # timeout signals the whole process group, and a SIGTERM while dpkg is
      # unpacking leaves the package database interrupted so that a retry
      # fails outright; only this step's own limit bounds it. Browser builds:
      # Playwright downloads to a temporary file, so a stalled download is cut
      # and started again; each attempt gets at most 600 s (above the 594 s
      # slowest green install, apt included, and well under the 1117 s hung mode),
      # and a second attempt gets whatever of the step's budget is left. The
      # 12-minute step keeps about seven minutes of the 20-minute shard for the
      # suites themselves (the slowest green group runs in about five).
      - name: Install ${{ matrix.browsers }}
        working-directory: client
        timeout-minutes: 12
        env:
          APT_DEBS: ${{ runner.temp }}/apt-debs
          BROWSERS: ${{ matrix.browsers }}
        run: |
          set -o pipefail
          budget=690
          # 1 · system packages, from the cached .deb files where they match
          if compgen -G "$APT_DEBS/*.deb" > /dev/null; then
            sudo cp "$APT_DEBS"/*.deb /var/cache/apt/archives/
            echo "apt: $(ls "$APT_DEBS"/*.deb | wc -l) cached package files offered"
          fi
          npx playwright install-deps $BROWSERS
          mkdir -p "$APT_DEBS"
          sudo find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -f {} "$APT_DEBS"/ \;
          sudo chown -R "$(id -u):$(id -g)" "$APT_DEBS"
          echo "apt: $(ls "$APT_DEBS"/*.deb 2>/dev/null | wc -l) package files kept for the next run, ${SECONDS}s so far"
          # 2 · browser builds, bounded and retried
          for attempt in 1 2; do
            left=$(( budget - SECONDS ))
            if (( left < 60 )); then break; fi
            bound=$(( left < 600 ? left : 600 ))
            set +e
            timeout "$bound" npx playwright install $BROWSERS
            status=$?
            set -e
            if (( status == 0 )); then
              echo "browsers: installed on attempt ${attempt}, ${SECONDS}s in all"
              exit 0
            fi
            if (( status != 124 )); then
              echo "::error title=Playwright install failed::browser install exited ${status} on attempt ${attempt}" >&2
              exit "$status"
            fi
            echo "::warning title=Playwright install retry::attempt ${attempt} did not finish within ${bound}s; starting again" >&2
            sleep 10
          done
          echo "::error title=Playwright install failed::browser download did not finish inside this step's ${budget}s budget" >&2
          exit 1
      # The single job's later tours ran --no-build against the build
      # tour-ai-tutor.js leaves behind: the job's feature flags, tutor off.
      # A group that starts with --no-build tours makes that same build first.
      - name: Test build (the build tour-ai-tutor.js leaves in client/dist)
        if: matrix.prebuild
        env:
          PRI_FEATURE_TUTOR: '0'
        run: node --input-type=module -e "const { ensureBuild } = await import('./client/test/e2e.mjs'); ensureBuild(true);"
      - name: Browser suites (${{ matrix.group }})
        run: |
          set -o pipefail
          : > browser.log
          case "${{ matrix.group }}" in
            e2e-core)
            # npm run test:e2e, part 1: the canonical suite (it builds the
            # client), then the focused flows that run on the dist it built.
            node client/test/e2e.mjs 2>&1 | tee -a browser.log
            # The sign-in card helper the gate and login tours sign in with:
            # a card that leaves the page is read in one look, never waited on.
            node client/test/signin-card-step-check.mjs 2>&1 | tee -a browser.log
            node client/test/notes-illustrated-browser-check.mjs --no-build 2>&1 | tee -a browser.log
            node client/test/notes-wave8-browser-check.mjs --no-build 2>&1 | tee -a browser.log
            # A request cancelled by leaving the page is not "no connection":
            # no unmarkable offline draft is stored (WebKit runs on first).
            node client/test/page-leaving-draft-check.mjs 2>&1 | tee -a browser.log
            node client/test/tour-explain-v2.js --no-build 2>&1 | tee -a browser.log
            node client/test/tour-hindi.js --no-build 2>&1 | tee -a browser.log
              ;;
            e2e-accounts)
            # npm run test:e2e, part 2, in order, ending with tour-ai-tutor.js
            # (which leaves the flag-off build in client/dist), then the platform
            # tours CI repeats against that build.
            node client/test/tour-cloud-platform.js --no-build 2>&1 | tee -a browser.log
            node client/test/tour-social-sign-in.js --no-build 2>&1 | tee -a browser.log
            node client/test/tour-otp-onboarding.js --no-build 2>&1 | tee -a browser.log
            node client/test/tour-activation-gate.js --no-build 2>&1 | tee -a browser.log
            node client/test/tour-account-deletion.js --no-build 2>&1 | tee -a browser.log
            node client/test/tour-unverified-email.js --no-build 2>&1 | tee -a browser.log
            node client/test/tour-admin-cms-platform.js --no-build 2>&1 | tee -a browser.log
            node client/test/tour-admin-independent-review.js --no-build 2>&1 | tee -a browser.log
            node client/test/tour-progress-truth.js --no-build 2>&1 | tee -a browser.log
            node client/test/tour-write-sign-in.js --no-build 2>&1 | tee -a browser.log
            node client/test/tour-online-check.js --no-build 2>&1 | tee -a browser.log
            # D17 (L4): asked once, naming OpenAI, before the first read — phone finger, tablet, photo, offline ink.
            node client/test/tour-ink-reader-permission.js --no-build 2>&1 | tee -a browser.log
            # Task 02: mounted server-authoritative method credit and stale receipt rejection.
            node client/test/tour-verified-mark-breakdown.js --no-build 2>&1 | tee -a browser.log
            node client/test/tour-free-cap.js --no-build 2>&1 | tee -a browser.log
            # The Exam Desk (ADR-0002 §8 plan F4b): unmarked practice on a library
            # paper. It makes its own builds (PRI_FEATURE_LIBRARY and
            # PRI_FEATURE_EXAM_DESK are build-time: desk off, then on) and leaves
            # this job's build behind; tour-ai-tutor.js then makes its own.
            node client/test/tour-exam-desk.js 2>&1 | tee -a browser.log
            node client/test/tour-ai-tutor.js 2>&1 | tee -a browser.log
            node client/test/tour-cloud-platform.js --no-build 2>&1 | tee -a browser.log
            node client/test/tour-admin-cms-platform.js --no-build 2>&1 | tee -a browser.log
            node client/test/tour-admin-independent-review.js --no-build 2>&1 | tee -a browser.log
              ;;
            chromium-layout)
            # CP-03: the responsive product matrix in both engines (WebKit is the
            # engine behind every Apple web view).
            node client/test/tour-responsive-matrix.js --no-build 2>&1 | tee -a browser.log
            # iPhone portrait (393 × 852): safe areas, the sticky action bar as
            # its own spacer, the full-width mode switch, Write and Photo space,
            # and iPad/desktop composition unchanged. Both engines.
            node client/test/tour-iphone-layout.js --no-build 2>&1 | tee -a browser.log
            # Phase 3: every student screen at phone and tablet, paper and dark —
            # accessible names, keyboard focus, 44px touch targets, 200% text,
            # layout shift, input timing and visual snapshots (compared only
            # against baselines committed for this platform and engine).
            node client/test/tour-interface-quality.js --no-build 2>&1 | tee -a browser.log
            # The owner's photographed page (scripted reader): transcript, unrelated lines,
            # corrected line, proposed answer, durable draft; and the usage-limit state.
            node client/test/tour-photo-answer.js --no-build 2>&1 | tee -a browser.log
            # #449/#550: handwriting never vanishes under the pen — same-size
            # resize callbacks, re-subscribe mid-stroke, cancelled strokes, theme
            # flips and the default-bitmap first mount, with real bitmaps and
            # pointer input. Chromium + WebKit × dpr 1.25/1.5 × mouse/pen, dark.
            # Emulated scale factors, not Windows 11 hardware evidence.
            node client/test/ink-canvas-loss-browser-check.mjs 2>&1 | tee -a browser.log
            # Truthful handwritten feedback (scripted reader, real server marks): a
            # misread page with a typed final answer, working the server did and did
            # not check, and annotations that die with the revision they were about.
            node client/test/tour-truthful-ink.js --no-build 2>&1 | tee -a browser.log
            # The Instrument's own shell, Index, command bar and first-offline
            # tabs (#658). Every build ships it (client/interface.config.mjs),
            # so it runs on this group's build like the tours above.
            node client/test/tour-instrument.js --no-build 2>&1 | tee -a browser.log
            # Maths at 200% text (375 and 430 pt iPhones): superscripted formulas
            # wrap or scroll in their own box, nothing cut (WCAG 1.4.10).
            node client/test/tour-math-reflow.js --no-build 2>&1 | tee -a browser.log
              ;;
            webkit-layout)
            node client/test/tour-responsive-matrix.js --no-build --browser=webkit 2>&1 | tee -a browser.log
            node client/test/tour-iphone-layout.js --no-build --browser=webkit 2>&1 | tee -a browser.log
            # Account first (issue #477): the one sign-in card and the activation
            # gate on every route — adult, minor and guardian, sign-out, deep
            # links, reload, opened offline. Chromium runs it in test:e2e; WebKit
            # here (WebKit cannot reload a page offline under Playwright, so the
            # opened-offline checks are Chromium-only and the run says so).
            node client/test/tour-activation-gate.js --no-build --browser=webkit 2>&1 | tee -a browser.log
            # Task 02: identical mounted grade UI contract in WebKit as Chromium.
            node client/test/tour-verified-mark-breakdown.js --no-build --browser=webkit 2>&1 | tee -a browser.log
            node client/test/tour-interface-quality.js --no-build --browser=webkit 2>&1 | tee -a browser.log
            node client/test/tour-truthful-ink.js --no-build --browser=webkit 2>&1 | tee -a browser.log
            node client/test/tour-math-reflow.js --no-build --browser=webkit 2>&1 | tee -a browser.log
            # The Exam Desk in WebKit (the engine behind every Apple web view):
            # the same sitting, import and Hindi journeys as Chromium. Last in
            # the group: it makes its own flagged builds and restores this one.
            node client/test/tour-exam-desk.js --browser=webkit 2>&1 | tee -a browser.log
              ;;
            a11y-boot)
            npm run test:a11y 2>&1 | tee -a browser.log
            # Plan E5: a built Prithagoras client on a Prithagoras server shows
            # no price, plan or purchase control and reaches no store.
            node client/test/tour-paywall-edition.js 2>&1 | tee -a browser.log
            # A failed chunk, a refused cache write or a probe that never settles must
            # end in the app or in a visible notice with Reload, never a silent splash.
            npm run test:boot 2>&1 | tee -a browser.log
              ;;
            *)
              echo "unknown browser group" >&2
              exit 1
              ;;
          esac
      - name: Shard log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-shard-${{ matrix.group }}
          path: browser.log
          if-no-files-found: error
      # What the screen showed when a flow failed. The log names these files, and
      # until now they died with the runner, so a stall in a shard could only be
      # guessed at from its timeout. Not named browser-shard-*: the job below
      # downloads that pattern and requires exactly one log for each group.
      - name: Failure screens
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-screens-${{ matrix.group }}
          path: /tmp/pri-e2e-shots-*/*FAIL*.png
          if-no-files-found: ignore
          retention-days: 14

  browser:
    name: Browser suites (end-to-end and accessibility)
    needs: [browser-shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Every shard finished green
        env:
          BROWSER_SHARD_RESULT: ${{ needs.browser-shard.result }}
        run: |
          set -euo pipefail
          echo "browser-shard: $BROWSER_SHARD_RESULT"
          test "$BROWSER_SHARD_RESULT" = success
      # The pins are read from ci/check-counts.json by tools/ci-check-counts.mjs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download every shard log
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: browser-shard-*
          path: browser-shards
      - name: Combine the shard logs
        run: |
          set -euo pipefail
          for group in e2e-core e2e-accounts chromium-layout webkit-layout a11y-boot; do
            test -s "browser-shards/browser-shard-$group/browser.log"
            cat "browser-shards/browser-shard-$group/browser.log"
          done > browser.log
          test "$(ls -d browser-shards/browser-shard-* | wc -l)" -eq 5
      - name: Browser coverage invariants
        if: always()
        run: |
          set -euo pipefail
          test -s browser.log
          node tools/ci-check-counts.mjs verify browser/browser.log
          if grep -Fq 'not measured:' browser.log; then
            echo 'A browser suite reported skipped coverage.' >&2
            exit 1
          fi
      - name: Browser log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-log
          path: browser.log
          if-no-files-found: error

  build:
    name: Client build and offline-first boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Release authority contract
        run: node tools/pri01-release-authority-check.mjs
      - name: Build
        run: npm run build
      - name: Exact release identity
        run: node tools/verify-release-identity.mjs
      # Plan E4: this build carries only its own edition's brand, and the
      # other edition's build (made here into a temporary folder) differs from
      # it only in the brand files and the one chunk holding the wordmark.
      - name: Each edition's build carries only its own brand
        run: |
          set -euo pipefail
          node client/test/brand-build-check.mjs --both | tee brand-build.log
          node tools/ci-check-counts.mjs verify build/brand-build.log
      # The iOS web bundles are generated here, never read from git (decision
      # D28): sync copies client/dist into both packages, check proves each
      # copy is complete and byte-exact, then the shipped bytes are inspected.
      - name: Generate the iOS web bundles from this build
        run: npm run sync:ios
      - name: iOS bundles are a complete copy of the client build
        run: npm run check:ios
      - name: Verify exact native release identity
        run: npm run verify:release:native
      - name: Generated iOS bundles are flag-off production builds of the one interface
        # The exact count moved here with the suite (it no longer runs in the
        # sharded npm test): a check that silently ran fewer cases fails.
        run: |
          set -euo pipefail
          node client/test/ios-bundle-features-check.mjs | tee ios-bundle-features.log
          node tools/ci-check-counts.mjs verify build/ios-bundle-features.log
      - name: Generated iOS bundle pages need no inline script under the shell CSP
        run: node client/test/native-shell-csp-check.mjs --require-generated
      # After the build, so the scan reads the bytes that ship: every tracked
      # file and client/dist (the generated iOS bundles are a byte-exact copy
      # of client/dist, proven by check:ios above).
      - name: Secret scan (tracked files, built client and therefore the iOS bundles)
        run: |
          node tools/secret-scan.test.mjs
          node tools/secret-scan.mjs
      - name: Cross-platform release matrix (CP-11)
        run: node scripts/release-matrix.mjs --require-native-apple
      - name: Built client loads no remote presentation assets
        run: |
          set -euo pipefail
          test -d client/dist
          count="$(find client/dist \( -name '*.html' -o -name '*.css' \) -type f | wc -l | tr -d ' ')"
          test "$count" -gt 0
          if grep -rnoIE --include='*.html' --include='*.css' '(src|href)="https?://|@import[^;]*https?://|url\(https?://' client/dist; then
            echo 'Built client contains a remote presentation load.' >&2
            exit 1
          fi
          echo "read $count built HTML/CSS files: none loads remote presentation assets"
      - name: Client network calls stay behind audited transport
        run: node tools/check-client-network-boundary.mjs
      # The bytes, not just the names. Rolldown emits a ~60-byte re-export stub
      # beside each named chunk (strings.hi-*.js, ncertTerms-*.js) and those do
      # land in the precache; what must not is the data behind them. So this
      # asserts both: the big chunks are absent from the install, and nothing
      # precached that names these modules is large enough to BE them.
      - name: Hindi and the NCERT glossary stay out of the install precache
        run: |
          set -euo pipefail
          for name in i18n-hi i18n-terms; do
            chunk="$(find client/dist/assets -name "$name-*.js" -type f | head -1)"
            test -n "$chunk"
            echo "$name built as $(basename "$chunk") ($(wc -c < "$chunk" | tr -d ' ') bytes)"
            if grep -Fq "$(basename "$chunk")" client/dist/sw.js; then
              echo "$name is in the service worker install precache — every reader would download it." >&2
              exit 1
            fi
            echo "  absent from the generated service worker's install list"
          done
          for stub in $(grep -oE '(strings\.hi|ncertTerms)-[A-Za-z0-9_-]+\.js' client/dist/sw.js | sort -u); do
            bytes="$(wc -c < "client/dist/assets/$stub" | tr -d ' ')"
            echo "precached $stub is $bytes bytes"
            if [ "$bytes" -gt 1024 ]; then
              echo "$stub is precached and is not a re-export stub — the catalogue itself is in the install." >&2
              exit 1
            fi
          done

  engine-benchmark:
    # Ledger 3.8: the deterministic marker's confusion table, regenerated on
    # every merge to main and kept as a run artifact. Synthetic evidence only
    # (the report's header says so); --strict fails on any accepted wrong
    # answer. The release gates for marking live in the suites job above.
    name: Engine benchmark report (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Regenerate the confusion table
        run: |
          set -o pipefail
          npm run engine:benchmark -- --strict 2>&1 | tee engine-benchmark.log
          test -s docs/evidence/engine-benchmark.md
          grep -Fq 'Synthetic self-consistency evidence. Not an accuracy claim.' docs/evidence/engine-benchmark.md
      - name: Engine benchmark report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-benchmark
          path: |
            docs/evidence/engine-benchmark.md
            engine-benchmark.log
          retention-days: 90
