name: CI

on:
  push:
  pull_request:

jobs:
  suites:
    name: Suites, coverage and accuracy gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Every deterministic suite
        run: |
          set -o pipefail
          npm test 2>&1 | tee suites.log
      - name: Exact coverage invariants
        run: |
          set -euo pipefail
          test -s suites.log
          grep -Fq '1344000/1344000 self-checks passed across 168 subtopics' suites.log
          grep -Fq '21000/21000 multipart part-checks passed' suites.log
          grep -Fq '✔ INDIA SUITE PASSED — 1432/1432 checks' suites.log
          grep -Fq '5136 questions from 428 declared (generator, difficulty) pairs × 12 draws — 5136 marked correct by their own marker, 5136 well formed' suites.log
          grep -Fq '246/246 dot points have a generator behind them; 0 do not' suites.log
          grep -Fq 'PASS — Grade 9 Ganita Manjari: 1280 seeded forms (1000 numeric handwriting-ready, 280 conceptual).' suites.log
          grep -Fq 'PASS — 8/8 chapters, 200/200 uploaded pages, 42/42 formal exercise sections and 293/293 formal exercise prompts represented and verified.' suites.log
          if grep -Fq 'not measured:' suites.log; then
            echo 'A deterministic suite reported skipped coverage.' >&2
            exit 1
          fi
      - name: Real ink diagnostic
        if: always()
        run: npm run --silent test:real || true
      - name: Suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suites-log
          path: suites.log
          if-no-files-found: error

  browser:
    name: Browser suites (end-to-end and accessibility)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Install Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: End-to-end suite
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee browser.log
      - name: Accessibility suite
        if: always()
        run: |
          set -o pipefail
          npm run test:a11y 2>&1 | tee -a browser.log
      - name: Browser coverage invariants
        if: always()
        run: |
          set -euo pipefail
          test -s browser.log
          grep -Eq 'E2E SUITE.*129/129.*5 flows' browser.log
          grep -Eq 'ACCESSIBILITY SUITE.*38/38.*11 groups' browser.log
          if grep -Fq 'not measured:' browser.log; then
            echo 'A browser suite reported skipped coverage.' >&2
            exit 1
          fi
      - name: Browser log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-log
          path: browser.log
          if-no-files-found: error

  build:
    name: Client build and offline guarantee
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Build
        run: npm run build
      - name: iOS bundle matches the client build
        run: npm run check:ios
      - name: Built client loads nothing remote
        run: |
          set -euo pipefail
          test -d client/dist
          count="$(find client/dist \( -name '*.html' -o -name '*.css' \) -type f | wc -l | tr -d ' ')"
          test "$count" -gt 0
          if grep -rnoIE --include='*.html' --include='*.css' '(src|href)="https?://|@import[^;]*https?://|url\(https?://' client/dist; then
            echo 'Built client contains a remote load.' >&2
            exit 1
          fi
          echo "read $count built HTML/CSS files: none loads anything remote"
      - name: Source opens no connection
        run: |
          set -euo pipefail
          test -d client/src
          count="$(find client/src -type f \( -name '*.js' -o -name '*.jsx' \) | wc -l | tr -d ' ')"
          test "$count" -gt 0
          if grep -rn 'fetch(\|XMLHttpRequest\|sendBeacon\|new WebSocket\|EventSource' client/src; then
            echo 'Client source opens a network connection.' >&2
            exit 1
          fi
          echo "read $count source files: no fetch, XHR, beacon, WebSocket or EventSource"
