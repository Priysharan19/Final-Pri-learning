name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # "Every deterministic suite" (the root npm test chain) fans out across
  # SUITE_SHARDS runners; tools/ci-suite-shard.mjs assigns every suite of
  # package.json "test" to exactly one shard and writes a manifest. The job
  # named "Suites, coverage and accuracy gates" (the required check) runs
  # always(), fails unless every shard succeeded, proves from the manifests that
  # every suite completed exactly once, and runs the unchanged invariant block
  # against the concatenated shard logs.
  suites-shard:
    name: Suites shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Install client dependencies
        run: npm ci --prefix client
      # Grading is online-only and server-authoritative, so the suites that
      # check an answer or start an exam through the local backend boot the
      # real platform server in-process (client/test/support/online-authority.mjs).
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Deterministic suites, shard ${{ matrix.shard }} of 4
        run: |
          set -o pipefail
          node tools/ci-suite-shard.mjs --of=4 --shard=${{ matrix.shard }} --manifest=suite-shard.json 2>&1 | tee suites.log
      - name: Shard log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suites-shard-${{ matrix.shard }}
          path: |
            suites.log
            suite-shard.json
          if-no-files-found: error

  suites-contracts:
    name: Suites policy and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Runner budget policy
        run: node tools/ci-runner-policy-check.mjs
      - name: Workflow supply-chain policy (least privilege, pinned actions, no privileged PR-head execution)
        run: node tools/ci-workflow-policy-check.mjs
      - name: Native Ink lane keeps one booted simulator, one Swift build and bounded installs
        run: node client/test/simulator-fleet-check.mjs
      - name: Main Integrity retries the merged-PR lookup and still requires every PR workflow green
        run: node tools/main-integrity-lookup-check.mjs
      - name: Android Shell installs the emulator system image intact (one retry on a corrupt download)
        run: node tools/android-system-image-check.mjs
      - name: Native shells enforce the server Content-Security-Policy
        run: node client/test/native-shell-csp-check.mjs
      - name: Install client dependencies
        run: npm ci --prefix client
      # Grading is online-only and server-authoritative, so the suites that
      # check an answer or start an exam through the local backend boot the
      # real platform server in-process (client/test/support/online-authority.mjs).
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Runtime dependency security floor
        run: node tools/runtime-audit-floor.mjs client
      - name: Person 2 India + commercial contracts
        run: |
          set -euo pipefail
          node client/test/india-production-meta-check.mjs
          node client/test/india-class7-current-source-check.mjs
          node client/test/india-class10-current-source-check.mjs
          node client/test/india-class10-production-gap-check.mjs
          node client/test/ncert-class10-full-book-check.mjs
          node client/test/class10-ncert-product-check.mjs
          node client/test/india-practice-availability-check.mjs
          node client/test/entitlement-check.mjs
          node client/test/sync-contract-check.mjs
          # Both of these guard the offline-first backup and cloud-sync paths and
          # were not being run anywhere in CI.
          node client/test/restore-durability-check.mjs
          node client/test/cloud-sync-worker-check.mjs
          # Cloud sync end to end: restore on a fresh device, automatic
          # triggers, and 409 entity-conflict recovery.
          node client/test/cloud-restore-fidelity-check.mjs
          node client/test/auto-sync-scheduler-check.mjs
          node client/test/sync-conflict-recovery-check.mjs
          node client/test/cloud-session-refresh-check.mjs
          node client/test/account-action-boundary-check.mjs
          node client/test/india-exam-blueprint-check.mjs
          node client/test/india-exam-duplicate-check.mjs
          node client/test/india-progress-product-check.mjs
          node tools/india-production-census.mjs
      - name: Real ink diagnostic (advisory in PR CI)
        if: always()
        continue-on-error: true
        run: |
          echo '::warning title=Real ink is advisory here::test:real is a diagnostic in PR CI (|| true). The blocking floor (node client/test/inkcheck-real.mjs --strict --gate, handwriting/v17/real-ink-floor.json) runs only in release-candidate.yml.'
          npm run --silent test:real || true

  suites:
    name: Suites, coverage and accuracy gates
    needs: [suites-shard, suites-contracts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every shard finished green
        env:
          SUITES_SHARD_RESULT: ${{ needs.suites-shard.result }}
          SUITES_CONTRACTS_RESULT: ${{ needs.suites-contracts.result }}
        run: |
          set -euo pipefail
          echo "suites-shard: $SUITES_SHARD_RESULT"
          echo "suites-contracts: $SUITES_CONTRACTS_RESULT"
          test "$SUITES_SHARD_RESULT" = success
          test "$SUITES_CONTRACTS_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download every shard log
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: suites-shard-*
          path: suite-shards
      - name: Every suite of npm test completed exactly once
        run: |
          set -euo pipefail
          test "$(ls -d suite-shards/suites-shard-* | wc -l)" -eq 4
          node tools/ci-suite-shard.mjs --verify --of=4 suite-shards/suites-shard-*/suite-shard.json
          for shard in 1 2 3 4; do cat "suite-shards/suites-shard-$shard/suites.log"; done > suites.log
      - name: Exact coverage invariants
        run: |
          set -euo pipefail
          test -s suites.log
          grep -Fq '2712000/2712000 self-checks passed across 339 subtopics' suites.log
          grep -Fq '21000/21000 multipart part-checks passed' suites.log
          grep -Fq '✔ INDIA SUITE PASSED — 2588/2588 checks' suites.log
          grep -Fq 'INDIA DIFFICULTY TRUTH: PASS — 36944/36944 checks' suites.log
          # Phase 4: Class IX blind packs, JEE complex D4 + escrow lane, advertised levels, CBSE crosswalk.
          grep -Fq 'PASS 7 lazy-loaded CBSE IX source packs, 84 original student exercises, 21 worked lessons, 105 unique identities' suites.log
          grep -Fq 'PASS 27 CBSE IX evidence-mapped suboutcomes: 18 PARTIAL, 9 UNCOVERED' suites.log
          grep -Fq 'PASS JEE 20/20 answer-blind original questions' suites.log
          grep -Fq 'JEE COMPLEX D4: PASS — 205/205 checks — 20 forms rated by the automated rubric (16 D4, 4 D3)' suites.log
          grep -Eq 'JEE ESCROW LANE: PASS — ([0-9]+)/\1 checks — 20 public questions answer-blind, 0 issuable without escrow' suites.log
          grep -Fq 'ADVERTISED LEVELS: PASS — 52/52 advertised' suites.log
          grep -Fq 'CBSE 2026–27 CROSSWALK: PASS — 77 app chapters' suites.log
          # Hardest-level forms, tranche 1: every D3 answer re-derived from its prompt.
          grep -Fq 'INDIA HARDEST FORMS: PASS — 564326/564326 checks — 126 hardest-level forms (D3 CBSE Class VII/VIII/X/XI/XII, D4 JEE Class 11/12) for 126 dot points' suites.log
          grep -Fq 'PROMPT VARIABLE CONSISTENCY: PASS — 162724 prompts, 526 claim prompts, 1713 stated solutions, 0 inconsistent' suites.log
          grep -Fq '56600 questions from 566 declared (generator, difficulty) pairs × 100 draws — 56600 marked correct by their own marker, 56600 well formed' suites.log
          grep -Fq '258/258 dot points have a generator behind them; 0 do not' suites.log
          grep -Fq 'NCERT ANSWER FORMS: PASS — 438/438 checks' suites.log
          grep -Fq 'FALSE-POSITIVE SWEEP: PASS — 0 of 133330 wrong answers marked correct across 17304 questions' suites.log
          grep -Fq 'EQUIVALENCE CLASSES: PASS — 672/672 checks across 9 classes' suites.log
          grep -Fq 'WORKING RUBRICS: PASS — 8737/8737 checks across 13 family levels' suites.log
          # #499: the examiner dossier matches the marking code it hashes (a marking change re-requests review).
          grep -Eq 'EXAMINER DOSSIER: PASS — [0-9]+ rubric banks, digest [0-9a-f]{12}…, status PENDING' suites.log
          grep -Fq 'METHOD MARKS: PASS — 53/53 checks' suites.log
          grep -Fq 'METHOD PROGRESS: PASS — 1002/1002 checks' suites.log
          grep -Fq 'WORKING BRANCHES: PASS — 32/32 checks' suites.log
          # Issue #430: the first wrong AP line is named, method marks before it stay, error is carried forward once,
          # the answer mark is never paid for a wrong answer, and the adversarial corpus earns nothing it did not show.
          # 2140 → 4396 (review round 1): every reviewer page is now a corpus case (formula lines carrying their
          # arithmetic, prose and comma-less givens, listed terms, a last term slipped through continuations, n(…)/2),
          # and each swept seed also checks three prose spellings of its givens, its one-line formula slip and n(…)/2.
          # 4396 → 4795 (review round 2): D4 carries a slipped last term into the sum as D2 does (four D4 pages),
          # and each swept sum seed also checks a last term slipped on its formula line and summed correctly.
          # 4795 → 4885 (review round 2, adversarial): 22 pages where a line Pri may have misread (a part with no
          # value, two statements run together, a word beside the working, a hedged given) is judged nowhere, and a
          # listed line on a gradient plan (y11-diff) is not a derivative mistake.
          grep -Fq 'AP FIRST ERROR + ECF: PASS — 4885/4885 checks' suites.log
          grep -Fq 'WORKING EVIDENCE: PASS — 25/25 checks' suites.log
          grep -Fq 'Pri Reason V1 precision gate: PASS' suites.log
          grep -Fq 'Pri Reason V2 safety gate: PASS' suites.log
          grep -Fq 'Pri Reason V3 regression gate: PASS' suites.log
          grep -Fq 'Pri Reason V4 regression gate: PASS' suites.log
          grep -Fq 'Pri Reason V2 curriculum integration gate: PASS' suites.log
          grep -Fq 'INDIA NATIVE BANKS: PASS — 313/313 checks — 19 chapters rewired onto 20 NCERT-native generators' suites.log
          grep -Fq 'NCERT ANSWER FORMS: PASS — 438/438 checks' suites.log
          grep -Fq 'INDIA EXAM FLOW: PASS — 163/163 checks' suites.log
          grep -Fq 'EXAM SESSION: PASS — 176/176 checks' suites.log
          grep -Fq 'EXAM UNREAD HANDWRITING (DEVICE): PASS — 55/55 checks' suites.log
          grep -Fq 'EXAM ANALYSIS: PASS — 29/29 checks' suites.log
          grep -Fq 'INDIA PYQ: PASS — 1082/1082 checks — 45 source-cited previous-year questions' suites.log
          grep -Fq '✔ INDIA IDENTITY SUITE PASSED — 102/102 checks across 5 groups' suites.log
          # 308 (measured in train 10): one check from #544 hardening (every typed answer marked) and one from misconception targeting (#586).
          grep -Fq 'INDIA ADAPTIVE: PASS — 308/308 checks' suites.log
          grep -Fq 'ADAPTIVE SIMULATION: PASS — 77/77 checks' suites.log
          grep -Fq 'PROGRESS TRUTH: PASS — 147/147 checks' suites.log
          grep -Fq 'PLACEMENT: PASS — 291/291 checks' suites.log
          grep -Fq 'IOS BUNDLE FEATURES: PASS — 20/20 checks' suites.log
          grep -Fq 'INDIA EXAM WEIGHT: PASS — 628/628 checks' suites.log
          grep -Fq 'PLOTTING: PASS — 78/78 checks' suites.log
          grep -Fq 'README TRUTH: PASS — 16/16 checks' suites.log
          grep -Fq 'LEGAL PAGES: PASS — 245/245 checks' suites.log
          grep -Fq 'CLOUD HANDWRITING CLIENT: PASS — 183/183 checks' suites.log
          # A marked handwritten attempt says only what the server established
          # (synthetic evidence: scripted transcripts, the server's marking function).
          grep -Fq 'TRUTHFUL FEEDBACK: PASS — 97/97 checks' suites.log
          grep -Fq 'BROWSER RUN FIXES: PASS — 23/23 checks' suites.log
          grep -Fq 'CLOUD WORKING CLIENT: PASS — 47/47 checks' suites.log
          grep -Fq 'CLOUD PHOTO CLIENT: PASS — 65/65 checks' suites.log
          grep -Fq 'TUTOR UI: PASS — 71/71 checks' suites.log
          grep -Fq 'ERROR REPORTS: PASS — 36/36 checks' suites.log
          grep -Fq 'APPLE SIGN IN: PASS — 66/66 checks' suites.log
          grep -Fq 'ONBOARDING SCOPE: PASS — 40/40 checks' suites.log
          grep -Fq 'STUDY PLAN: PASS — 211/211 checks' suites.log
          grep -Fq 'REMINDERS: PASS — 183/183 checks' suites.log
          grep -Fq 'I18N: PASS — 189/189 checks' suites.log
          grep -Fq 'I18N COVERAGE: PASS — 89/89 checks — 68 files scanned, 0 hard-coded strings' suites.log
          grep -Fq 'MISCONCEPTION TARGETING: PASS — 41/41 checks' suites.log
          # Ledger 3.6/3.7 (#366 re-implemented on #430): lost-mark explanations, tolerance policy.
          grep -Fq 'LOST MARKS: PASS — 170/170 checks' suites.log
          grep -Fq 'TOLERANCE POLICY: PASS — 178/178 checks' suites.log
          # Chapter notes: every curriculum chapter, every worked answer engine-verified.
          grep -Fq 'NOTES CONTENT CHECK PASSED — 77/77 chapters' suites.log
          grep -Fq 'I18N VOICE: PASS — 92/92 checks' suites.log
          grep -Fq 'MISCONCEPTION ONTOLOGY: PASS — 99/99 checks' suites.log
          grep -Fq 'CLOUD HANDWRITING CLIENT: PASS — 183/183 checks' suites.log
          grep -Fq 'CLOUD WORKING CLIENT: PASS — 47/47 checks' suites.log
          grep -Fq 'CLOUD PHOTO CLIENT: PASS — 65/65 checks' suites.log
          grep -Fq 'ACCOUNT DELETION LINK: PASS — 111/111 checks' suites.log
          grep -Fq 'MARK PREDICTOR: PASS — 42/42 checks' suites.log
          grep -Fq 'PDF WORKING: PASS — 25/25 checks' suites.log
          grep -Fq 'MCQ DISTINCTNESS: PASS — 14/14 checks' suites.log
          grep -Fq 'INDIA NATIVE SURFACES: PASS — 33/33 checks' suites.log
          grep -Eq 'INSTALL BUDGET: PASS — 48/48 checks — install [0-9]+ kB raw / [0-9]+ kB gzip under' suites.log
          grep -Fq 'nothing emitted left uncovered.' suites.log
          grep -Fq 'CBSE STEP MARKING: PASS — 37/37 checks' suites.log
          grep -Fq 'ENTITLEMENT ENFORCEMENT: PASS — 66/66 checks' suites.log
          # The device meets the SERVER's daily practice cap (#537): refused
          # through the real dispatcher, no fallback, a prepared question
          # stays unbound and unmarked, a second device is refused at zero.
          grep -Fq 'SERVER DAILY CAP (CLIENT): PASS — 27/27 checks' suites.log
          grep -Fq 'JEE ADVANCED GATE: PASS — 27/27 checks' suites.log
          grep -Fq 'RESTORE FIDELITY: PASS — 45/45 checks' suites.log
          grep -Fq 'STREAK CALENDAR: PASS — 19/19 checks' suites.log
          grep -Fq 'BAD INPUT: PASS — 44/44 checks' suites.log
          grep -Fq 'CLOUD SYNC ACK: PASS — 44/44 checks' suites.log
          grep -Fq 'PASS — §09 submission lifecycle: 27 groups' suites.log
          # A marker stopped at its deadline reaches the device as `tooComplex`, never as an unreadable entry (issue #544 hardening).
          grep -Fq 'MARKER DEADLINE CLIENT: PASS — 14/14 checks' suites.log
          grep -Fq 'PASS — §22 submission sync durability: 13 groups' suites.log
          grep -Fq 'PASS — Grade 9 Ganita Manjari: 1280 seeded forms (1000 numeric handwriting-ready, 280 conceptual).' suites.log
          grep -Fq 'PASS — 8/8 chapters, 200/200 uploaded pages, 42/42 formal exercise sections and 293/293 formal exercise prompts represented and verified.' suites.log
          # §06 content runtime certification: every V1 launch path (CBSE/NCERT
          # 7–12, JEE Main, JEE Advanced) served, validated, versioned and
          # end-to-end through the local backend; the path count may only grow.
          # 172: 23 checks added — a chapter request that lands on a spent cell is answered from another cell of the same terms (issue #540).
          # A served repeat is re-asked on another cell of the same terms; a misconception hunt never leaves its dot point (issue #540).
          grep -Fq 'RETARGET ON REPEAT: PASS — 28 checks' suites.log
          grep -Fq 'CONTENT CERTIFICATION REGRESSIONS: PASS — 173/173 checks' suites.log
          grep -Fq 'CONTENT CERTIFICATION (fast, 4/path/difficulty): PASS — ' suites.log
          grep -Fq '8/8 exam selections' suites.log
          paths=$(grep -Eo 'CONTENT CERTIFICATION [(]fast, 4/path/difficulty[)]: PASS — [0-9]+' suites.log | grep -Eo '[0-9]+$')
          test "${paths:-0}" -ge 793
          if grep -Fq 'not measured:' suites.log; then
            echo 'A deterministic suite reported skipped coverage.' >&2
            exit 1
          fi
      - name: Suite log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suites-log
          path: suites.log
          if-no-files-found: error

  platform:
    name: Production account, sync and commercial schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A throwaway Postgres for the Supabase schema gates (ADR-0001). It lives
    # only for this job, trusts loopback connections and holds no credential;
    # the suites create, migrate and drop their own scratch databases in it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PRI_TEST_PG_ADMIN_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Handwriting stays answer-blind (static, client + server route)
        run: npm run test:ink:blind
      - name: Provider bodies carry no answer; handwriting latency budget (recorded wire, fake provider, no spend)
        run: |
          set -o pipefail
          node server/test/provider-answer-blind-check.mjs 2>&1 | tee blind.log
          node server/test/handwriting-latency-budget-check.mjs 2>&1 | tee -a blind.log
          grep -Fq 'PROVIDER ANSWER-BLIND: PASS — 132/132 checks' blind.log
          grep -Fq 'HANDWRITING LATENCY BUDGET: PASS' blind.log
      - name: Cloud reader evaluation tool self-test (fake provider, no spend)
        run: npm run test:ink:cloud-eval
      - name: SQLite to Postgres export tool
        run: |
          set -o pipefail
          node server/test/sqlite-to-postgres-export-check.mjs 2>&1 | tee pg-export.log
          grep -Fq 'SQLITE TO POSTGRES EXPORT: PASS' pg-export.log
      - name: Server release identity
        run: node server/test/release-identity-check.mjs
      - name: Runtime dependency security floor
        run: node tools/runtime-audit-floor.mjs server
      - name: Platform security floor
        run: |
          node server/test/security-headers-check.mjs
          node server/test/login-lockout-check.mjs
          node server/test/admin-bootstrap-check.mjs
          node server/test/teacher-invite-check.mjs
          node server/test/oidc-verification-check.mjs
          node server/test/verification-enforcement-check.mjs
          node server/test/housekeeping-check.mjs
          node server/test/production-runtime-image-check.mjs
          node server/test/mfa-check.mjs
          node server/test/oidc-consent-check.mjs
          node server/test/security-hardening-check.mjs
          set -o pipefail
          node server/test/rls-fail-closed-check.mjs | tee rls-fail-closed.log
          grep -Fq 'RLS FAIL-CLOSED: PASS — 134/134 checks' rls-fail-closed.log
      - name: Billing lifecycle, database operations and HTTP journeys
        run: |
          node server/test/billing-cancel-refund-check.mjs
          node server/test/billing-webhook-router-check.mjs
          node server/test/platform-db-operations-check.mjs
          node server/test/platform-http-journeys-check.mjs
      - name: Assignment targeting, syllabus snapshot and class analytics
        run: |
          node server/test/india-syllabus-snapshot-check.mjs
          node server/test/assignment-targeting-check.mjs
      - name: Server reading and step checking contracts
        run: |
          set -o pipefail
          node server/test/handwriting-transcription-check.mjs
          node server/test/working-check-check.mjs
          node server/test/area-working-rubric-check.mjs
          node server/test/question-photo-check.mjs
          node server/test/tutor-help-check.mjs
          node server/test/tutor-device-journey-check.mjs
          node server/test/tutor-issued-grounding-check.mjs
          node server/test/tutor-stream-check.mjs
          node server/test/tutor-guard-complexity-check.mjs
          node server/test/spend-ceiling-check.mjs
          # One paid read per unchanged picture: refresh, double click, two tabs,
          # transcript-then-Submit; never shared across accounts.
          node server/test/recognition-dedupe-check.mjs 2>&1 | tee recognition-dedupe.log
          grep -Fq 'RECOGNITION DEDUPE: PASS — 212/212 checks' recognition-dedupe.log
          # Round trips pinned per hot request; ink Submit is one request with one
          # paid read, answer-blind; the request meter is numbers only and
          # Server-Timing is opt-in for signed-in callers (#441 port).
          node server/test/hot-path-budget-check.mjs 2>&1 | tee hot-path-budget.log
          grep -Fq 'HOT PATH BUDGET: PASS — 117/117 checks' hot-path-budget.log
          # A photographed page: the answer proposed is mathematics, never a sentence;
          # unrelated lines are left out by default and never break the working.
          node client/test/photo-pipeline-check.mjs 2>&1 | tee photo-pipeline.log
          grep -Fq 'PHOTO PIPELINE: PASS — 830/830 checks' photo-pipeline.log
          node server/test/photo-working-marking-http-check.mjs 2>&1 | tee -a photo-pipeline.log
          grep -Fq 'PHOTO WORKING MARKING: PASS — 40/40 checks' photo-pipeline.log
          node server/test/guardian-consent-check.mjs
      # Real HTTP against the shipped app, no mocked receipts. Method marks need
      # progress (neutral working earns 0, one genuine step earns partial marks,
      # replays are identical, the persisted attempt carries the same marks), and
      # issuing by seed is deterministic, answer-free and per-account — which is
      # what lets the server adopt a question a device started. Both also run on
      # Postgres below.
      - name: Server-issued practice over HTTP (method progress, seed re-issue, the free daily cap, tutor grounding negatives)
        run: |
          set -o pipefail
          node server/test/method-progress-http-check.mjs 2>&1 | tee practice-http.log
          node server/test/flagship-ap-working-http-check.mjs 2>&1 | tee -a practice-http.log
          node server/test/owner-ap-first-mistake-contract-check.mjs 2>&1 | tee -a practice-http.log
          node server/test/ap-term-firstbreak-regression-check.mjs 2>&1 | tee -a practice-http.log
          node server/test/practice-seed-reissue-check.mjs 2>&1 | tee -a practice-http.log
          node server/test/practice-server-question-check.mjs 2>&1 | tee -a practice-http.log
          node server/test/practice-repeat-credit-check.mjs 2>&1 | tee -a practice-http.log
          node server/test/india-bank-issue-coverage-check.mjs 2>&1 | tee -a practice-http.log
