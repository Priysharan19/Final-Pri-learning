  platform:
    name: Production account, sync and commercial schema
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A throwaway Postgres for the Supabase schema gates (ADR-0001). It lives
    # only for this job, trusts loopback connections and holds no credential;
    # the suites create, migrate and drop their own scratch databases in it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PRI_TEST_PG_ADMIN_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Handwriting stays answer-blind (static, client + server route)
        run: npm run test:ink:blind
      - name: Provider bodies carry no answer; handwriting latency budget (recorded wire, fake provider, no spend)
        run: |
          set -o pipefail
          node server/test/provider-answer-blind-check.mjs 2>&1 | tee blind.log
          node server/test/handwriting-latency-budget-check.mjs 2>&1 | tee -a blind.log
          # 132 → 150 (Train 4, re-derived by running the suite on the merged tree: #774's lead-connective canaries with the other lanes' checks).
          grep -Fq 'PROVIDER ANSWER-BLIND: PASS — 150/150 checks' blind.log
          grep -Fq 'HANDWRITING LATENCY BUDGET: PASS' blind.log
      - name: Cloud reader evaluation tool self-test (fake provider, no spend)
        run: npm run test:ink:cloud-eval
      - name: SQLite to Postgres export tool
        run: |
          set -o pipefail
          node server/test/sqlite-to-postgres-export-check.mjs 2>&1 | tee pg-export.log
          grep -Fq 'SQLITE TO POSTGRES EXPORT: PASS' pg-export.log
      - name: Server release identity
        run: node server/test/release-identity-check.mjs
      - name: Runtime dependency security floor
        run: node tools/runtime-audit-floor.mjs server
      - name: Platform security floor
        run: |
          node server/test/security-headers-check.mjs
          node server/test/login-lockout-check.mjs
          node server/test/admin-bootstrap-check.mjs
          node server/test/teacher-invite-check.mjs
          node server/test/oidc-verification-check.mjs
          node server/test/verification-enforcement-check.mjs
          node server/test/housekeeping-check.mjs
          node server/test/production-runtime-image-check.mjs
          node server/test/mfa-check.mjs
          node server/test/oidc-consent-check.mjs
          node server/test/security-hardening-check.mjs
          set -o pipefail
          node server/test/rls-fail-closed-check.mjs | tee rls-fail-closed.log
          grep -Fq 'RLS FAIL-CLOSED: PASS — 141/141 checks' rls-fail-closed.log
          # A parent who approves by email code is sent the withdrawal credential too.
          node server/test/guardian-code-approval-withdraw-check.mjs | tee guardian-code-approval.log
          grep -Fq 'GUARDIAN CODE APPROVAL WITHDRAWAL: PASS — 14/14 checks' guardian-code-approval.log
          # The staging test mailbox: on only on staging and in the harness, only for
          # @e2e.prilearning.test; every other address is sent; off, the route is a 404.
          node server/test/test-mailbox-check.mjs | tee test-mailbox.log
          grep -Fq 'TEST MAILBOX: PASS — 94/94 checks' test-mailbox.log
          # D18: a child's account no guardian stands behind is soft-deleted after 30
          # days (enforce mode only), erased after a 7-day grace, and a guardian can ask
