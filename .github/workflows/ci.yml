  # The browser suites fan out by flow group and engine (WebKit alone in
  # webkit-layout). Each group runs its commands exactly as the single job
  # did, in the same order, and uploads its log. The job named "Browser suites
  # (end-to-end and accessibility)" (the required check) runs always(), fails
  # unless every group succeeded, and runs the unchanged invariant block
  # against the concatenated group logs. tools/ci-runner-policy-check.mjs
  # proves every command of npm run test:e2e is in exactly one group.
  browser-shard:
    name: Browser shard (${{ matrix.group }})
    runs-on: ubuntu-latest
    # The accessibility gate builds the client itself; give it the same flags
    # client/test/e2e.mjs uses for its build so both walk the same app (the
    # Teacher role and Olympiad live behind EXTENDED_TRACKS, the AU link behind
    # AUSTRALIA). PRI_FEATURE_TUTOR stays unset: the tutor tour proves dark.
    env:
      PRI_FEATURE_PLACEMENT: '1'
      PRI_FEATURE_EXTENDED_TRACKS: '1'
      PRI_FEATURE_AUSTRALIA: '1'
      # Handwriting input in timed exams (off by default in a shipped build): the
      # browser suites drive the gate-ON flow explicitly.
      PRI_FEATURE_EXAM_HANDWRITING: '1'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [e2e-core, e2e-accounts, chromium-layout, webkit-layout, a11y-boot]
        include:
          - group: e2e-core
            browsers: chromium webkit
            prebuild: false
          - group: e2e-accounts
            browsers: chromium webkit
            prebuild: true
          - group: chromium-layout
            browsers: chromium webkit
            prebuild: true
          - group: webkit-layout
            browsers: webkit
            prebuild: true
          - group: a11y-boot
            browsers: chromium webkit
            prebuild: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Install client dependencies
        run: npm ci --prefix client
      # The marking flows, tour-otp-onboarding.js and the accessibility walk
      # drive the real platform server in-process (SQLite file, SMS/email test
      # adapters, synthetic handwriting reader at the provider hop — see
      # client/test/support/online-session.mjs), so this job needs its
      # dependencies. No server environment or secret is required.
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}-${{ matrix.browsers }}
      - name: Install ${{ matrix.browsers }}
        working-directory: client
        run: npx playwright install --with-deps ${{ matrix.browsers }}
      # The single job's later tours ran --no-build against the build
      # tour-ai-tutor.js leaves behind: the job's feature flags, tutor off.
      # A group that starts with --no-build tours makes that same build first.
      - name: Test build (the build tour-ai-tutor.js leaves in client/dist)
        if: matrix.prebuild
        env:
          PRI_FEATURE_TUTOR: '0'
        run: node --input-type=module -e "const { ensureBuild } = await import('./client/test/e2e.mjs'); ensureBuild(true);"
      - name: Browser suites (${{ matrix.group }})
        run: |
          set -o pipefail
          : > browser.log
          case "${{ matrix.group }}" in
            e2e-core)
            # npm run test:e2e, part 1: the canonical suite (it builds the
            # client), then the focused flows that run on the dist it built.
            node client/test/e2e.mjs 2>&1 | tee -a browser.log
            node client/test/notes-illustrated-browser-check.mjs --no-build 2>&1 | tee -a browser.log
            node client/test/notes-wave8-browser-check.mjs --no-build 2>&1 | tee -a browser.log
            node client/test/tour-explain-v2.js --no-build 2>&1 | tee -a browser.log
            node client/test/tour-hindi.js --no-build 2>&1 | tee -a browser.log
              ;;
            e2e-accounts)
            # npm run test:e2e, part 2, in order, ending with tour-ai-tutor.js
            # (which leaves the flag-off build in client/dist), then the platform
            # tours CI repeats against that build.
            node client/test/tour-cloud-platform.js --no-build 2>&1 | tee -a browser.log
            node client/test/tour-social-sign-in.js --no-build 2>&1 | tee -a browser.log
            node client/test/tour-otp-onboarding.js --no-build 2>&1 | tee -a browser.log
            node client/test/tour-activation-gate.js --no-build 2>&1 | tee -a browser.log
            node client/test/tour-account-deletion.js --no-build 2>&1 | tee -a browser.log
            node client/test/tour-admin-cms-platform.js --no-build 2>&1 | tee -a browser.log
            node client/test/tour-admin-independent-review.js --no-build 2>&1 | tee -a browser.log
            node client/test/tour-progress-truth.js --no-build 2>&1 | tee -a browser.log
            node client/test/tour-write-sign-in.js --no-build 2>&1 | tee -a browser.log
            node client/test/tour-online-check.js --no-build 2>&1 | tee -a browser.log
            node client/test/tour-free-cap.js --no-build 2>&1 | tee -a browser.log
            node client/test/tour-ai-tutor.js 2>&1 | tee -a browser.log
            node client/test/tour-cloud-platform.js --no-build 2>&1 | tee -a browser.log
            node client/test/tour-admin-cms-platform.js --no-build 2>&1 | tee -a browser.log
            node client/test/tour-admin-independent-review.js --no-build 2>&1 | tee -a browser.log
              ;;
            chromium-layout)
            # CP-03: the responsive product matrix in both engines (WebKit is the
            # engine behind every Apple web view).
            node client/test/tour-responsive-matrix.js --no-build 2>&1 | tee -a browser.log
            # iPhone portrait (393 × 852): safe areas, the sticky action bar as
            # its own spacer, the full-width mode switch, Write and Photo space,
            # and iPad/desktop composition unchanged. Both engines.
            node client/test/tour-iphone-layout.js --no-build 2>&1 | tee -a browser.log
            # Phase 3: every student screen at phone and tablet, paper and dark —
            # accessible names, keyboard focus, 44px touch targets, 200% text,
            # layout shift, input timing and visual snapshots (compared only
            # against baselines committed for this platform and engine).
            node client/test/tour-interface-quality.js --no-build 2>&1 | tee -a browser.log
            # The owner's photographed page (scripted reader): transcript, unrelated lines,
            # corrected line, proposed answer, durable draft; and the usage-limit state.
            node client/test/tour-photo-answer.js --no-build 2>&1 | tee -a browser.log
            # #449/#550: handwriting never vanishes under the pen — same-size
            # resize callbacks, re-subscribe mid-stroke, cancelled strokes, theme
            # flips and the default-bitmap first mount, with real bitmaps and
            # pointer input. Chromium + WebKit × dpr 1.25/1.5 × mouse/pen, dark.
            # Emulated scale factors, not Windows 11 hardware evidence.
            node client/test/ink-canvas-loss-browser-check.mjs 2>&1 | tee -a browser.log
            # Truthful handwritten feedback (scripted reader, real server marks): a
            # misread page with a typed final answer, working the server did and did
            # not check, and annotations that die with the revision they were about.
            node client/test/tour-truthful-ink.js --no-build 2>&1 | tee -a browser.log
              ;;
            webkit-layout)
            node client/test/tour-responsive-matrix.js --no-build --browser=webkit 2>&1 | tee -a browser.log
            node client/test/tour-iphone-layout.js --no-build --browser=webkit 2>&1 | tee -a browser.log
            # Account first (issue #477): the one sign-in card and the activation
            # gate on every route — adult, minor and guardian, sign-out, deep
            # links, reload, opened offline. Chromium runs it in test:e2e; WebKit
            # here (WebKit cannot reload a page offline under Playwright, so the
            # opened-offline checks are Chromium-only and the run says so).
            node client/test/tour-activation-gate.js --no-build --browser=webkit 2>&1 | tee -a browser.log
            node client/test/tour-interface-quality.js --no-build --browser=webkit 2>&1 | tee -a browser.log
            node client/test/tour-truthful-ink.js --no-build --browser=webkit 2>&1 | tee -a browser.log
              ;;
            a11y-boot)
            npm run test:a11y 2>&1 | tee -a browser.log
            # A failed chunk, a refused cache write or a probe that never settles must
            # end in the app or in a visible notice with Reload, never a silent splash.
            npm run test:boot 2>&1 | tee -a browser.log
              ;;
            *)
              echo "unknown browser group" >&2
              exit 1
              ;;
          esac
      - name: Shard log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-shard-${{ matrix.group }}
          path: browser.log
          if-no-files-found: error

  browser:
    name: Browser suites (end-to-end and accessibility)
    needs: [browser-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every shard finished green
        env:
          BROWSER_SHARD_RESULT: ${{ needs.browser-shard.result }}
        run: |
          set -euo pipefail
          echo "browser-shard: $BROWSER_SHARD_RESULT"
          test "$BROWSER_SHARD_RESULT" = success
      - name: Download every shard log
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: browser-shard-*
          path: browser-shards
      - name: Combine the shard logs
        run: |
          set -euo pipefail
          for group in e2e-core e2e-accounts chromium-layout webkit-layout a11y-boot; do
            test -s "browser-shards/browser-shard-$group/browser.log"
            cat "browser-shards/browser-shard-$group/browser.log"
          done > browser.log
          test "$(ls -d browser-shards/browser-shard-* | wc -l)" -eq 5
      - name: Browser coverage invariants
        if: always()
        run: |
          set -euo pipefail
          test -s browser.log
          grep -Eq 'E2E SUITE.*431/431.*13 flows' browser.log
          grep -Fq 'Submission · interruption recovery and one attempt' browser.log
          grep -Fq 'Cloud · late results never rewrite an attempt' browser.log
          grep -Fq 'India exam · JEE Main handwritten, reloaded, analysed' browser.log
          grep -Fq 'India exam · the clock runs out and the paper submits itself' browser.log
          grep -Fq 'Placement · onboarding → diagnostic → evidence map' browser.log
          grep -Fq 'Phone · every destination reachable at 390px' browser.log
          grep -Fq 'iPhone portrait · safe areas, sticky bar, mode switch, write and photo space' browser.log
          # The iPhone layout tour in both engines (65: the welcome wordmark at or
          # below the status-bar inset on 17 Pro Max, 16 Pro Max and SE sizes),
          # and the gate journey in WebKit (62).
          test "$(grep -Ec 'E2E SUITE PASSED.*65/65.*1 flows' browser.log)" -ge 2
          test "$(grep -Ec 'E2E SUITE PASSED.*62/62.*1 flows' browser.log)" -ge 1
          grep -Fq 'India · onboarding, class labels, demo, cloud entry' browser.log
          grep -Fq 'Cloud · account, live Settings refresh, assignment hand-off' browser.log
          test "$(grep -Ec 'E2E SUITE PASSED.*21/21.*1 flows' browser.log)" -ge 2
          grep -Fq 'Cloud admin · CMS lifecycle and role management' browser.log
          grep -Eq 'E2E SUITE.*25/25.*1 flows' browser.log
          grep -Fq 'Cloud admin · independent-review rejection' browser.log
          grep -Eq 'E2E SUITE.*13/13.*1 flows' browser.log
          grep -Fq 'AI tutor · dark by default in a production build' browser.log
          grep -Fq 'AI tutor · three levels, in order, with fallback' browser.log
          grep -Eq 'E2E SUITE.*33/33.*2 flows' browser.log
          grep -Fq 'Hindi · Practice, handwriting, Exams, exam room, Progress, Explain' browser.log
          grep -Eq 'E2E SUITE.*65/65.*1 flows' browser.log
          grep -Fq 'Progress truth · rendered numbers = attempt ledger' browser.log
          grep -Eq 'E2E SUITE.*24/24.*1 flows' browser.log
          # Account deletion for a code-only account: in the app, and from the
          # public page (Apple 5.1.1(v), Play "Delete account"). Two flows. The
          # in-app flow also proves the persisted account link is gone after the
          # deletion and after a reload (#500).
          grep -Fq 'Account · deletion from the public page, no sign-in, by email code' browser.log
          grep -Fq 'Account · a code-only account deletes itself in Settings with a fresh code' browser.log
          grep -Eq 'E2E SUITE.*36/36.*2 flows' browser.log
          # Account first (issue #477): a child signs up on the one card and a
          # parent approves on their own page; the gate journey in both engines.
          grep -Fq 'Account · email code sign-up, a parent approves by SMS on their own page, first question' browser.log
          grep -Eq 'E2E SUITE.*35/35.*1 flows' browser.log
          grep -Fq 'Account first · one card, the gate on every route, guardian approval, sign-out, deep links, reload, offline' browser.log
          grep -Fq 'E2E SUITE PASSED — 72/72 checks across 1 flows' browser.log
          test "$(grep -Fc 'Account first · one card, the gate on every route' browser.log)" -ge 2
          grep -Fq 'Cloud · Continue with Google signs in, and Google confirms deletion' browser.log
          # Online-only, server-authoritative grading (owner decision
          # 2026-10-10) behind the activation gate (issue #477): nobody is
          # inside the app signed out, so these journeys assert what happens
          # when the SESSION ENDS mid-work or at a start, offline inside the
          # app, and a prepared question taken up elsewhere. tour-activation-
          # gate.js proves the gate itself.
          grep -Fq 'Write · one true save state: ink survives reload, mode switch, resize, offline; a failed write says so and retries' browser.log
          grep -Fq 'Write · session ended before reading: "sign in again" beside the work, then read, corrected and marked over two tries; a real outage still says so, with a retry' browser.log
          grep -Fq 'Photo · session ended before reading: "sign in again" beside the photo, then the same photo is read and marked' browser.log
          grep -Fq 'Submit · session ended at Submit: work held, "sign in again", never a wrong-answer verdict; then marked exactly once' browser.log
          grep -Fq 'Type · typed answer and working survive a reload, then the same question is server-marked' browser.log
          grep -Eq 'E2E SUITE.*59/59.*5 flows' browser.log
          grep -Fq 'Type · offline: reconnect asked, work kept, Retry marked exactly once' browser.log
          grep -Fq 'Write · offline: reconnect asked, ink kept, Retry marked exactly once' browser.log
          grep -Fq 'Draft · offline inside the app: never marked, work kept; a new question online is server-issued' browser.log
          grep -Fq 'Prepared · taken up by another account: not marked here, work kept, next one is' browser.log
          grep -Fq 'Sync · a pull overlapping a submit never doubles an attempt' browser.log
          grep -Fq 'Rapid Fire and Match · signed in, every answer is server-marked' browser.log
          grep -Fq 'Session ended at a start: a paper, Rapid Fire and Match start nothing; signing in again in place starts them' browser.log
          grep -Fq "Exam · finished offline: submitted, no score; reconnected: the server's result" browser.log
          grep -Eq 'E2E SUITE.*72/72.*8 flows' browser.log
          # The free plan's daily cap is the server's (#537): with nineteen of
          # the day's questions used on another device, Next shows the cap
          # screen from the server's 402 and fetches nothing instead; a capped
          # account cannot have a signed-out question bound and marked.
          grep -Fq 'Free cap · nineteen used on another device: the twentieth is issued, Next shows the cap screen from the server, nothing fetched instead' browser.log
          grep -Fq 'Free cap · a prepared question on a signed-in account that reaches its cap elsewhere: Submit refused as the free cap, nothing marked, work kept' browser.log
          grep -Eq 'E2E SUITE.*24/24.*2 flows' browser.log
          grep -Fq 'Pri Explain V8 · adaptive board-style reasoning playback' browser.log
          grep -Eq 'E2E SUITE.*18/18.*1 flows' browser.log
          # The handwriting reader behind the real server is a scripted
          # stand-in in these suites; the log must say so.
          grep -Fq 'SYNTHETIC-READER EVIDENCE' browser.log
          # The accessibility walk must have reached the refused-check states.
          grep -Eq 'online-only checking +8/8' browser.log
          grep -Eq 'ACCESSIBILITY SUITE.*47/47.*13 groups' browser.log
          grep -Eq 'ACCESSIBILITY SUITE.*50/50.*14 groups' browser.log
          grep -Fq 'BOOT RESILIENCE: PASS — 61/61 checks' browser.log
          grep -Fq 'Reader · usage limit reached' browser.log
          grep -Eq 'E2E SUITE.*41/41.*2 flows' browser.log
          # Ink canvas loss (#449/#550): both engines, 200 checks, none failed.
          grep -Fq 'INK CANVAS LOSS (emulated Windows scale factors, dark theme, mouse + pen; not Windows 11 hardware evidence): 200 passed, 0 failed' browser.log
          grep -Fq 'Ink · a marked attempt says only what the server established' browser.log
          test "$(grep -Ec 'E2E SUITE PASSED — 49/49 checks across 1 flows' browser.log)" -eq 2
          grep -Fq 'E2E BROWSER: webkit' browser.log
          # Both engines ran the interface-quality tour (pipefail fails the shard on a red check).
          test "$(grep -Fc 'Interface quality · keyboard, names, 44px, text zoom, layout shift, input, snapshots' browser.log)" -ge 2
          test "$(grep -c 'Responsive matrix · 6 viewports, critical routes, write/type, actions' browser.log)" -ge 2
          # Preserve evidence that the interface tour ran in both engines.
          # Their measured coverage counts differ, so verify each separately.
          grep -Fq 'E2E SUITE PASSED — 200/200 checks across 1 flows' browser.log
          grep -Fq 'E2E SUITE PASSED — 129/129 checks across 1 flows' browser.log
          if grep -Fq 'not measured:' browser.log; then
            echo 'A browser suite reported skipped coverage.' >&2
            exit 1
          fi
      - name: Browser log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-log
          path: browser.log
          if-no-files-found: error

  build:
    name: Client build and offline-first boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Release authority contract
        run: node tools/pri01-release-authority-check.mjs
      - name: Build
        run: npm run build
      - name: Exact release identity
        run: node tools/verify-release-identity.mjs
      - name: iOS bundle matches the client build
        run: npm run check:ios
      - name: Materialize exact native release identity
        run: npm run sync:ios
      - name: Verify exact native release identity
        run: npm run verify:release:native
      # After the build and the iOS bundle sync, so the scan reads the bytes
      # that ship: every tracked file (iOS bundles included) and client/dist.
      - name: Secret scan (tracked files, iOS bundles, built client)
        run: |
          node tools/secret-scan.test.mjs
          node tools/secret-scan.mjs
      - name: Cross-platform release matrix (CP-11)
        run: node scripts/release-matrix.mjs --require-native-apple
      - name: Built client loads no remote presentation assets
        run: |
          set -euo pipefail
          test -d client/dist
          count="$(find client/dist \( -name '*.html' -o -name '*.css' \) -type f | wc -l | tr -d ' ')"
          test "$count" -gt 0
          if grep -rnoIE --include='*.html' --include='*.css' '(src|href)="https?://|@import[^;]*https?://|url\(https?://' client/dist; then
            echo 'Built client contains a remote presentation load.' >&2
            exit 1
          fi
          echo "read $count built HTML/CSS files: none loads remote presentation assets"
      - name: Client network calls stay behind audited transport
        run: node tools/check-client-network-boundary.mjs
      # The bytes, not just the names. Rolldown emits a ~60-byte re-export stub
      # beside each named chunk (strings.hi-*.js, ncertTerms-*.js) and those do
      # land in the precache; what must not is the data behind them. So this
      # asserts both: the big chunks are absent from the install, and nothing
      # precached that names these modules is large enough to BE them.
      - name: Hindi and the NCERT glossary stay out of the install precache
        run: |
          set -euo pipefail
          for name in i18n-hi i18n-terms; do
            chunk="$(find client/dist/assets -name "$name-*.js" -type f | head -1)"
            test -n "$chunk"
            echo "$name built as $(basename "$chunk") ($(wc -c < "$chunk" | tr -d ' ') bytes)"
            if grep -Fq "$(basename "$chunk")" client/dist/sw.js; then
              echo "$name is in the service worker install precache — every reader would download it." >&2
              exit 1
            fi
            echo "  absent from the generated service worker's install list"
          done
          for stub in $(grep -oE '(strings\.hi|ncertTerms)-[A-Za-z0-9_-]+\.js' client/dist/sw.js | sort -u); do
            bytes="$(wc -c < "client/dist/assets/$stub" | tr -d ' ')"
            echo "precached $stub is $bytes bytes"
            if [ "$bytes" -gt 1024 ]; then
              echo "$stub is precached and is not a re-export stub — the catalogue itself is in the install." >&2
              exit 1
            fi
          done

  engine-benchmark:
    # Ledger 3.8: the deterministic marker's confusion table, regenerated on
    # every merge to main and kept as a run artifact. Synthetic evidence only
    # (the report's header says so); --strict fails on any accepted wrong
    # answer. The release gates for marking live in the suites job above.
    name: Engine benchmark report (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Regenerate the confusion table
        run: |
          set -o pipefail
          npm run engine:benchmark -- --strict 2>&1 | tee engine-benchmark.log
          test -s docs/evidence/engine-benchmark.md
          grep -Fq 'Synthetic self-consistency evidence. Not an accuracy claim.' docs/evidence/engine-benchmark.md
      - name: Engine benchmark report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-benchmark
          path: |
            docs/evidence/engine-benchmark.md
            engine-benchmark.log
          retention-days: 90
