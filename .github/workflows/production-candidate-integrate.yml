              ("      - 'server/test/account-**'\n", "      - 'server/test/auth-delivery-**'\n")
          ]
          for needle, addition in insertions:
              assert needle in s
              for line in addition.splitlines(True):
                  if line.strip() and line not in s:
                      s = s.replace(needle, needle + line)
          needle = '      - name: Cloud session live refresh\n        run: node client/test/cloud-session-refresh-check.mjs\n'
