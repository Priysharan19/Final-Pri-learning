            git checkout --ours .github/workflows/person2-india-platform.yml
            python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/person2-india-platform.yml')
          s = p.read_text()
          insertions = [
              ("      - 'client/src/pages/PracticeBase.jsx'\n", "      - 'client/src/pages/AccountAction.jsx'\n      - 'client/src/main.jsx'\n"),
