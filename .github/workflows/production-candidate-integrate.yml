name: Production Candidate Integration

on:
  push:
    branches:
      - release/production-candidate-2026-09-03

permissions:
  contents: write

concurrency:
  group: production-candidate-integration
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/production-candidate-2026-09-03
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Integrate and validate production product code
        run: |
          set -euo pipefail
          if [ -f scripts/production-candidate-integrate.sh ]; then
            bash scripts/production-candidate-integrate.sh
          else
            echo "Production candidate product integration is already committed."
          fi
