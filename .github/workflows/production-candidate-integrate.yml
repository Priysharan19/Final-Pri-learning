name: Production Candidate Integration

on:
  push:
    branches:
      - release/production-candidate-2026-09-03

permissions:
  contents: write

concurrency:
  group: production-candidate-integration
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/production-candidate-2026-09-03
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Integrate Class 10 while preserving stricter source truth
        run: |
          set -euo pipefail
          git config user.name "Pri Learning Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin india/class10-ncert-full-integration feature/auth-email-delivery-links

          if git merge --no-edit origin/india/class10-ncert-full-integration; then
            echo "Class 10 merged without conflicts."
          else
            expected=".github/workflows/ci.yml
          client/src/engine/ncert/class10-2026-27-production.js
          client/src/pages/Classes.jsx
          client/test/india-class10-current-source-check.mjs
          client/test/india-practice-availability-check.mjs"
            actual="$(git diff --name-only --diff-filter=U | sort)"
            if [ "$actual" != "$(printf '%s\n' "$expected" | sed 's/^          //' | sort)" ]; then
              echo "::error::Unexpected Class 10 conflicts"
              printf '%s\n' "$actual"
              exit 1
            fi

            # CI already contains the cloud-session/tour additions carried by the
            # older Class 10 branch. Keep the newer release CI verbatim.
            git checkout --ours .github/workflows/ci.yml

            # Preserve the newer cloud-assignment Classes surface, then add the
            # bundled Class X NCERT library beside it rather than replacing it.
            git checkout --ours client/src/pages/Classes.jsx
            python - <<'PY'
          from pathlib import Path
          p = Path('client/src/pages/Classes.jsx')
          s = p.read_text()
          needle = "import AssignmentInboxPanel from '../components/AssignmentInboxPanel.jsx';\n"
          assert needle in s
          if "Class10NCERTLibrary" not in s:
              s = s.replace(needle, needle + "import Class10NCERTLibrary from '../components/Class10NCERTLibrary.jsx';\n")
          needle = "      <AssignmentInboxPanel />\n"
          assert needle in s
          if "<Class10NCERTLibrary />" not in s:
              s = s.replace(needle, needle + "\n      {Number(user.year) === 10 && <Class10NCERTLibrary />}\n")
          p.write_text(s)
          PY

            cat > client/src/engine/ncert/class10-2026-27-production.js <<'EOF'
