name: Validate PR66 V5 exact product tree ARM

on:
  push:
    branches:
      - validate-pr66-v5

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Pri Explain correctness boundary
        run: npm run test:explain

      - name: Full deterministic suite chain
        run: npm test

      - name: Build client
        run: npm run build

      - name: Verify tracked iPad bundles match build
        run: npm run check:ios

      - name: Install Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Pri Learning end-to-end suite
        run: npm run test:e2e

      - name: Accessibility suite
        run: npm run test:a11y
