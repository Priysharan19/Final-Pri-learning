name: KALP-04 home-command-centre gate

on:
  pull_request:
    paths:
      - 'client/src/pages/Home.jsx'
      - 'client/src/home/**'
      - 'client/src/local/backend.js'
      - 'client/src/theme.css'
      - 'client/src/i18n/**'
      - 'client/test/kalp04-home-check.mjs'
      - 'client/test/first-run-daily-use-check.mjs'
      - 'client/test/tour-first-run-scope.js'
      - 'client/src/pages/PracticeBase.jsx'
      - 'client/src/engine/indiaProduct.js'
      - 'client/test/tour-kalp04-home.js'
      - 'client/test/e2e.mjs'
      - 'client/test/a11y-check.mjs'
      - 'client/test/tour-kalp01-design.js'
      - 'client/test/tour-kalp02-navigation.js'
      - 'client/test/tour-kalp03-onboarding.js'
      - 'client/test/golden-student-journey.mjs'
      - 'docs/design/KALP-04-home-command-centre.md'
      - '.github/workflows/kalp-04-home-command-centre.yml'
  workflow_dispatch:

permissions:
  contents: read

# These browser gates also drive the Australian-syllabus flows, which a V1
# build hides behind PRI_FEATURE_AUSTRALIA. The shipped iPad bundles stay
# flag-off (client/test/ios-bundle-features-check.mjs).
env:
  PRI_FEATURE_AUSTRALIA: '1'

jobs:
  verify:
    name: Real next-action hierarchy and regressions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: KALP-04 recommendation source and scenario gate
        run: node client/test/kalp04-home-check.mjs

      - name: First run to daily use regression
        run: node client/test/first-run-daily-use-check.mjs

      - name: KALP-01 visual-system source regression
        run: node client/test/design-system-check.mjs

      - name: KALP-02 navigation source regression
        run: node client/test/kalp02-navigation-check.mjs

      - name: KALP-03 onboarding source regression
        run: node client/test/kalp03-onboarding-check.mjs

      - name: Hindi and catalogue integrity
        run: npm run test:i18n

      - name: Build exact client
        run: npm run build --prefix client

      - name: Install Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      # Accessibility rebuilds source; run before screenshot tours leave
      # artifacts in the workspace so release-identity checks stay meaningful.
      - name: Accessibility regression
        run: npm run test:a11y

      - name: KALP-04 real Home journey
        run: node client/test/tour-kalp04-home.js --no-build

      - name: Canonical browser regression
        run: node client/test/e2e.mjs --no-build

      - name: KALP-01 tablet visual regression
        run: node client/test/tour-kalp01-design.js --no-build

      - name: KALP-02 role-navigation regression
        run: node client/test/tour-kalp02-navigation.js --no-build

      - name: KALP-03 onboarding regression
        run: node client/test/tour-kalp03-onboarding.js --no-build

      - name: First run scope journey
        run: node client/test/tour-first-run-scope.js --no-build

      - name: PRI-02 golden student journey
        run: node client/test/golden-student-journey.mjs --no-build

      - name: Upload KALP-04 responsive evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kalp-04-home-evidence
          path: artifacts/kalp-04/
          if-no-files-found: warn
          retention-days: 14
