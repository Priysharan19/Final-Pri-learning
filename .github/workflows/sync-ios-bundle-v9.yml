# Temporary Native Ink V9 branch helper.
# Builds the web client and commits the exact generated bundle into the canonical
# Swift package. This file is removed once the one-time sync commit lands.
name: Sync iOS Web Bundle V9

on:
  push:
    branches:
      - agent/native-ink-v9
    paths:
      - 'client/src/**'
      - 'client/package.json'
      - 'client/package-lock.json'
      - 'vite.config.*'
      - '.github/workflows/sync-ios-bundle-v9.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-ink-v9

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci --prefix client
      - run: npm run build
      - run: npm run sync:ios

      - name: Commit exact generated bundle
        run: |
          set -euo pipefail
          git add ios/PriLearning.swiftpm/Resources/Web
          if git diff --cached --quiet; then
            echo 'Bundle already matches client/dist.'
            exit 0
          fi
          git config user.name 'PRI Native Ink CI'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Sync native iOS web bundle'
          git push origin HEAD:agent/native-ink-v9
