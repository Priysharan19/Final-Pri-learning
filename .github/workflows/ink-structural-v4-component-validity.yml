name: Ink Structural V4 Component Validity

on:
  push:
    paths:
      - 'tools/ink-foundation/structural_component_validity.py'
      - 'tools/ink-foundation/train_component_validity.py'
      - 'tools/ink-foundation/test_structural_component_validity.py'
      - 'tools/ink-foundation/compare_component_validity.py'
      - 'tools/ink-foundation/evaluate_structural.py'
      - 'tools/ink-foundation/evaluate_structural_dev.py'
      - 'tools/ink-foundation/compare_structural_decoders.py'
      - 'tools/ink-foundation/structural.py'
      - 'tools/ink-foundation/structural_joint_decode.py'
      - 'tools/ink-foundation/structural_joint_general.py'
      - 'tools/ink-foundation/structural_decoder_registry.py'
      - 'tools/ink-foundation/generate_structural_synthetic.mjs'
      - '.github/workflows/ink-structural-v4-component-validity.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'tools/ink-foundation/structural_component_validity.py'
      - 'tools/ink-foundation/train_component_validity.py'
      - 'tools/ink-foundation/test_structural_component_validity.py'
      - 'tools/ink-foundation/compare_component_validity.py'
      - 'tools/ink-foundation/evaluate_structural.py'
      - 'tools/ink-foundation/evaluate_structural_dev.py'
      - 'tools/ink-foundation/compare_structural_decoders.py'
      - 'tools/ink-foundation/structural.py'
      - 'tools/ink-foundation/structural_joint_decode.py'
      - 'tools/ink-foundation/structural_joint_general.py'
      - 'tools/ink-foundation/structural_decoder_registry.py'
      - 'tools/ink-foundation/generate_structural_synthetic.mjs'
      - '.github/workflows/ink-structural-v4-component-validity.yml'
      - 'package.json'

concurrency:
  group: ink-structural-v4-component-validity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component-validity-contract:
    name: Contextual hard-negative component rejection
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/ink-foundation/requirements.txt

      - name: Python syntax
        run: |
          python -m py_compile \
            tools/ink-foundation/structural_component_validity.py \
            tools/ink-foundation/train_component_validity.py \
            tools/ink-foundation/test_structural_component_validity.py \
            tools/ink-foundation/compare_component_validity.py \
            tools/ink-foundation/evaluate_structural.py \
            tools/ink-foundation/evaluate_structural_dev.py

      - name: Install pinned V4 dependencies
        run: python -m pip install -r tools/ink-foundation/requirements.txt

      - name: Deterministic component-validity contracts
        run: python tools/ink-foundation/test_structural_component_validity.py

      - name: Generate writer-disjoint synthetic structural corpus
        run: |
          node tools/ink-foundation/generate_structural_synthetic.mjs \
            /tmp/pri-ink-v4-validity-synth 3 2 4
          python tools/ink-foundation/audit_structural.py \
            /tmp/pri-ink-v4-validity-synth --require-all

      - name: Train frozen base V4 smoke checkpoint
        run: |
          python tools/ink-foundation/train_structural.py \
            --corpus /tmp/pri-ink-v4-validity-synth \
            --out /tmp/pri-ink-v4-validity-base.pt \
            --epochs 1 \
            --batch 4 \
            --device cpu \
            --d-model 64 \
            --point-layers 1 \
            --stroke-layers 1 \
            --max-strokes 64 \
            --max-points-per-stroke 96 \
            --patience 1

      - name: Train synthetic component-validity V2 calibrator
        run: |
          python tools/ink-foundation/train_component_validity.py \
            /tmp/pri-ink-v4-validity-base.pt \
            --corpus /tmp/pri-ink-v4-validity-synth \
            --out /tmp/pri-ink-v4-component-validity.pt \
            --mode writer-disjoint \
            --epochs 4 \
            --batch 4 \
            --device cpu \
            --max-group-size 4 \
            --max-negatives 24 \
            --patience 4

      - name: Validity checkpoint is hash-bound and research-only
        run: |
          python - <<'PY'
          import hashlib, torch
          from pathlib import Path
          base = Path('/tmp/pri-ink-v4-validity-base.pt')
          digest = hashlib.sha256(base.read_bytes()).hexdigest()
          ckpt = torch.load('/tmp/pri-ink-v4-component-validity.pt', map_location='cpu', weights_only=False)
          assert ckpt['architecture_version'] == 4
          assert ckpt['component_validity_version'] == 2
          assert ckpt['production_ready'] is False
          assert ckpt['objective'] == 'contextual-hard-negative-ranking-validity-v2'
          assert ckpt['base_checkpoint_sha256'] == digest
          assert ckpt['training']['syntheticOnly'] is True
          assert ckpt['validation']['positiveComponents'] > 0
          assert ckpt['validation']['hardNegativeComponents'] > 0
          print('V4 component-validity V2 checkpoint provenance: PASS')
          PY

      - name: A/B exact same joint decoder with and without validity
        run: |
          python tools/ink-foundation/evaluate_structural.py \
            /tmp/pri-ink-v4-validity-base.pt \
            --corpus /tmp/pri-ink-v4-validity-synth \
            --split validation \
            --device cpu \
            --decoder joint \
            --out /tmp/pri-ink-v4-joint-no-validity.json
          python tools/ink-foundation/evaluate_structural.py \
            /tmp/pri-ink-v4-validity-base.pt \
            --corpus /tmp/pri-ink-v4-validity-synth \
            --split validation \
            --device cpu \
            --decoder joint \
            --component-validity /tmp/pri-ink-v4-component-validity.pt \
            --component-validity-weight 1.0 \
            --out /tmp/pri-ink-v4-joint-with-validity.json
          python tools/ink-foundation/compare_component_validity.py \
            /tmp/pri-ink-v4-joint-no-validity.json \
            /tmp/pri-ink-v4-joint-with-validity.json \
            --out /tmp/pri-ink-v4-validity-ab.json

      - name: A/B comparison preserves identical evidence and search regime
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path('/tmp/pri-ink-v4-joint-no-validity.json').read_text())
          after = json.loads(Path('/tmp/pri-ink-v4-joint-with-validity.json').read_text())
          ab = json.loads(Path('/tmp/pri-ink-v4-validity-ab.json').read_text())
          assert before['checkpointSha256'] == after['checkpointSha256']
          assert before['decoder'] == after['decoder'] == 'joint'
          assert before['samples'] == after['samples'] == 8
          assert before['writers'] == after['writers'] == 2
          assert before['componentValidity'] is None
          assert after['componentValidity']['componentValidityVersion'] == 2
          assert after['componentValidity']['baseCheckpointSha256'] == before['checkpointSha256']
          assert before['jointPartition']['actualSearchRegimes'] == after['jointPartition']['actualSearchRegimes']
          assert ab['comparison'] == 'joint-without-vs-with-component-validity'
          assert ab['productionReady'] is False
          print('Same-base component-validity V2 A/B evidence contract: PASS')
          PY

      - name: Mismatched validity checkpoint must be rejected
        run: |
          python - <<'PY'
          import torch
          ckpt = torch.load('/tmp/pri-ink-v4-component-validity.pt', map_location='cpu', weights_only=False)
          ckpt['base_checkpoint_sha256'] = 'deliberately-wrong-base-hash'
          torch.save(ckpt, '/tmp/pri-ink-v4-component-validity-bad.pt')
          PY
          if python tools/ink-foundation/evaluate_structural.py \
              /tmp/pri-ink-v4-validity-base.pt \
              --corpus /tmp/pri-ink-v4-validity-synth \
              --split validation \
              --device cpu \
              --decoder joint \
              --component-validity /tmp/pri-ink-v4-component-validity-bad.pt; then
            echo 'evaluator accepted component validity trained for a different base checkpoint' >&2
            exit 1
          fi
          echo 'Component-validity base-hash rejection: PASS'

      - name: Build one-writer dev base for transfer smoke
        run: |
          node tools/ink-foundation/generate_structural_synthetic.mjs \
            /tmp/pri-ink-v4-validity-dev 1 0 12
          python tools/ink-foundation/train_structural_dev.py \
            --corpus /tmp/pri-ink-v4-validity-dev \
            --init /tmp/pri-ink-v4-validity-base.pt \
            --replay-corpus /tmp/pri-ink-v4-validity-synth \
            --replay-weight 0.20 \
            --out /tmp/pri-ink-v4-validity-dev-base.pt \
            --epochs 1 \
            --batch 4 \
            --device cpu \
            --d-model 64 \
            --point-layers 1 \
            --stroke-layers 1 \
            --max-strokes 64 \
            --max-points-per-stroke 96 \
            --patience 1

      - name: Transfer synthetic validity head then fine-tune on frozen dev train split
        run: |
          python tools/ink-foundation/train_component_validity.py \
            /tmp/pri-ink-v4-validity-dev-base.pt \
            --corpus /tmp/pri-ink-v4-validity-dev \
            --out /tmp/pri-ink-v4-component-validity-dev.pt \
            --mode same-writer-dev \
            --init-validity /tmp/pri-ink-v4-component-validity.pt \
            --allow-base-transfer \
            --epochs 2 \
            --batch 4 \
            --device cpu \
            --max-group-size 4 \
            --max-negatives 24 \
            --patience 2

      - name: Frozen dev evaluator accepts only matching fine-tuned validity head
        run: |
          python tools/ink-foundation/evaluate_structural_dev.py \
            /tmp/pri-ink-v4-validity-dev-base.pt \
            --corpus /tmp/pri-ink-v4-validity-dev \
            --device cpu \
            --decoder joint \
            --component-validity /tmp/pri-ink-v4-component-validity-dev.pt \
            --out /tmp/pri-ink-v4-validity-dev-eval.json
          python - <<'PY'
          import json, torch
          from pathlib import Path
          validity = torch.load('/tmp/pri-ink-v4-component-validity-dev.pt', map_location='cpu', weights_only=False)
          report = json.loads(Path('/tmp/pri-ink-v4-validity-dev-eval.json').read_text())
          assert validity['stage'] == 'component-validity-research-dev'
          assert validity['production_ready'] is False
          assert validity['initialisation']['baseTransfer'] is True
          assert report['productionReady'] is False
          assert report['componentValidity']['componentValidityVersion'] == 2
          assert report['componentValidity']['stage'] == 'component-validity-research-dev'
          assert report['validationProtocol'] == report['componentValidity']['validationProtocol']
          assert 'not writer-disjoint' in report['evidence']
          print('Synthetic pretrain -> frozen dev validity V2 fine-tune protocol: PASS')
          PY
