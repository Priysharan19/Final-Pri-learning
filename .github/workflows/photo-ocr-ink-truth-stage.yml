name: Photo OCR + handwriting consensus stage

on:
  push:
    branches: [product/india-native-ink-truth]

permissions:
  contents: write

jobs:
  patch-test-native:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/india-native-ink-truth
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Validate patch script
        run: python3 -m py_compile tools/apply-photo-ocr-ink-truth.py
      - name: Apply photo OCR and handwriting consensus patch
        run: python3 tools/apply-photo-ocr-ink-truth.py
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Photo bridge and handwriting regressions
        run: |
          npm run test:photo:bridge
          npm run test:ink:bridge
          npm run test:ink:hybrid
          npm run test:context
      - name: India + product API regressions
        run: |
          npm run test:india
          npm run test:gateway
          npm run test:backend
      - name: Production web build
        run: npm run build
      - name: Sync both native iPad bundles
        run: |
          npm run sync:ios
          npm run check:ios
          node scripts/check-native-package-sync.mjs
      - name: Canonical native PencilKit handwriting gate
        run: npm run test:ink:native
      - name: Final product diff audit
        run: |
          git diff --check
          grep -q "priPhoto" ios/PriLearning.swiftpm/WebShell.swift
          grep -q "VNRecognizeTextRequest" ios/PriLearning.swiftpm/PhotoOCR.swift
          grep -q "Decoded on-device" client/src/components/QuestionCard.jsx
          grep -q "chooseNativeConsensus" client/src/ink/InkAnswer.jsx
          grep -q "Native recognition path" client/src/ink/InkAnswer.jsx
      - name: Commit validated product repair
        run: |
          rm -f tools/apply-photo-ocr-ink-truth.py
          rm -f .github/workflows/photo-ocr-ink-truth-stage.yml
          git add -A
          git config user.name pri-learning-ci
          git config user.email actions@users.noreply.github.com
          git commit -m "Decode photo handwriting and arbitrate native ink engines"
          git push origin HEAD:product/india-native-ink-truth
