name: Real Apple Pencil page stability V3 stage

on:
  push:
    branches:
      - product/india-native-ink-truth

permissions:
  contents: write

concurrency:
  group: ink-real-page-v3-stage
  cancel-in-progress: true

jobs:
  patch-test-native:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/india-native-ink-truth
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Repair staged installer
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tools/fix-ink-real-page-v3-installer.py
      - name: Apply real-page repair
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tools/apply-ink-real-page-v3.py
      - name: Install dependencies
        run: |
          npm ci --prefix client
          npm ci --prefix server
      - name: Real-page and handwriting regressions
        run: |
          npm run test:ink:stability
          npm run test:ink:arbitration
          npm run test:ink:bridge
          npm run test:photo:bridge
          npm run test:ink:hybrid
          npm run test:context
      - name: Product and gateway regressions
        run: |
          npm run test:gateway
          npm run test:backend
          npm run test:india
      - name: Production build and iPad parity
        run: |
          npm run build
          npm run sync:ios
          npm run check:ios
          node scripts/check-native-package-sync.mjs
      - name: Canonical native PencilKit gate
        run: npm run test:ink:native
      - name: Audit repair
        run: |
          git diff --check
          grep -q "compactInkStrokes(inkResult.strokes)" client/src/components/QuestionCard.jsx
          grep -q "strokeRevision" ios/PriLearning.swiftpm/Ink/InkBridge.swift
          grep -q "1600 : 1000" client/src/ink/InkAnswer.jsx
          grep -q "test:ink:stability" package.json
      - name: Commit validated repair
        run: |
          rm -f tools/apply-ink-real-page-v3.py
          rm -f tools/fix-ink-real-page-v3-installer.py
          rm -f .github/workflows/ink-real-page-v3-stage.yml
          rm -f .github/workflows/ink-real-page-v3-linux.yml
          rm -rf tools/__pycache__
          git add -A
          git config user.name pri-learning-ci
          git config user.email actions@users.noreply.github.com
          git commit -m "Stabilize real multi-line Apple Pencil recognition"
          git push origin HEAD:product/india-native-ink-truth
