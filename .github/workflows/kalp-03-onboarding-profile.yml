name: KALP-03 onboarding-profile gate

on:
  pull_request:
    paths:
      - 'client/src/pages/Login.jsx'
      - 'client/src/local/backend.js'
      - 'client/src/i18n/**'
      - 'client/test/e2e.mjs'
      - 'client/test/a11y-check.mjs'
      - 'client/test/tour-login.js'
      - 'client/test/tour-india.js'
      - 'client/test/tour-kalp01-design.js'
      - 'client/test/tour-kalp02-navigation.js'
      - 'client/test/golden-student-journey.mjs'
      - 'client/test/kalp03-onboarding-check.mjs'
      - 'client/test/tour-kalp03-onboarding.js'
      - 'docs/design/KALP-03-onboarding-profile.md'
      - '.github/workflows/kalp-03-onboarding-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: First-run, profile authority and real learning journey
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: KALP-03 onboarding source and authority gate
        run: node client/test/kalp03-onboarding-check.mjs

      - name: KALP-01 visual-system source regression
        run: node client/test/design-system-check.mjs

      - name: KALP-02 navigation source regression
        run: node client/test/kalp02-navigation-check.mjs

      - name: Build exact client
        run: npm run build --prefix client

      - name: Install Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      # Accessibility rebuilds the source and therefore must execute before
      # browser screenshot evidence creates untracked files under artifacts/.
      - name: Accessibility regression
        run: npm run test:a11y

      - name: KALP-03 real onboarding journey
        run: node client/test/tour-kalp03-onboarding.js --no-build

      - name: Canonical browser regression
        run: node client/test/e2e.mjs --no-build

      - name: KALP-01 tablet visual regression
        run: node client/test/tour-kalp01-design.js --no-build

      - name: KALP-02 role-navigation regression
        run: node client/test/tour-kalp02-navigation.js --no-build

      - name: PRI-02 golden student journey
        run: node client/test/golden-student-journey.mjs --no-build

      - name: Upload KALP-03 responsive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalp-03-onboarding-evidence
          path: artifacts/kalp-03/
          if-no-files-found: warn
          retention-days: 14
