name: One-shot secure build-toolchain upgrade

on:
  push:
    branches:
      - backend-v100-foundation

permissions:
  contents: write

jobs:
  upgrade:
    if: contains(github.event.head_commit.message, '[toolchain-upgrade-request]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backend-v100-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install current lockfile
        run: npm ci --prefix client

      - name: Upgrade Vite and React plugin to their current secure major
        run: npm install --prefix client --save-dev vite@8.2.2 @vitejs/plugin-react@6.1.0

      - name: Refuse high or critical dependency vulnerabilities
        run: npm audit --prefix client --audit-level=high

      - name: Build with the upgraded toolchain
        run: npm run build

      - name: Run gateway and outbox backend gates
        run: npm run test:gateway && npm run test:outbox

      - name: Commit only dependency manifests
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- client/package.json client/package-lock.json
          if git diff --cached --quiet; then
            echo 'Dependency manifests already matched the secure toolchain.'
            exit 0
          fi
          git commit -m 'Upgrade Vite toolchain past known vulnerabilities [toolchain-upgrade-generated]'
          git push origin HEAD:backend-v100-foundation
