name: Runtime Security Migration Bootstrap

on:
  push:
    branches:
      - security/runtime-audit-floor-2026-09-04

permissions:
  contents: write

concurrency:
  group: runtime-security-migration-bootstrap
  cancel-in-progress: true

jobs:
  migrate-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/runtime-audit-floor-2026-09-04
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply patched React Router runtime
        run: |
          set -euo pipefail
          if [ "$(node -p "require('./client/package.json').dependencies['react-router-dom']")" != "7.18.3" ]; then
            npm install --prefix client --save-exact react-router-dom@7.18.3
          fi
          npm ci --prefix client
          test "$(node -p "require('./client/node_modules/react-router-dom/package.json').version")" = "7.18.3"
      - name: Require clean runtime dependency audits
        run: |
          set -euo pipefail
          npm audit --prefix client --omit=dev --audit-level=low
          npm audit --prefix server --omit=dev --audit-level=low
      - name: Deterministic regression suite
        run: npm test
      - name: Build and synchronize tracked iPad bundles
        run: |
          set -euo pipefail
          npm run build
          npm run sync:ios
          npm run check:ios
      - name: Install Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Browser and accessibility regression suites
        run: |
          set -euo pipefail
          npm run test:e2e
          npm run test:a11y
      - name: Persist validated migration
        run: |
          set -euo pipefail
          git config user.name 'Pri Security Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add client/package.json client/package-lock.json ios/PriLearning.swiftpm/Resources/Web ios/'PriLearning 2.swiftpm'/Resources/Web
          if git diff --cached --quiet; then
            echo 'validated migration already persisted'
            exit 0
          fi
          git commit -m 'fix(security): upgrade React Router to 7.18.3'
          git push origin HEAD:security/runtime-audit-floor-2026-09-04
