name: Runtime Audit Floor Bootstrap

on:
  push:
    branches:
      - security/runtime-audit-floor-2026-09-04

permissions:
  contents: read

concurrency:
  group: runtime-audit-floor-bootstrap
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Client runtime audit at low severity
        run: npm audit --prefix client --omit=dev --audit-level=low
      - name: Server runtime audit at low severity
        run: npm audit --prefix server --omit=dev --audit-level=low
