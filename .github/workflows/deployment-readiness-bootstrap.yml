name: Deployment Readiness Bootstrap

on:
  push:
    branches:
      - release/deployment-readiness-2026-09-03

permissions:
  contents: read

concurrency:
  group: deployment-readiness-bootstrap
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/deployment-readiness-2026-09-03
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reproduce production startup with preserved container
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('server/platform/db.js')
          text = p.read_text()
          anchor = "import { fileURLToPath } from 'node:url';\n"
          if "platformDatabasePath" not in text:
              text = text.replace(anchor, anchor + "import { platformDatabasePath } from './config.js';\n", 1)
          text = text.replace(
              "export const platformDb = createPlatformDb(process.env.PRI_PLATFORM_DB || DEFAULT_PATH);",
              "const configuredPlatformPath = platformDatabasePath();\nexport const platformDb = createPlatformDb(configuredPlatformPath || DEFAULT_PATH);",
              1
          )
          p.write_text(text)
          PY

          cat > Dockerfile <<'EOF'
          FROM node:24-bookworm-slim AS client-build
          WORKDIR /app
          COPY client/package.json client/package-lock.json ./client/
          RUN npm ci --prefix client
          COPY client ./client
          RUN npm run build --prefix client

          FROM node:24-bookworm-slim AS server-deps
          WORKDIR /app
          RUN apt-get update \
              && apt-get install -y --no-install-recommends python3 make g++ \
              && rm -rf /var/lib/apt/lists/*
          COPY server/package.json server/package-lock.json ./server/
          RUN npm ci --prefix server --omit=dev

          FROM node:24-bookworm-slim AS runtime
          ENV NODE_ENV=production PORT=4000
          WORKDIR /app
          COPY server ./server
          COPY client/src/engine ./client/src/engine
          COPY --from=server-deps /app/server/node_modules ./server/node_modules
          COPY --from=client-build /app/client/dist ./client/dist
          EXPOSE 4000
          CMD ["node", "server/index.js"]
          EOF

          docker build -t pri-learning:diagnostic .
          tmpdata="$(mktemp -d)"
          docker rm -f pri-learning-diagnostic >/dev/null 2>&1 || true
          docker run -d \
            --name pri-learning-diagnostic \
            -p 127.0.0.1:4011:4000 \
            -v "$tmpdata:/data" \
            -e NODE_ENV=production \
            -e PORT=4000 \
            -e PRI_PUBLIC_ORIGIN=https://learn.pri.example \
            -e PRI_CSRF_SECRET=diagnostic-csrf-secret \
            -e PRI_AUTH_DELIVERY_KEY=3333333333333333333333333333333333333333333333333333333333333333 \
            -e PRI_PLATFORM_DB=/data/pri-learning-platform.db \
            -e PRI_AUTH_EMAIL_PROVIDER=resend \
            -e PRI_RESEND_API_KEY=diagnostic-resend-key \
            -e 'PRI_AUTH_EMAIL_FROM=Pri Learning <noreply@pri.example>' \
            pri-learning:diagnostic

          cleanup() {
            echo '=== docker ps -a ==='
            docker ps -a --filter name=pri-learning-diagnostic || true
            echo '=== docker inspect state ==='
            docker inspect pri-learning-diagnostic --format '{{json .State}}' || true
            echo '=== docker logs ==='
            docker logs pri-learning-diagnostic || true
            docker rm -f pri-learning-diagnostic >/dev/null 2>&1 || true
            rm -rf "$tmpdata"
          }
          trap cleanup EXIT

          ok=0
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4011/v1/health >/tmp/pri-health.json; then
              ok=1
              break
            fi
            if [ "$(docker inspect pri-learning-diagnostic --format '{{.State.Running}}' 2>/dev/null || echo false)" != "true" ]; then
              break
            fi
            sleep 1
          done
          test "$ok" -eq 1
          cat /tmp/pri-health.json
