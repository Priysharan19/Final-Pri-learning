name: Deployment DB Bootstrap

on:
  push:
    branches:
      - release/deployment-readiness-2026-09-03

permissions:
  contents: write

concurrency:
  group: deployment-db-bootstrap
  cancel-in-progress: true

jobs:
  patch-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/deployment-readiness-2026-09-03
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enforce production storage validation before SQLite opens
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          db = Path('server/platform/db.js')
          text = db.read_text()
          anchor = "import { fileURLToPath } from 'node:url';\n"
          import_line = "import { platformDatabasePath } from './config.js';\n"
          if import_line not in text:
              if anchor not in text:
                  raise SystemExit('db import anchor not found')
              text = text.replace(anchor, anchor + import_line, 1)
          old = "export const platformDb = createPlatformDb(process.env.PRI_PLATFORM_DB || DEFAULT_PATH);"
          new = "const configuredPlatformPath = platformDatabasePath();\nexport const platformDb = createPlatformDb(configuredPlatformPath || DEFAULT_PATH);"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('platformDb bootstrap anchor not found')
          db.write_text(text)
          PY

          npm ci --prefix server
          node server/test/production-storage-config-check.mjs
          node server/test/production-db-bootstrap-check.mjs
          node server/test/platform-schema-check.mjs
          node server/test/platform-migration-check.mjs

          git config user.name 'Pri Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add server/platform/db.js
          if git diff --cached --quiet; then
            echo 'Production DB bootstrap is already hardened.'
            exit 0
          fi
          git commit -m 'fix(deploy): validate production storage before SQLite opens'
          git push origin HEAD:release/deployment-readiness-2026-09-03
