name: One-shot context coverage gate fix

on:
  push:
    branches:
      - handwriting-v11-hardening

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[context-gate-fix-request]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: handwriting-v11-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch stable context coverage measurement
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('client/test/inkcheck-context.mjs')
          s = p.read_text()
          old = "console.log(`\\n  wrong-answer readings ctx left alone          ${checks / 2 - changed}/${checks / 2}`);"
          new = old + "\nconsole.log(`  correct-answer readings ctx tested             ${checks / 2}`);"
          if old not in s:
              raise SystemExit('context output anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('.github/workflows/ci.yml')
          s = p.read_text()
          if 'CONTEXT_MISREAD_CORRECT: "11"' not in s:
              raise SystemExit('old context env floor not found')
          s = s.replace('CONTEXT_MISREAD_CORRECT: "11"', 'CONTEXT_CORRECT_READINGS: "256"', 1)
          old_gate = 'gate "context · misread correct answers" "misread correct answers ctx recovered" \'s|.*/\\([0-9][0-9]*\\).*|\\1|p\'          "$CONTEXT_MISREAD_CORRECT"'
          new_gate = 'gate "context · correct-answer readings" "correct-answer readings ctx tested" \'s|.*tested[[:space:]]*\\([0-9][0-9]*\\).*|\\1|p\'     "$CONTEXT_CORRECT_READINGS"'
          if old_gate not in s:
              raise SystemExit('old context gate line not found')
          s = s.replace(old_gate, new_gate, 1)
          s = s.replace('context       256 wrong-answer readings · 11 misread correct', 'context       256 wrong-answer readings · 256 correct-answer readings', 1)
          p.write_text(s)
          PY
      - name: Commit correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/test/inkcheck-context.mjs .github/workflows/ci.yml
          git commit -m 'Fix context coverage gate: count invariant probes, not current misreads'
          git push origin HEAD:handwriting-v11-hardening
