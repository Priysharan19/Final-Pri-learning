name: Sync handwriting branch iPad bundle

on:
  push:
    branches:
      - perf/handwriting-smoothness-v1
    paths-ignore:
      - 'ios/PriLearning.swiftpm/Resources/Web/**'
      - 'ios/PriLearning 2.swiftpm/Resources/Web/**'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/handwriting-smoothness-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Build client
        run: npm run build
      - name: Sync both tracked SwiftPM web bundles
        run: npm run sync:ios
      - name: Commit generated bundle only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'ios/PriLearning.swiftpm/Resources/Web' 'ios/PriLearning 2.swiftpm/Resources/Web'
          if git diff --cached --quiet; then
            echo 'iPad bundles already match the client build.'
            exit 0
          fi
          git commit -m 'build(ios): sync handwriting smoothness bundle'
          git push origin HEAD:perf/handwriting-smoothness-v1
