name: Pri Ink single-glyph release temp

on:
  push:
    branches:
      - feature/pri-reason-v3-proof-plans
    paths:
      - '.github/workflows/pri-ink-single-glyph-release-temp.yml'

permissions:
  contents: write

jobs:
  release-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feature/pri-reason-v3-proof-plans
          fetch-depth: 0
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply measured single-glyph patch
        run: python3 tools/pri-ink-single-glyph-release-temp.py
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Hybrid safety regression
        run: npm run test:ink:hybrid
      - name: Answer-context anti-leak regression
        run: npm run test:context
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exact browser E2E
        run: npm run test:e2e
      - name: Production build
        run: npm run build
      - name: Refresh tracked iPad bundles
        run: npm run sync:ios
      - name: Verify iPad parity
        run: npm run check:ios
      - name: Diff safety
        run: git diff --check
      - name: Commit only tested production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/ink/runtimeSpatial.js \
                  client/test/ink-hybrid-check.mjs \
                  ios/PriLearning.swiftpm/Resources/Web \
                  'ios/PriLearning 2.swiftpm/Resources/Web'
          if git diff --cached --quiet; then
            echo "No production changes to commit"
          else
            git commit -m "Harden numeric single-glyph 5 recognition"
            git push origin HEAD:feature/pri-reason-v3-proof-plans
          fi
