# Native iPhone + iPad handwriting validation.
# Canonical Swift source, duplicate-package drift, JS↔Swift transport and the
# installed simulator app are all gated independently.
#
# This is the iOS 26 macOS lane (native-journey-ios27.yml is the iOS 27 one,
# the shipping OS). It runs on the hosted macos-26 image PINNED to Xcode 26.6
# and the iOS 26.5 simulator runtime: the pin is asserted before anything
# builds and enforced by every harness script (PRI_SIM_RUNTIME →
# scripts/simulator-fleet.mjs), so a runner-image change fails this lane by
# name instead of moving it to another iOS silently (#676 went unseen that
# way, with the lane on Xcode 16.4 / iOS 26.2 as late as 31 October 2026).
# It is path-filtered to the native shell, the ink runtime and its own harness
# scripts so a docs-only or curriculum PR does not queue a 60-minute macOS
# run; superseded heads on the same ref are cancelled.
# Pull requests validate through `pull_request` alone and `push` runs only on
# main: the push + pull_request pair cost two macOS jobs per PR commit and, on
# 2026-10-17, saturated the macOS queue for seven hours (Pri App Health on main
# was cancelled seven times while its macOS job waited for a runner).
# When this workflow does not trigger for a PR head there is no run to wait on,
# which Main Integrity must treat as "not pending" (docs/release/release-policy.md).
#
# The job keeps ONE simulator booted at a time and builds the Swift package
# ONCE (scripts/simulator-fleet.mjs): hosted macOS runners are 3-core/7 GB, and
# two booted simulators plus three xcodebuilds stalled `simctl install` for 24
# minutes and pushed `log show` reads past their bound.
name: Native Ink

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'client/src/ink/**'
      - 'client/src/platform/native/**'
      - 'client/test/native-ink-check.mjs'
      - 'scripts/native-bridge-selfcheck.mjs'
      - 'scripts/iphone-journey.mjs'
      - 'scripts/cloud-fixture-server.mjs'
      - 'scripts/journey-oracle.mjs'
      - 'scripts/synthetic-reader-server.mjs'
      - 'scripts/apple-shipping-target.mjs'
      - 'scripts/ci-provision-simulators.mjs'
      - 'scripts/simulator-fleet.mjs'
      - 'client/test/apple-shipping-target-check.mjs'
      - 'scripts/ink-native-check.mjs'
      - 'scripts/check-native-package-sync.mjs'
      - 'scripts/sync-ios.mjs'
      - '.github/workflows/native-ink.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'client/src/ink/**'
      - 'client/src/platform/native/**'
      - 'client/test/native-ink-check.mjs'
      - 'scripts/native-bridge-selfcheck.mjs'
      - 'scripts/iphone-journey.mjs'
      - 'scripts/cloud-fixture-server.mjs'
      - 'scripts/journey-oracle.mjs'
      - 'scripts/synthetic-reader-server.mjs'
      - 'scripts/apple-shipping-target.mjs'
      - 'scripts/ci-provision-simulators.mjs'
      - 'scripts/simulator-fleet.mjs'
      - 'client/test/apple-shipping-target-check.mjs'
      - 'scripts/ink-native-check.mjs'
      - 'scripts/check-native-package-sync.mjs'
      - 'scripts/sync-ios.mjs'
      - '.github/workflows/native-ink.yml'

permissions:
  contents: read

concurrency:
  group: native-ink-${{ github.ref }}
  cancel-in-progress: true

env:
  # The pins (actions/runner-images images/macos/macos-26-arm64-Readme.md,
  # checked 2026-11-02: Xcode 26.6 default; iOS 26.2, 26.4 and 26.5 runtimes).
  PRI_XCODE_APP: /Applications/Xcode_26.6.app
  PRI_XCODE_VERSION: '26.6'
  PRI_SIM_RUNTIME: '26.5'
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  native-ink:
    name: Swift build, capture gate and bridge smoke test (iOS 26)
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Canonical native source has no stale duplicate
        run: node scripts/check-native-package-sync.mjs

      # The web bundle inside the package is generated, never tracked (decision
      # D28): Package.swift copies Resources/Web, so the client is built and
      # synced into both packages before the one xcodebuild below, and the
      # sync is proven complete. Without this the simulator app would carry an
      # empty Web folder and every journey below would fail at the first page.
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Build the web client and generate the iOS web bundles
        run: |
          set -euo pipefail
          npm run build
          npm run sync:ios
          npm run check:ios

      # The toolchain is what this lane says it is, or the lane stops here.
      - name: Pinned toolchain (Xcode 26.6, iOS 26.5 simulator runtime)
        run: |
          set -euo pipefail
          test -d "$PRI_XCODE_APP" || { echo "::error::$PRI_XCODE_APP is not on this image; the macos-26 image changed. Re-pin deliberately."; ls /Applications | grep -i xcode; exit 1; }
          xcodebuild -version | tee xcode-version.txt
          grep -Eq "^Xcode ${PRI_XCODE_VERSION//./\\.}(\.[0-9]+)?$" xcode-version.txt || { echo "::error::xcodebuild is not Xcode $PRI_XCODE_VERSION"; exit 1; }
          xcrun simctl list runtimes | tee runtimes.txt
          grep -Eq "^iOS ${PRI_SIM_RUNTIME//./\\.}(\.[0-9]+)? " runtimes.txt || { echo "::error::the iOS $PRI_SIM_RUNTIME simulator runtime is not installed on this image. Install it or re-pin deliberately; this lane never runs on another iOS."; exit 1; }

      # V1 needs both families (#504). Hosted images do not always ship an
      # iPad device, so create any missing one on the PINNED iOS runtime.
      # Only the iPad is booted here — the first simulator steps use it — and
      # each later step boots its own family and shuts the other down, so the
      # runner never carries two booted simulators. Fails when the pinned
      # runtime or a device type of a family is missing.
      - name: iPad and iPhone simulators on iOS ${{ env.PRI_SIM_RUNTIME }}
        run: node scripts/ci-provision-simulators.mjs --boot ipad

      - name: JS ↔ Swift ink contract
        run: npm run test:ink:bridge

      # One simulator build of the canonical shipping package itself (no
      # scratch copy), reused by every simulator step below on iPhone and iPad.
      # A generic destination needs no booted simulator.
      - name: Build the simulator app (canonical iPhone + iPad package)
        run: |
          set -euo pipefail
          (cd ios/PriLearning.swiftpm && xcodebuild -scheme PriLearning -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" build -quiet)
          APP="$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name '*.app' -path '*iphonesimulator*' | head -1)"
          test -n "$APP"
          echo "PRI_SIM_APP=$APP" >> "$GITHUB_ENV"

      # Gate A: every stroke placed on the PencilKit surface comes back with
      # every point and the Pencil signal intact; the surface sits where the
      # page said. Nothing native reads ink (owner decision 2026-10-02, D16).
      - name: Native PencilKit capture self-check (iPad)
        run: node scripts/ink-native-check.mjs --app "$PRI_SIM_APP"

      # CP-02: the priNative contract inside real WebKit — deep-frozen host
      # descriptor, no OS identity, main-frame envelope round trip, and a
      # same-origin subframe refused by the sender gate. Simulator evidence.
      - name: priNative bridge self-check (iPad simulator)
        run: node scripts/native-bridge-selfcheck.mjs --family ipad --app "$PRI_SIM_APP"

      - name: Server dependencies for the local Pri server
        run: npm ci --prefix server

      # Every iPad step runs before the first iPhone step and every step picks
      # the same pinned device, so each simulator cold-boots once (#850 did the
      # same for the iOS 27 lane). The iPad journey's legs are described below.
      - name: iPad journey (simulator)
        run: node scripts/iphone-journey.mjs --family ipad --app "$PRI_SIM_APP" --dynamic-type --lifecycle --a11y --evidence journey-ipad.json

      # CP-04 × #504: main is the V1 Apple shipping target — iPhone (portrait)
      # and iPad (all orientations), bundle id com.prilearning.app
      # (PRI_V1_RELEASE_SCOPE §22).
      - name: Apple shipping target is iPhone + iPad (V1)
        run: node scripts/apple-shipping-target.mjs --check-v1

      - name: Apple shipping-target gate refuses wrong declarations
        run: node client/test/apple-shipping-target-check.mjs

      # The same shell on an iPhone simulator, and the native student journey
      # on iPhone and iPad. Grading is online-only and server-authoritative
      # (ADR-0001, owner decision 2026-10-10), so the journey has two legs and
      # both must pass (scripts/iphone-journey.mjs):
      #   1. no server — typed answer and working, strokes on the PencilKit
      #      surface (hardware-correct ink facts, sealed draft, one truthful
      #      save status), a photo that is not read on the device; the offline
      #      draft says it cannot be marked and offers no Submit or Show
      #      solution, asking for a markable question changes nothing, nothing
      #      is marked; relaunch keeps the work;
      #   2. a real local Pri server on SQLite with a SYNTHETIC handwriting
      #      reader — server-prepared question signed out, in-card sign-in,
      #      server-marked typed and handwritten answers, History after relaunch.
      # SIMULATOR + SYNTHETIC READER evidence records are uploaded; they are
      # never device, Pencil or real-provider evidence.
      - name: priNative bridge self-check (iPhone simulator)
        run: node scripts/native-bridge-selfcheck.mjs --family iphone --app "$PRI_SIM_APP"

      # CP-05: the iPhone certification journey adds, on the same install, the
      # cloud account against a REAL Pri server (scripts/cloud-fixture-server.mjs:
      # sign up → sign in → delete; sign in → sync; offline with the server gone;
      # reconnect after relaunch; disconnect), background → foreground with an
      # unsent answer, an in-shell accessibility smoke, and the largest
      # accessibility text size with no sideways overflow.
      # Both journeys start the real server (the marking leg always; the
      # iPhone run also for the account journey); its dependencies install
      # before the iPad journey above.
      - name: iPhone certification journey (simulator)
        run: node scripts/iphone-journey.mjs --family iphone --app "$PRI_SIM_APP" --cloud --dynamic-type --lifecycle --a11y --evidence journey-iphone.json


      - name: The evidence names the pinned runtime
        if: always()
        run: |
          set -euo pipefail
          for f in journey-iphone.json journey-ipad.json; do
            test -s "$f" || continue
            node -e "const e=require('./$f'); if (e.simulator.runtimePinned !== true || e.simulator.pinnedRuntime !== process.env.PRI_SIM_RUNTIME || !/^iOS-26-5$/.test(e.simulator.runtime)) { console.error('$f ran on', e.simulator.runtime, 'pinned', e.simulator.pinnedRuntime); process.exit(1); } console.log('$f: ' + e.simulator.name + ' on ' + e.simulator.runtime + ' (pinned ' + e.simulator.pinnedRuntime + ') ' + e.result);"
          done

      - name: Simulator evidence records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-simulator-evidence
          path: |
            journey-*.json
            xcode-version.txt
            runtimes.txt
          if-no-files-found: warn
