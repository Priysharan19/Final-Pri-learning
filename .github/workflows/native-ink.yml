# Native iPad handwriting validation.
# Canonical Swift source, duplicate-package drift, JS↔Swift transport and the
# installed simulator app are all gated independently.
name: Native Ink

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/PriLearning.swiftpm/**'
      - 'ios/PriLearning 2.swiftpm/**'
      - 'client/src/ink/native.js'
      - 'client/src/platform/native/**'
      - 'client/test/native-ink-check.mjs'
      - 'scripts/native-bridge-selfcheck.mjs'
      - 'scripts/iphone-journey.mjs'
      - 'scripts/apple-shipping-target.mjs'
      - 'scripts/ink-native-check.mjs'
      - 'scripts/check-native-package-sync.mjs'
      - 'handwriting/v12/**'
      - '.github/workflows/native-ink.yml'
  pull_request:
    paths:
      - 'ios/PriLearning.swiftpm/**'
      - 'ios/PriLearning 2.swiftpm/**'
      - 'client/src/ink/native.js'
      - 'client/src/platform/native/**'
      - 'client/test/native-ink-check.mjs'
      - 'scripts/native-bridge-selfcheck.mjs'
      - 'scripts/iphone-journey.mjs'
      - 'scripts/apple-shipping-target.mjs'
      - 'scripts/ink-native-check.mjs'
      - 'scripts/check-native-package-sync.mjs'
      - 'handwriting/v12/**'
      - '.github/workflows/native-ink.yml'

concurrency:
  group: native-ink-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-ink:
    name: Swift build, native benchmark and bridge smoke test
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Canonical native source has no stale duplicate
        run: node scripts/check-native-package-sync.mjs

      - name: Apple toolchain and iPad simulator
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list devices available | grep -m 1 'iPad' >/dev/null || {
            echo '::error::No iPad simulator is available on this runner'
            exit 1
          }

      - name: JS ↔ Swift ink contract
        run: npm run test:ink:bridge

      - name: Native PencilKit + Vision self-check
        run: npm run test:ink:native

      # CP-02: the priNative contract inside real WebKit — deep-frozen host
      # descriptor, no OS identity, main-frame envelope round trip, and a
      # same-origin subframe refused by the sender gate. Simulator evidence.
      - name: priNative bridge self-check (iPad simulator)
        run: node scripts/native-bridge-selfcheck.mjs --family ipad

      # CP-04: main is the iPad-only V1 shipping target (PRI_V1_RELEASE_SCOPE).
      - name: Apple shipping target is iPad-only (V1)
        run: node scripts/apple-shipping-target.mjs --check-v1

      # iPhone engineering: one simulator build of a scratch copy that adds the
      # iPhone family (never archived), reused by every step below.
      - name: Build the simulator app (iPad + iPhone engineering copy)
        run: |
          set -euo pipefail
          ENG="$(node scripts/apple-shipping-target.mjs --engineering-package "$RUNNER_TEMP/eng")"
          (cd "$ENG" && xcodebuild -scheme PriLearning -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" build -quiet)
          APP="$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name '*.app' -path '*iphonesimulator*' | head -1)"
          test -n "$APP"
          echo "PRI_SIM_APP=$APP" >> "$GITHUB_ENV"

      # The same shell on an iPhone simulator, and the native student journey
      # on iPhone and iPad (onboarding → typed attempt marked → feedback → next
      # → native ink reading with hardware-correct ink facts → progress →
      # relaunch persistence). SYNTHETIC / SIMULATOR evidence records uploaded.
      - name: priNative bridge self-check (iPhone simulator)
        run: node scripts/native-bridge-selfcheck.mjs --family iphone --app "$PRI_SIM_APP"

      - name: Native student journey (iPhone simulator)
        run: node scripts/iphone-journey.mjs --family iphone --app "$PRI_SIM_APP" --evidence journey-iphone.json

      - name: Native student journey (iPad simulator)
        run: node scripts/iphone-journey.mjs --family ipad --app "$PRI_SIM_APP" --evidence journey-ipad.json

      - name: Simulator evidence records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-simulator-evidence
          path: journey-*.json
          if-no-files-found: warn
