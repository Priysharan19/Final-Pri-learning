name: Validate Production Storage

on:
  push:
    branches:
      - release/persistent-platform-db-2026-09-03

permissions:
  contents: read

jobs:
  storage-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Production persistence fail-closed contract
        run: node server/test/production-storage-config-check.mjs
