name: Handwriting CI Boundary Helper

on:
  push:
    branches:
      - perf/cloud-handwriting-smoothness-sep1
    paths:
      - .github/workflows/handwriting-ci-boundary-helper.yml

permissions:
  contents: read

jobs:
  export-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/cloud-handwriting-smoothness-sep1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/patch-handwriting-ci.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: patched-handwriting-ci
          path: .github/workflows/ci.yml
          if-no-files-found: error
          retention-days: 1
