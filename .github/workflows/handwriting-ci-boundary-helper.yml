name: Handwriting CI Boundary Helper

on:
  push:
    branches:
      - perf/cloud-handwriting-smoothness-sep1
    paths:
      - .github/workflows/handwriting-ci-boundary-helper.yml

permissions:
  contents: write

jobs:
  patch-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/cloud-handwriting-smoothness-sep1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/patch-handwriting-ci.mjs
      - name: Commit CI boundary gate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "ci(ink): audit optional handwriting gateway boundary"
          git push origin HEAD:perf/cloud-handwriting-smoothness-sep1
