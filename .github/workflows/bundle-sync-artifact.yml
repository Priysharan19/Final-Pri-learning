name: Bundle Sync Artifact

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Build client
        run: npm run build
      - name: Sync iOS web bundle
        run: npm run sync:ios
      - name: Verify generated bundle
        run: npm run check:ios
      - name: Stage generated bundle and remove temporary workflow
        run: |
          git add -A ios/PriLearning.swiftpm/Resources/Web
          git rm .github/workflows/bundle-sync-artifact.yml
          git status --short
      - name: Commit generated bundle to staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Handwriting V11: sync generated iOS web bundle"
          git push origin HEAD:agent/v11-ios-bundle-sync
