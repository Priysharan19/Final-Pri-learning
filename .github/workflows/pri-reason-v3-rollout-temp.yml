name: Pri Reason V3 rollout temp

on:
  push:
    branches:
      - feature/pri-reason-v3-proof-plans
    paths:
      - '.github/workflows/pri-reason-v3-rollout-temp.yml'

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout rollout branch
        uses: actions/checkout@v4
        with:
          ref: feature/pri-reason-v3-proof-plans
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact V3 source patch
        run: python3 tools/pri-reason-v3-proof-plans-temp.py
      - name: Pri Reason V1 regression
        run: node client/test/pri-reason-check.mjs
      - name: Pri Reason V2 regression
        run: node client/test/pri-reason-v2-check.mjs
      - name: Pri Reason V3 proof-plan regression
        run: node client/test/pri-reason-v3-check.mjs
      - name: Authored curriculum integration
        run: node client/test/pri-reason-curriculum-check.mjs
      - name: Diagnosis regression
        run: node client/test/diagnose-check.mjs
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Build client
        run: npm run build
      - name: Refresh both tracked iPad bundles
        run: npm run sync:ios
      - name: Verify iPad parity
        run: npm run check:ios
      - name: Diff safety
        run: git diff --check
      - name: Commit tested product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/engine/checker.js \
                  client/src/engine/generators/year11.js \
                  client/test/pri-reason-curriculum-check.mjs \
                  ios/PriLearning.swiftpm/Resources/Web \
                  'ios/PriLearning 2.swiftpm/Resources/Web'
          if git diff --cached --quiet; then
            echo "No rollout changes to commit"
          else
            git commit -m "Activate Pri Reason V3 proof plans for Year 11 calculus"
            git push origin HEAD:feature/pri-reason-v3-proof-plans
          fi
