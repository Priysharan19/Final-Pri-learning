name: Temporary NCERT Chapter 2 integration

on:
  push:
    branches:
      - feature/ncert-class8-linear-complete

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ncert-class8-linear-complete
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Revalidate both NCERT chapter contracts
        run: |
          npm run test:ncert:rational
          npm run test:ncert:linear
          npm run test:india
          npm run test:ink:bridge
          npm run test:ink:interaction
          npm run test:explain
      - name: Build, synchronize and verify tracked iPad bundles
        run: |
          npm run build
          npm run sync:ios
          npm run check:ios
      - name: Commit synchronized iPad production bundles
        run: |
          git config user.name "Pri Learning CI"
          git config user.email "actions@users.noreply.github.com"
          git add ios/
          if ! git diff --cached --quiet; then
            git commit -m "Sync complete NCERT Chapter 2 into iPad bundles"
            git push origin HEAD:feature/ncert-class8-linear-complete
          fi
