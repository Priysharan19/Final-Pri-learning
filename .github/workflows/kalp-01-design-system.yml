name: KALP-01 design-system gate

on:
  pull_request:
    paths:
      - 'client/src/**'
      - 'client/test/design-system-check.mjs'
      - 'client/test/tour-kalp01-design.js'
      - 'docs/design/**'
      - 'docs/evidence/KALP-01*'
      - '.github/workflows/kalp-01-design-system.yml'
  workflow_dispatch:

permissions:
  contents: read

# These browser gates also drive the Australian-syllabus flows, which a V1
# build hides behind PRI_FEATURE_AUSTRALIA. The shipped iPad bundles stay
# flag-off (client/test/ios-bundle-features-check.mjs).
env:
  PRI_FEATURE_AUSTRALIA: '1'
  PRI_FEATURE_EXTENDED_TRACKS: '1'

jobs:
  verify:
    name: Build, browser journey, accessibility and visual evidence
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix client
      # Client suites are marked by the real /v1 server, booted in-process (online-only grading).
      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Canonical design-system source gate
        run: node client/test/design-system-check.mjs

      - name: Production client build
        run: npm run build --prefix client

      - name: Install Chromium for real-browser gates
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Existing core browser regressions
        run: node client/test/e2e.mjs --only=login,india,phone,v3 --no-build

      - name: Existing accessibility gate
        run: npm run test:a11y

      - name: Existing Pri Explain contract
        run: node client/test/pri-explain-check.mjs

      - name: Existing India surface contract
        run: node client/test/india-native-surfaces-check.mjs

      - name: KALP-01 tablet and visual acceptance
        run: node client/test/tour-kalp01-design.js --no-build

      - name: Upload KALP-01 screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kalp-01-visual-evidence
          path: artifacts/kalp-01/
          if-no-files-found: warn
          retention-days: 14
