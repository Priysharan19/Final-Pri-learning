name: Router cloud handoff fix

on:
  push:
    branches: ["security/runtime-audit-floor-2026-09-04"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/runtime-audit-floor-2026-09-04
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch cloud tour assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('client/test/tour-cloud-platform.js')
          s = p.read_text()
          start = s.index('    const assignmentTitle = page.getByText(ASSIGNMENT.title')
          end = s.index('\n\n    await page.waitForTimeout(300);', start)
          replacement = '''    const assignmentCard = page.locator('.card', { has: page.getByText(ASSIGNMENT.title, { exact: true }) }).first();
    await assignmentCard.waitFor({ state: 'visible', timeout: 15000 });
    const assignmentCardText = await assignmentCard.innerText();
    await check('Practice renders the verified assignment context before serving local maths',
      assignmentCardText.includes(ASSIGNMENT.title) && assignmentCardText.includes('0/3 questions completed'),
      `assignment card reads ${JSON.stringify(assignmentCardText.slice(0, 320))}`);'''
          p.write_text(s[:start] + replacement + s[end:])
          PY
      - run: npm ci --prefix client
      - run: npx playwright install --with-deps chromium
      - run: npm run build --prefix client
      - run: node client/test/tour-cloud-platform.js --no-build
      - name: Commit verified patch
        run: |
          rm .github/workflows/router-cloud-tour-fix.yml
          git config user.name "Pri Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add client/test/tour-cloud-platform.js .github/workflows/router-cloud-tour-fix.yml
          git commit -m "test(router): verify assignment handoff in rendered card"
          git push origin HEAD:security/runtime-audit-floor-2026-09-04
