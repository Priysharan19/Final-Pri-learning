name: Ink Structural V4 Synthetic

on:
  push:
    paths:
      - 'tools/ink-foundation/generate_structural_synthetic.mjs'
      - 'tools/ink-foundation/structural.py'
      - 'tools/ink-foundation/structural_data.py'
      - 'tools/ink-foundation/train_structural.py'
      - 'scripts/ink-structural-pretrain-dev.sh'
      - 'scripts/ink-structural-rebuild-dev.sh'
      - 'package.json'
      - '.github/workflows/ink-structural-v4-synthetic.yml'
  pull_request:
    paths:
      - 'tools/ink-foundation/generate_structural_synthetic.mjs'
      - 'tools/ink-foundation/structural.py'
      - 'tools/ink-foundation/structural_data.py'
      - 'tools/ink-foundation/train_structural.py'
      - 'scripts/ink-structural-pretrain-dev.sh'
      - 'scripts/ink-structural-rebuild-dev.sh'
      - 'package.json'
      - '.github/workflows/ink-structural-v4-synthetic.yml'

concurrency:
  group: ink-structural-v4-synthetic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-synthetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/ink-foundation/requirements.txt

      - name: Generator syntax
        run: node --check tools/ink-foundation/generate_structural_synthetic.mjs

      - name: Install training dependencies
        run: python -m pip install -r tools/ink-foundation/requirements.txt

      - name: Generate tiny exact structural corpus
        run: |
          node tools/ink-foundation/generate_structural_synthetic.mjs \
            /tmp/pri-ink-v4-exact-synth 3 2 4

      - name: Exact structural provenance contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('/tmp/pri-ink-v4-exact-synth').glob('*.json'))
          assert len(files) == 5, len(files)
          docs = [json.loads(p.read_text()) for p in files]
          samples = [s for d in docs for s in d['samples']]
          assert len(samples) == 20
          assert all(s.get('structure', {}).get('syntheticExact', {}).get('status') == 'generator-ground-truth' for s in samples)
          assert all(s['structure']['groups'] for s in samples)
          for s in samples:
              covered = sorted(i for g in s['structure']['groups'] for i in g['strokes'])
              assert covered == list(range(len(s['strokes']))), (s['target'], covered, len(s['strokes']))
              keys = [(r['from'], r['to'], r['type']) for r in s['structure']['relations']]
              assert len(keys) == len(set(keys)), s['target']
          print('Exact synthetic trace supervision: PASS')
          PY

      - name: Strict structural audit
        run: python tools/ink-foundation/audit_structural.py /tmp/pri-ink-v4-exact-synth --require-all

      - name: One-epoch exact synthetic training smoke
        run: |
          python tools/ink-foundation/train_structural.py \
            --corpus /tmp/pri-ink-v4-exact-synth \
            --out /tmp/pri-ink-v4-exact-synth.pt \
            --epochs 1 \
            --batch 4 \
            --device cpu \
            --d-model 64 \
            --point-layers 1 \
            --stroke-layers 1 \
            --max-strokes 64 \
            --max-points-per-stroke 96 \
            --patience 1

      - name: Checkpoint remains research-only
        run: |
          python - <<'PY'
          import torch
          p = '/tmp/pri-ink-v4-exact-synth.pt'
          ckpt = torch.load(p, map_location='cpu', weights_only=False)
          assert ckpt['architecture_version'] == 4
          assert ckpt['stage'] == 'structural-research'
          assert ckpt['production_ready'] is False
          print('Exact synthetic promotion lock: PASS')
          PY
