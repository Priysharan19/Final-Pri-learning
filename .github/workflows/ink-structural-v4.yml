name: Ink Structural V4

on:
  push:
    paths:
      - 'tools/ink-foundation/structural.py'
      - 'tools/ink-foundation/structural_data.py'
      - 'tools/ink-foundation/train_structural.py'
      - '.github/workflows/ink-structural-v4.yml'
  pull_request:
    paths:
      - 'tools/ink-foundation/structural.py'
      - 'tools/ink-foundation/structural_data.py'
      - 'tools/ink-foundation/train_structural.py'
      - '.github/workflows/ink-structural-v4.yml'

concurrency:
  group: ink-structural-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural-contract:
    name: Hierarchical grouping and relation contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/ink-foundation/requirements.txt

      - name: Python syntax
        run: |
          python -m py_compile \
            tools/ink-foundation/structural.py \
            tools/ink-foundation/structural_data.py \
            tools/ink-foundation/train_structural.py

      - name: Install training dependencies
        run: python -m pip install -r tools/ink-foundation/requirements.txt

      - name: V4 structural tensor contract
        run: |
          python - <<'PY'
          import sys, torch
          sys.path.insert(0, 'tools/ink-foundation')
          from data import TOKEN_TO_ID
          from structural import PriInkStructuralV4, StructuralConfig, RELATION_TO_ID
          from structural_data import hierarchical_stroke_features, structural_targets

          cfg = StructuralConfig(
              d_model=64, nhead=8, point_layers=1, stroke_layers=1,
              ff_dim=128, max_strokes=8, max_points_per_stroke=16,
          )
          strokes = [
              {'points': [{'x': 10, 'y': 50, 't': 0.0}, {'x': 30, 'y': 30, 't': 0.1}]},
              {'points': [{'x': 35, 'y': 20, 't': 0.2}, {'x': 45, 'y': 15, 't': 0.3}]},
              {'points': [{'x': 55, 'y': 38, 't': 0.4}, {'x': 75, 'y': 38, 't': 0.5}]},
              {'points': [{'x': 55, 'y': 46, 't': 0.6}, {'x': 75, 'y': 46, 't': 0.7}]},
          ]
          structure = {
              'groups': [
                  {'id': 'x', 'symbol': 'x', 'strokes': [0]},
                  {'id': 'two', 'symbol': '2', 'strokes': [1]},
                  {'id': 'eq', 'symbol': '=', 'strokes': [2, 3]},
              ],
              'relations': [
                  {'from': 'x', 'to': 'two', 'type': 'SUPERSCRIPT'},
                  {'from': 'x', 'to': 'eq', 'type': 'RIGHT'},
              ],
          }
          p, pv, sv, geom = hierarchical_stroke_features(strokes, cfg)
          sym, group, rel = structural_targets(structure, cfg.max_strokes)
          assert group[2, 3] == 1 and group[0, 1] == 0
          assert rel[0, 1] == RELATION_TO_ID['SUPERSCRIPT']
          assert rel[0, 2] == RELATION_TO_ID['RIGHT']
          assert sym[2] == TOKEN_TO_ID['='] and sym[3] == TOKEN_TO_ID['=']

          model = PriInkStructuralV4(len(TOKEN_TO_ID), cfg).eval()
          raster = torch.zeros(1, 1, cfg.raster_height, cfg.raster_width)
          with torch.inference_mode():
              out = model(
                  torch.from_numpy(p)[None], torch.from_numpy(pv)[None],
                  torch.from_numpy(sv)[None], torch.from_numpy(geom)[None], raster,
              )
          assert out['symbol_logits'].shape == (1, cfg.max_strokes, len(TOKEN_TO_ID))
          assert out['group_logits'].shape == (1, cfg.max_strokes, cfg.max_strokes)
          assert out['relation_logits'].shape == (
              1, cfg.max_strokes, cfg.max_strokes, len(RELATION_TO_ID)
          )
          assert torch.isfinite(out['symbol_logits']).all()
          print('Pri Ink V4 structural tensor contract: PASS')
          PY

      - name: Build tiny writer-disjoint annotated corpus
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/pri-ink-v4-smoke'); root.mkdir(parents=True, exist_ok=True)

          def stroke(points, t0):
              return {'points': [
                  {'x': x, 'y': y, 't': t0 + i * 0.02, 'p': 0.55, 'w': 2.5,
                   'azimuth': 0.2, 'altitude': 1.2}
                  for i, (x, y) in enumerate(points)
              ]}

          def sample(offset=0):
              strokes = [
                  stroke([(10+offset,50),(20+offset,40),(30+offset,30)], 0.00),
                  stroke([(34+offset,22),(42+offset,14)], 0.10),
                  stroke([(52+offset,38),(72+offset,38)], 0.20),
                  stroke([(52+offset,46),(72+offset,46)], 0.30),
                  stroke([(82+offset,28),(92+offset,38),(82+offset,50)], 0.40),
              ]
              return {
                  'target': 'x^(2)=3',
                  'strokes': strokes,
                  'structure': {
                      'groups': [
                          {'id':'g0','symbol':'x','strokes':[0]},
                          {'id':'g1','symbol':'2','strokes':[1]},
                          {'id':'g2','symbol':'=','strokes':[2,3]},
                          {'id':'g3','symbol':'3','strokes':[4]},
                      ],
                      'relations': [
                          {'from':'g0','to':'g1','type':'SUPERSCRIPT'},
                          {'from':'g0','to':'g2','type':'RIGHT'},
                          {'from':'g2','to':'g3','type':'RIGHT'},
                      ],
                  },
              }

          docs = [
              ('train-a.json', 'train', 'T0001', [sample(0), sample(2)]),
              ('train-b.json', 'train', 'T0002', [sample(-1), sample(1)]),
              ('val.json', 'validation', 'V0001', [sample(3), sample(-3)]),
          ]
          for name, split, writer, samples in docs:
              doc = {
                  'format':'pri-ink-corpus', 'version':7, 'split':split,
                  'writer':{'id':writer}, 'samples':samples,
              }
              (root/name).write_text(json.dumps(doc))
          print(root)
          PY

      - name: One-epoch CPU structural training smoke
        run: |
          python tools/ink-foundation/train_structural.py \
            --corpus /tmp/pri-ink-v4-smoke \
            --out /tmp/pri-ink-v4-smoke.pt \
            --epochs 1 \
            --batch 2 \
            --workers 0 \
            --device cpu \
            --d-model 64 \
            --point-layers 1 \
            --stroke-layers 1 \
            --max-strokes 8 \
            --max-points-per-stroke 16 \
            --patience 1

      - name: Checkpoint is research-only V4 evidence
        run: |
          python - <<'PY'
          import json, pathlib, torch
          p = pathlib.Path('/tmp/pri-ink-v4-smoke.pt')
          if not p.exists() or p.stat().st_size < 10_000:
              raise SystemExit('V4 smoke did not create a substantive checkpoint')
          ckpt = torch.load(p, map_location='cpu', weights_only=False)
          manifest = json.loads(p.with_suffix('.json').read_text())
          assert ckpt['architecture_version'] == 4
          assert ckpt['stage'] == 'structural-research'
          assert ckpt['production_ready'] is False
          assert manifest['architectureVersion'] == 4
          assert manifest['productionReady'] is False
          assert manifest['validationWriters'] == 1
          print('Pri Ink V4 research promotion lock: PASS')
          PY
