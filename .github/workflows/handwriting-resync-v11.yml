name: One-shot handwriting iOS resync

on:
  push:
    branches:
      - handwriting-v11-hardening

permissions:
  contents: write

jobs:
  sync:
    if: contains(github.event.head_commit.message, '[handwriting-resync-request]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: handwriting-v11-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client
      - run: npm audit --prefix client --audit-level=high
      - run: npm run build
      - run: npm run sync:ios
      - run: npm run check:ios
      - name: Commit generated native web bundle
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ios/PriLearning.swiftpm/Resources/Web
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Resync iOS bundle for Handwriting V11 [handwriting-resync-generated]'
          git push origin HEAD:handwriting-v11-hardening
