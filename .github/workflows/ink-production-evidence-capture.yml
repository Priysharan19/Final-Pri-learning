name: Ink Production Evidence Capture

on:
  pull_request:
    paths:
      - 'client/src/ink/productionEvidence.js'
      - 'client/src/components/InkPhysicalEvidenceSession.jsx'
      - 'client/src/pages/Practice.jsx'
      - 'client/test/ink-production-evidence-capture-check.mjs'
      - 'tools/ink-collect-v2/index.html'
      - '.github/workflows/ink-production-evidence-capture.yml'
  push:
    branches: [main]
    paths:
      - 'client/src/ink/productionEvidence.js'
      - 'client/src/components/InkPhysicalEvidenceSession.jsx'
      - 'client/src/pages/Practice.jsx'
      - 'client/test/ink-production-evidence-capture-check.mjs'
      - 'tools/ink-collect-v2/index.html'
      - '.github/workflows/ink-production-evidence-capture.yml'

concurrency:
  # Pull-request runs share one group per pull request, so a newer push supersedes the
  # queued or running check. Every other run (main, schedule, manual dispatch)
  # gets its own group, so it is never cancelled or replaced while pending.
  group: ink-production-evidence-capture-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  capture-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify production evidence capture contract
        run: node client/test/ink-production-evidence-capture-check.mjs
