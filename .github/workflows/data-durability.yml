name: Data Durability

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'data/**'
      - 'release/**'
  pull_request:
    paths:
      - 'client/src/api.js'
      - 'client/src/local/backend.js'
      - 'client/src/local/idb.js'
      - 'client/src/local/restoreGuard.js'
      - 'client/test/restore-durability-check.mjs'
      - 'client/test/backend-check.mjs'
      - '.github/workflows/data-durability.yml'

permissions:
  contents: read

# A PR can accumulate many commits while the restore surface remains in its
# overall diff. Only the newest exact head is release evidence; older queued
# heads waste runners and can never become the merge authority.
concurrency:
  group: data-durability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restore:
    name: Backup restore rollback and local backend regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        run: npm ci --prefix client
      # The local backend is marked only by the real /v1 server, which the
      # regression suite boots in-process (online-only grading).
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Mid-restore failure injection
        run: node client/test/restore-durability-check.mjs
      - name: Local backend regression
        run: node client/test/backend-check.mjs
      - name: Production client build
        run: npm run build