name: Temporary NCERT browser verification

on:
  push:
    branches:
      - feature/ncert-class8-rational-complete

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ncert-class8-rational-complete
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Install Chromium
        run: npx --prefix client playwright install --with-deps chromium
      - name: End-to-end and accessibility suites
        run: npm run test:browser
