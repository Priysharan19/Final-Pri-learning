name: Pri Learning CodeQL scope
# Scan source, not generated copies of it. The two iPad packages carry a tracked,
# minified mirror of client/dist (refreshed by `npm run sync:ios`), so every
# client finding would otherwise be reported three times on hashed file names
# that change on every build. The source under client/src is what is scanned.
paths-ignore:
  - ios/PriLearning.swiftpm/Resources/Web
  - "ios/PriLearning 2.swiftpm/Resources/Web"
  - client/dist
  - android/**/build
  - node_modules
# js/missing-rate-limiting runs from the local pack below, which also models the
# platform limiter rateLimit() (server/platform/security.js) — issue #569. The
# stock copy is excluded and the local copy (same id, so alert history carries
# over) is included back by its tag. Filters apply in order.
queries:
  - uses: ./.github/codeql/rate-limit
query-filters:
  - exclude:
      id: js/missing-rate-limiting
  - include:
      tags contain: pri/rate-limit-model
