<!doctype html>
<html lang="en" data-edition="%PRI_EDITION%" data-brand="%PRI_BRAND%" data-brand-hi="%PRI_BRAND_HI%">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="%PRI_DESCRIPTION%">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="%PRI_BRAND%">
<meta name="theme-color" content="#f2f0ea">
<meta name="pri-cloud-origin" content="">
<title>%PRI_BRAND%</title>
<!-- The last resort, and the only part of the boot that needs no script at all:
     if the splash is still up after twelve seconds and boot-guard.js is not
     there to say something better (it marks <html data-boot-guard> when it
     runs), these words and a plain link appear under the mark. boot-guard.js
     explains why this cannot be left to a script. -->
<style>
#bs-late{position:absolute;left:0;right:0;top:calc(50% + 72px);padding:0 24px;text-align:center;visibility:hidden;animation:bs-late 0s linear 12s forwards;color:var(--ink-2,CanvasText);font:15px/1.5 var(--font,system-ui,sans-serif)}
#bs-late p{margin:0 auto 6px;max-width:34em}
#bs-late a{color:var(--ink,CanvasText)}
html[data-boot-guard] #bs-late{display:none}
@keyframes bs-late{to{visibility:visible}}
%PRI_EDITION_TOKENS%
</style>
<script src="/theme-boot.js"></script>
<script src="/boot-guard.js"></script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="mask-icon" href="/mask-icon.svg" color="%PRI_ACCENT%">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
<div id="root"><div id="bs" style="position:fixed;inset:0;display:grid;place-items:center;background:var(--page)"><img src="/splash.svg" width="96" height="96" alt=""><div id="bs-late"><p lang="en">Still loading %PRI_BRAND%. This is taking longer than it should. You can keep waiting, or reload.</p>%PRI_BOOT_SLOW_HI%<p><a href="">%PRI_BOOT_RELOAD%</a></p></div></div></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
