<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Pri Learning — maths practice for Indian students: NCERT Classes 7–12, JEE Main & Advanced and olympiad. Questions generated and marked on your device, handwriting read line by line, worked solutions. Offline-first; a Pri cloud account is optional." />
    <meta name="keywords" content="NCERT maths, CBSE Class 7 8 9 10 11 12, JEE Main, JEE Advanced, olympiad, IOQM, handwriting maths practice" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pri Learning" />
    <meta name="theme-color" content="#f2f0ea" />
    <!-- Optional cloud origin for static hosting. Leave empty when the app is
         served by the Pri platform server (auto-discovered) or when
         VITE_PRI_CLOUD_ORIGIN was set at build time. See docs/production-deployment.md. -->
    <meta name="pri-cloud-origin" content="" />
    <title>Pri Learning</title>
    <!-- Paints the remembered theme before first paint; see src/lib/theme.js. -->
    <script src="/theme-boot.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"><div class="boot-splash" aria-hidden="true"><svg viewBox="0 0 100 100" width="96" height="96"><style>
.boot-splash{position:fixed;inset:0;display:grid;place-items:center;background:#f2f0ea}
[data-theme=dark] .boot-splash{background:#121210}
.boot-splash .s,.boot-splash .b{fill:none;stroke:#1a1d21}[data-theme=dark] .boot-splash .s,[data-theme=dark] .boot-splash .b{stroke:#f3efe6}
.boot-splash .s{stroke-width:17;stroke-dasharray:76;stroke-dashoffset:76;animation:pri-d .3s cubic-bezier(.6,0,.3,1) .05s forwards}
.boot-splash .b{stroke-width:14;stroke-dasharray:106;stroke-dashoffset:106;animation:pri-d .42s cubic-bezier(.5,0,.25,1) .33s forwards}
.boot-splash .p{fill:#b8402a;transform-box:fill-box;transform-origin:70% 0;transform:scale(1,0);animation:pri-q .2s cubic-bezier(.2,.8,.3,1) .78s forwards}
[data-theme=dark] .boot-splash .p{fill:#d9604a}
@keyframes pri-d{to{stroke-dashoffset:0}}@keyframes pri-q{to{transform:scale(1,1)}}
@media (prefers-reduced-motion:reduce){.boot-splash .s,.boot-splash .b,.boot-splash .p{animation:none;stroke-dashoffset:0;transform:none}}</style><g transform="translate(0 2) scale(1)"><path class="s" d="M24 13V88"/><path class="b" d="M24 20H47a21.5 21.5 0 0 1 0 43H24"/><path class="p" d="M82 5L92.5 7.2L83.5 30L77 28.4Z"/></g></svg></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
